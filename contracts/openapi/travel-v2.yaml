openapi: 3.1.0
info:
  title: UBI Travel v2 — supplier-adapter flights and stays, carts, orders, servicing, airport transfers
  version: 2.0.0
  description: >
    Supersedes One-Ticket flights.yaml/stays.yaml for the launch. Every promise on screen is an adapter capability on the specific offer.
    Orders are per item; there is no atomic transaction across suppliers. Unknown results reconcile by UBI reference — never re-purchase.
servers: [{ url: https://api.ubi.africa }]
security: [{ bearer: [] }]
paths:
  /v1/travel/flights/searches:
    post:
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [from, to, departDate, passengers],
                      properties:
                        {
                          from: { type: string },
                          to: { type: string },
                          departDate: { type: string, format: date },
                          returnDate: { type: string, format: date },
                          passengers: { type: integer, minimum: 1 },
                          cabin: { type: string, enum: [economy, business] },
                        },
                    },
                },
            },
        }
      responses:
        {
          "201":
            {
              description: ok,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/FlightSearch" } },
                },
            },
          "404": { description: feature_disabled },
        }
  /v1/travel/flights/searches/{searchId}:
    get:
      {
        parameters:
          [
            {
              name: searchId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        responses:
          {
            "200":
              {
                description: refreshed prices,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/FlightSearch" } },
                  },
              },
          },
      }
  /v1/travel/stays/searches:
    post:
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [city, checkIn, checkOut, guests],
                      properties:
                        {
                          city: { type: string },
                          near: { type: string },
                          checkIn: { type: string, format: date },
                          checkOut: { type: string, format: date },
                          guests: { type: integer },
                        },
                    },
                },
            },
        }
      responses:
        {
          "201":
            {
              description: ok,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          properties:
                            {
                              searchId: { type: string },
                              properties:
                                {
                                  type: array,
                                  items:
                                    { $ref: "#/components/schemas/Property" },
                                },
                            },
                        },
                    },
                },
            },
        }
  /v1/travel/stays/{propertyId}/rates:
    get:
      parameters:
        [
          {
            name: propertyId,
            in: path,
            required: true,
            schema: { type: string },
          },
          {
            name: searchId,
            in: query,
            required: true,
            schema: { type: string },
          },
        ]
      responses:
        {
          "200":
            {
              description: ok,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Rate" },
                        },
                    },
                },
            },
        }
  /v1/travel/carts:
    post:
      {
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [items],
                        properties:
                          {
                            items:
                              {
                                type: array,
                                items:
                                  {
                                    type: object,
                                    required: [kind, offerRef],
                                    properties:
                                      {
                                        kind:
                                          {
                                            type: string,
                                            enum: [flight, stay],
                                          },
                                        offerRef: { type: string },
                                        fareFamilyId: { type: string },
                                        rateId: { type: string },
                                      },
                                  },
                              },
                          },
                      },
                  },
              },
          },
        responses:
          {
            "201":
              {
                description: ok,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Cart" } },
                  },
              },
          },
      }
  /v1/travel/carts/{cartId}/passengers:
    put:
      {
        parameters:
          [
            {
              name: cartId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Passenger" },
                      },
                  },
              },
          },
        responses: { "200": { description: ok } },
      }
  /v1/travel/carts/{cartId}/checkout:
    post:
      summary: Revalidate every item with its supplier, then create per-item orders
      parameters:
        [
          { name: cartId, in: path, required: true, schema: { type: string } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [paymentMethodId],
                      properties:
                        {
                          paymentMethodId: { type: string },
                          grantId:
                            { type: string, description: from Ask review },
                          assurance:
                            {
                              type: object,
                              properties:
                                {
                                  method: { type: string },
                                  proof: { type: string },
                                },
                            },
                          expectedTotal: { $ref: "#/components/schemas/Money" },
                        },
                    },
                },
            },
        }
      responses:
        "202":
          {
            description: orders created and executing,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [tripId, orders],
                        properties:
                          {
                            tripId: { type: string },
                            orders:
                              {
                                type: array,
                                items: { $ref: "#/components/schemas/Order" },
                              },
                          },
                      },
                  },
              },
          }
        "409":
          {
            description: repriced — cart returned with diff,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Cart" } },
              },
          }
  /v1/travel/orders/{orderId}:
    get:
      {
        parameters:
          [
            {
              name: orderId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        responses:
          {
            "200":
              {
                description: ok,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Order" } },
                  },
              },
          },
      }
  /v1/travel/orders/{orderId}/cancel:
    post:
      {
        parameters:
          [
            {
              name: orderId,
              in: path,
              required: true,
              schema: { type: string },
            },
            { $ref: "#/components/parameters/IdempotencyKey" },
          ],
        responses:
          {
            "202":
              {
                description: cancellation requested; refund tracked,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Refund" } },
                  },
              },
            "409": { description: not cancellable (policy) },
          },
      }
  /v1/travel/refunds/{refundId}:
    get:
      {
        parameters:
          [
            {
              name: refundId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        responses:
          {
            "200":
              {
                description: ok,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Refund" } },
                  },
              },
          },
      }
  /v1/travel/orders/{orderId}/disruption:
    get:
      {
        parameters:
          [
            {
              name: orderId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        responses:
          {
            "200":
              {
                description: ok,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Disruption" } },
                  },
              },
            "404": { description: no disruption },
          },
      }
  /v1/travel/orders/{orderId}/switch:
    post:
      {
        parameters:
          [
            {
              name: orderId,
              in: path,
              required: true,
              schema: { type: string },
            },
            { $ref: "#/components/parameters/IdempotencyKey" },
          ],
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [alternativeId],
                        properties:
                          {
                            alternativeId: { type: string },
                            grantId: { type: string },
                          },
                      },
                  },
              },
          },
        responses:
          {
            "202":
              {
                description: switching,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Order" } },
                  },
              },
            "409": { description: alternative no longer held },
          },
      }
  /v1/travel/trips/{tripId}:
    get:
      {
        parameters:
          [
            {
              name: tripId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        responses:
          {
            "200":
              {
                description: itinerary,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Trip" } },
                  },
              },
          },
      }
  /v1/travel/trips/{tripId}/linked:
    get:
      {
        parameters:
          [
            {
              name: tripId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        responses:
          {
            "200":
              {
                description: linked orders with separate outcomes,
                content:
                  {
                    application/json:
                      {
                        schema:
                          {
                            type: array,
                            items: { $ref: "#/components/schemas/LinkedItem" },
                          },
                      },
                  },
              },
          },
      }
  /v1/reservations:
    post:
      summary: Ask for an airport transfer (an intent — never secured transport)
      description: >
        Links a ride to a leg of the caller's own FLIGHT order (confirmed or ticketed, same city). The pickup window is
        derived server-side from the leg under the city's airport policy (arrival — scheduled landing + the arrival buffer;
        departure — ending in time to reach the airport before check-in closes, on the routed drive time). Nothing is
        requested, reserved or charged by this call: travel-service makes a Book for Later scheduled request on
        ride-service, signed as the traveller, once the pickup is inside the market horizon, and the transfer becomes
        `awarded` only when ride-service reports the traveller's own selected award. Idempotent: a replay answers the
        stored result; a replay with a different body is 409 idempotency_key_reuse. Behind the deny-by-default
        `reservations` flag (404 feature_disabled while off). Every /v1/reservations route reads the caller and the city
        from the gateway's signed `x-ubi-identity` context (required in production — the plain mirrors alone are 401; a
        declared X-City-ID that differs from the verified city is 403), because travel-service re-signs that identity
        for ride-service; every POST also needs the gateway's `mp:request` scope (limited mode is 403 limited_mode).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAirportTransfer" }
      responses:
        "202":
          description: the intent as accepted (pending — no driver yet)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AirportTransfer" }
        "404":
          {
            description: feature_disabled / not_found (no such flight order of yours),
          }
        "409":
          { description: idempotency_key_reuse / conflict (flight not booked) }
        "422":
          description: "validation_failed (not a flight order; leg or airport unknown; too soon; currency) / payment_method_unavailable"
    get:
      summary: The caller's airport transfers
      parameters:
        - {
            name: linkedOrderId,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: transfers, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/AirportTransfer" },
                    }
        "404": { description: feature_disabled }
  /v1/reservations/{transferId}:
    get:
      parameters:
        - {
            name: transferId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          description: the transfer's current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AirportTransfer" }
        "404": { description: feature_disabled / not_found }
  /v1/reservations/{transferId}/decision:
    post:
      summary: The traveller's choice on their transfer
      description: >
        `keep`, `cancel`, `rerequest` and `approve_limit` — only the choices `actionRequired` offers (cancel is always
        allowed while live). Cancelling before an award is free; an awarded ride is cancelled under the ride's OWN rules,
        which ride-service applies (a refusal changes nothing). `rerequest` cancels the current ride under its rules and
        makes a new scheduled request for the new flight time with the same approved limit — a driver is not guaranteed.
        Idempotent under the Idempotency-Key.
      parameters:
        - {
            name: transferId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [choice]
              properties:
                choice:
                  {
                    type: string,
                    enum: [keep, cancel, rerequest, approve_limit],
                  }
                maxFareMinor: { $ref: "#/components/schemas/Money" }
      responses:
        "200":
          description: the transfer after the choice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AirportTransfer" }
        "409":
          description: "conflict (choice not offered; driver secured meanwhile; busy) / ride-service's own refusal code / idempotency_key_reuse"
        "503": { description: ride-service did not answer; nothing changed }
  /v1/reservations/{transferId}/cancel:
    post:
      summary: Shorthand for decision `cancel`
      parameters:
        - {
            name: transferId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: the transfer after the cancellation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AirportTransfer" }
        "409": { description: see /decision }
  /v1/ops/travel/flight-status:
    post:
      summary: Record a verified flight status observation (travel-ops only)
      description: >
        Deduped by (source, eventId) and applied monotonically by observedAt (a cancellation is final) to the leg's live
        transfers in one transaction. Before a scheduled request exists the window moves; before publication the request
        is withdrawn and re-made with the same approved limit; once drivers were asked or a driver is secured the
        traveller is offered choices and nothing moves. A cancelled flight withdraws a not-yet-secured ride for free and
        never cancels a secured one. The flight's own refund follows its order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [eventId, orderId, legIndex, status, observedAt]
              properties:
                eventId: { type: string }
                orderId: { type: string }
                legIndex: { type: integer, minimum: 0 }
                status: { type: string, enum: [delayed, cancelled] }
                departAt: { type: string, format: date-time }
                arriveAt: { type: string, format: date-time }
                observedAt: { type: string, format: date-time }
                source: { type: string }
      responses:
        "201":
          description: recorded and applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlightStatusResult" }
        "200":
          description: a duplicate — nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlightStatusResult" }
        "403": { description: not a travel-ops principal }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
  schemas:
    AirportTransferPlace:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        label: { type: string, maxLength: 120 }
    CreateAirportTransfer:
      type: object
      additionalProperties: false
      description: >
        Never a pickup time, a user, a role, a city or a fare bound — those come from the gateway context and the
        server's policy.
      required:
        [
          linkedOrderId,
          direction,
          airportPoint,
          place,
          vehicleClass,
          maxFareMinor,
          paymentMethodId,
        ]
      properties:
        linkedOrderId:
          { type: string, description: a FLIGHT order of the caller's }
        legIndex: { type: integer, minimum: 0, default: 0 }
        direction: { type: string, enum: [arrival_pickup, departure_dropoff] }
        airportPoint: { $ref: "#/components/schemas/AirportTransferPlace" }
        place: { $ref: "#/components/schemas/AirportTransferPlace" }
        vehicleClass: { type: string }
        maxFareMinor:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: the traveller's approved spend limit — every retime of this transfer stays within it
        requestedFareMinor: { $ref: "#/components/schemas/Money" }
        paymentMethodId: { type: string }
    AirportTransfer:
      type: object
      required:
        [
          transferId,
          linkedOrderId,
          direction,
          status,
          driverSecured,
          statusLabel,
          notice,
          terms,
        ]
      properties:
        transferId: { type: string }
        linkedOrderId: { type: string }
        direction: { type: string, enum: [arrival_pickup, departure_dropoff] }
        legIndex: { type: integer }
        flightNumber: { type: string, nullable: true }
        airportCode: { type: string }
        status:
          {
            type: string,
            enum: [pending_unassigned, requested, awarded, failed, cancelled],
          }
        driverSecured:
          { type: boolean, description: true ONLY when status is awarded }
        statusLabel: { type: string }
        notice: { type: string }
        pickup: { $ref: "#/components/schemas/AirportTransferPlace" }
        dropoff: { $ref: "#/components/schemas/AirportTransferPlace" }
        pickupWindow:
          type: object
          nullable: true
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            timeZone: { type: string }
            label: { type: string }
        arriveBy:
          type: object
          nullable: true
          properties:
            at: { type: string, format: date-time }
            timeZone: { type: string }
            label: { type: string }
        flight:
          type: object
          properties:
            departAt: { type: string, format: date-time }
            arriveAt: { type: string, format: date-time }
            status: { type: string, enum: [scheduled, delayed, cancelled] }
        vehicleClass: { type: string }
        approvedMaxFareMinor: { $ref: "#/components/schemas/Money" }
        paymentMethodId: { type: string }
        policyVersion: { type: string }
        ride:
          type: object
          nullable: true
          properties:
            scheduledRequestId: { type: string, nullable: true }
            requestId: { type: string, nullable: true }
            state: { type: string, nullable: true }
            requestState: { type: string, nullable: true }
        retimedCount: { type: integer }
        actionRequired:
          type: object
          nullable: true
          properties:
            reason:
              type: string
              enum:
                [
                  flight_changed_after_award,
                  flight_changed_after_publication,
                  flight_cancelled,
                  fare_above_approval,
                  ride_needs_approval,
                ]
            message: { type: string }
            choices:
              type: array
              items:
                type: object
                properties:
                  key:
                    {
                      type: string,
                      enum: [keep, cancel, rerequest, approve_limit],
                    }
                  label: { type: string }
            minimumFareMinor: { $ref: "#/components/schemas/Money" }
            proposal: { type: object, additionalProperties: true }
        outcome:
          type: object
          nullable: true
          properties:
            reason: { type: string }
            message: { type: string }
        terms: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FlightStatusResult:
      type: object
      required: [duplicate, applied]
      properties:
        duplicate: { type: boolean }
        applied:
          type: array
          items:
            type: object
            properties:
              transferId: { type: string }
              outcome:
                type: string
                enum:
                  [
                    retimed,
                    retime_pending,
                    choices_offered,
                    cancelled,
                    cancel_pending,
                    unchanged,
                    ignored_stale,
                    ignored_flight_already_cancelled,
                  ]
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          { type: integer, format: int64, description: minor units (kobo) }
        currency: { type: string, example: NGN }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    Capabilities:
      type: object
      required:
        [
          holdSupported,
          merchantOfRecord,
          changeSupported,
          refundSupported,
          currency,
        ]
      properties:
        holdSupported: { type: boolean }
        priceGuaranteeUntil:
          {
            type: string,
            format: date-time,
            description: only when the adapter guarantees the price; never a seat reservation,
          }
        merchantOfRecord: { type: string, enum: [ubi, supplier] }
        changeSupported: { type: boolean }
        refundSupported: { type: boolean }
        currency: { type: string }
        payAtProperty: { type: boolean }
    FlightSearch:
      type: object
      required: [searchId, pricesAsOf, offers]
      properties:
        {
          searchId: { type: string },
          pricesAsOf: { type: string, format: date-time },
          offers:
            {
              type: array,
              items: { $ref: "#/components/schemas/FlightOffer" },
            },
        }
    FlightOffer:
      type: object
      required:
        [
          offerRef,
          carrier,
          flightNumber,
          departAt,
          arriveAt,
          durationMin,
          stops,
          fareFamilies,
          capabilities,
        ]
      properties:
        offerRef: { type: string }
        carrier: { type: string, example: Air Peace }
        flightNumber: { type: string, example: P4 7120 }
        aircraft: { type: string }
        departAt:
          { type: string, format: date-time, description: local with offset }
        arriveAt: { type: string, format: date-time }
        departTerminal: { type: string }
        arriveTerminal: { type: string }
        durationMin: { type: integer }
        stops: { type: integer }
        soldOut: { type: boolean }
        fareFamilies:
          { type: array, items: { $ref: "#/components/schemas/FareFamily" } }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
    FareFamily:
      type: object
      required: [id, name, price, baggage, changeRule, refundRule]
      properties:
        id: { type: string }
        name: { type: string, example: Saver }
        price: { $ref: "#/components/schemas/Money" }
        base: { $ref: "#/components/schemas/Money" }
        taxes: { $ref: "#/components/schemas/Money" }
        baggage: { type: string, example: 20 kg checked }
        changeRule: { type: string, example: change ₦15, 000 + fare difference }
        refundRule: { type: string, example: non-refundable (taxes refundable) }
        protectionOffered:
          {
            type: boolean,
            description: Journey Protection available for this fare at checkout,
          }
        seatsLeft: { type: integer }
    Property:
      type: object
      required: [id, name, area, distanceKm, fromPrice]
      properties:
        {
          id: { type: string },
          name: { type: string },
          area: { type: string },
          distanceKm: { type: number },
          distanceTo: { type: string },
          fromPrice: { $ref: "#/components/schemas/Money" },
          photos: { type: array, items: { type: string, format: uri } },
        }
    Rate:
      type: object
      required:
        [
          id,
          roomName,
          occupancy,
          payNow,
          payAtProperty,
          cancellation,
          capabilities,
        ]
      properties:
        id: { type: string }
        roomName: { type: string }
        board: { type: string, example: breakfast included }
        occupancy:
          {
            type: object,
            properties:
              {
                minAdults: { type: integer },
                maxAdults: { type: integer },
                bookable: { type: boolean },
                reason: { type: string },
              },
          }
        payNow: { $ref: "#/components/schemas/Money" }
        payAtProperty: { $ref: "#/components/schemas/Money" }
        supplierPrice:
          {
            $ref: "#/components/schemas/Money",
            description: in supplier currency when different,
          }
        fx:
          {
            type: object,
            properties:
              {
                rate: { type: number },
                lockedUntil: { type: string, format: date-time },
              },
          }
        taxesNote: { type: string }
        cancellation:
          {
            type: object,
            required: [freeUntil, penaltyAfter],
            properties:
              {
                freeUntil: { type: string, format: date-time },
                penaltyAfter: { type: string },
              },
          }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
    Passenger:
      type: object
      required: [givenNames, surname, dateOfBirth, phone]
      properties:
        {
          givenNames: { type: string },
          surname: { type: string },
          title: { type: string },
          dateOfBirth: { type: string, format: date },
          phone: { type: string },
          identityRef:
            {
              type: string,
              description: opaque KYC reference; documents are never forwarded,
            },
          save: { type: boolean },
        }
    Cart:
      type: object
      required: [id, items, fees, total, status]
      properties:
        id: { type: string }
        status:
          {
            type: string,
            enum: [building, priced, repriced, paying, checked_out, expired],
          }
        items:
          {
            type: array,
            items:
              {
                type: object,
                properties:
                  {
                    kind: { type: string },
                    title: { type: string },
                    detail: { type: string },
                    price: { $ref: "#/components/schemas/Money" },
                    previousPrice: { $ref: "#/components/schemas/Money" },
                    terms: { type: array, items: { type: string } },
                  },
              },
          }
        fees:
          {
            type: array,
            items:
              {
                type: object,
                properties:
                  {
                    label: { type: string },
                    amount: { $ref: "#/components/schemas/Money" },
                  },
              },
          }
        adjustments:
          { type: array, items: { type: object, additionalProperties: true } }
        total: { $ref: "#/components/schemas/Money" }
        previousTotal: { $ref: "#/components/schemas/Money" }
    Order:
      type: object
      required: [id, kind, state, ladder, price]
      properties:
        id: { type: string, description: canonical UBI id }
        tripId: { type: string }
        kind: { type: string, enum: [flight, stay] }
        state:
          {
            type: string,
            enum:
              [
                payment_authorized,
                submitted,
                supplier_pending,
                confirmed,
                ticketed,
                failed_released,
                unknown_reconciling,
                cancelled,
                refunded,
              ],
          }
        ladder:
          {
            type: array,
            items:
              {
                type: object,
                required: [step, state],
                properties:
                  {
                    step:
                      {
                        type: string,
                        enum:
                          [
                            payment_authorized,
                            submitted,
                            supplier_confirmed,
                            ticketed,
                            prebooked,
                            booked,
                          ],
                      },
                    state:
                      { type: string, enum: [done, active, pending, skipped] },
                    at: { type: string, format: date-time },
                    detail: { type: string },
                  },
              },
          }
        supplierRefs:
          {
            type: object,
            properties:
              {
                pnr: { type: string },
                ticketNumbers: { type: array, items: { type: string } },
                bookingRef: { type: string },
                orderRef: { type: string },
              },
          }
        price: { $ref: "#/components/schemas/Money" }
        held: { $ref: "#/components/schemas/Money" }
        charged: { $ref: "#/components/schemas/Money" }
        released: { $ref: "#/components/schemas/Money" }
        policy:
          {
            type: object,
            properties:
              {
                cancellation: { type: string },
                change: { type: string },
                freeUntil: { type: string, format: date-time },
              },
          }
        protection:
          {
            type: object,
            properties:
              { covered: { type: boolean }, ruleId: { type: string } },
          }
    Refund:
      type: object
      required: [id, orderId, amount, stage]
      properties:
        {
          id: { type: string },
          orderId: { type: string },
          amount: { $ref: "#/components/schemas/Money" },
          stage:
            {
              type: string,
              enum:
                [
                  requested,
                  supplier_confirmed,
                  supplier_refund_pending,
                  refunded_to_wallet,
                  rejected,
                ],
            },
          expectedBy: { type: string, format: date },
          penalty: { $ref: "#/components/schemas/Money" },
          steps:
            {
              type: array,
              items:
                {
                  type: object,
                  properties:
                    {
                      label: { type: string },
                      state: { type: string },
                      at: { type: string, format: date-time },
                      detail: { type: string },
                    },
                },
            },
        }
    Disruption:
      type: object
      required:
        [cause, verifiedAt, eligibility, airlineOptions, alternatives, refund]
      properties:
        cause:
          {
            type: string,
            enum: [airline_cancelled, schedule_change, delay_major],
          }
        verifiedAt: { type: string, format: date-time }
        eligibility:
          {
            type: object,
            required: [covered],
            properties:
              {
                covered: { type: boolean },
                ruleId: { type: string },
                fundedBy: { type: string },
                cap: { $ref: "#/components/schemas/Money" },
                reason: { type: string },
              },
          }
        airlineOptions:
          {
            type: array,
            items: { $ref: "#/components/schemas/Alternative" },
            description: statutory options from the operating carrier,
            listed first when not covered,
          }
        alternatives:
          { type: array, items: { $ref: "#/components/schemas/Alternative" } }
        refund:
          {
            type: object,
            properties:
              {
                amount: { $ref: "#/components/schemas/Money" },
                path: { type: string },
                etaDays: { type: string },
              },
          }
        linkedRideImpact: { type: string }
    Alternative:
      type: object
      required:
        [id, carrier, flightNumber, departAt, arriveAt, price, customerPays]
      properties:
        {
          id: { type: string },
          carrier: { type: string },
          flightNumber: { type: string },
          departAt: { type: string, format: date-time },
          arriveAt: { type: string, format: date-time },
          fareFamily: { type: string },
          baggage: { type: string },
          seatsLeft: { type: integer },
          price: { $ref: "#/components/schemas/Money" },
          covered: { $ref: "#/components/schemas/Money" },
          customerPays: { $ref: "#/components/schemas/Money" },
          heldUntil:
            {
              type: string,
              format: date-time,
              description: present only when the seat is actually held,
            },
        }
    Trip:
      type: object
      required: [id, title, timezone, items]
      properties:
        {
          id: { type: string },
          title: { type: string },
          startDate: { type: string, format: date },
          endDate: { type: string, format: date },
          timezone: { type: string, example: Africa/Lagos },
          items:
            { type: array, items: { $ref: "#/components/schemas/LinkedItem" } },
        }
    LinkedItem:
      type: object
      required: [kind, title, status]
      properties:
        kind:
          {
            type: string,
            enum:
              [
                flight,
                stay,
                airport_transfer,
                ride_reservation,
                return_flight_placeholder,
              ],
          }
        orderId: { type: string }
        transferId: { type: string }
        reservationId:
          {
            type: string,
            description: legacy link only (never a marketplace request; status not_reserved),
          }
        driverSecured: { type: boolean }
        title: { type: string }
        subtitle: { type: string }
        status:
          {
            type: string,
            enum:
              [
                ticketed,
                confirmed,
                supplier_pending,
                not_reserved,
                pending_unassigned,
                requested,
                awarded,
                failed,
                reserved,
                assigned,
                completed,
                cancelled,
                refunded,
                not_booked,
              ],
          }
        charged: { $ref: "#/components/schemas/Money" }
        policy: { type: string }
        disruption: { type: string }
        actions:
          {
            type: array,
            items:
              {
                type: object,
                properties:
                  {
                    key: { type: string },
                    label: { type: string },
                    primary: { type: boolean },
                  },
              },
          }
