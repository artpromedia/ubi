              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletHold" }
  /v1/wallet/mp/holds/{reservationId}/release:
    post:
      summary: Release a hold once (internal; refuses while its award is unresolved)
      security: [{ serviceKey: [] }]
      parameters:
        - {
            name: reservationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletHold" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/wallet/mp/holds/{reservationId}/capture:
    post:
      summary: Capture the winning hold exactly once under the award id (internal)
      description: "Posts the single 10% commission journal debit (wallet → ubi_commission) with counterpart award reference. Idempotent on the award id; a repeat answers the original receipt. `expectedAmountMinor` is the award's pinned commission: a hold whose current amount differs (e.g. a bid revision raced the selection) is REFUSED with 409 conflict so the saga compensates instead of debiting terms that were never awarded. Completion settlement must not charge the fee again."
      security: [{ serviceKey: [] }]
      parameters:
        - {
            name: reservationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [awardId, expectedAmountMinor],
                properties:
                  {
                    awardId: { type: string },
                    expectedAmountMinor: { $ref: "#/components/schemas/Money" },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [hold, receiptId, journalEntryId],
                  properties:
                    {
                      hold: { $ref: "#/components/schemas/WalletHold" },
                      receiptId: { type: string },
                      journalEntryId: { type: string },
                    },
                }
  /v1/wallet/mp/funding/authorize:
    post:
      summary: Rider funding authorization for a selection (internal, M05 step 3, C02)
      description: "Service-authenticated. Secures the SELECTED amount with the request's stored payment method. `wallet` creates a DURABLE reservation (a table row, never a journal movement) that encumbers spendable from selection until settlement consumes it or a release frees it — idempotent on the award id: an identical replay answers the existing reservation (`secured: true`, its `reservationId`), a replay with different terms is a 409 conflict. `cash` is explicitly unsecured (`secured: false`, `reservationId: null`) — availability-checked only, with the audit record stating unsecured collection. Any OTHER config-listed method (card/PSP) FAILS CLOSED with payment_method_unavailable: config availability is not provider authorization, and PSP authorization is not built yet. Nothing is debited — settlement stays at completion. 2xx = authorized; 4xx carries a canonical error code (insufficient_funds with the exact shortfall, payment_method_unavailable, wallet_locked, conflict); 5xx is an unknown outcome the award saga keeps pending."
      security: [{ serviceKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required:
                  [
                    requesterId,
                    requestId,
                    awardId,
                    paymentMethodId,
                    amountMinor,
                    currency,
                    cityId,
                  ],
                properties:
                  {
                    requesterId: { type: string },
                    requestId: { type: string },
                    awardId: { type: string },
                    paymentMethodId: { type: string },
                    amountMinor:
                      {
                        type: integer,
                        description: "Bare integer minor units (matches ride-service's FundingRequest wire shape).",
                      },
                    currency: { type: string },
                    cityId: { type: string },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required:
                    [
                      authorized,
                      awardId,
                      paymentMethodId,
                      secured,
                      reservationId,
                    ],
                  properties:
                    {
                      authorized: { type: boolean, const: true },
                      awardId: { type: string },
                      paymentMethodId: { type: string },
                      secured:
                        {
                          type: boolean,
                          description: "True when a durable reservation encumbers the amount; false for explicitly unsecured cash collection.",
                        },
                      reservationId:
                        {
                          type: string,
                          nullable: true,
                          description: "The reservation backing a secured authorization; null for cash.",
                        },
                    },
                }
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/wallet/mp/funding/release:
    post:
      summary: Release an award's rider funding reservation (internal, C02)
      description: "Service-authenticated. Releases the award's ACTIVE funding reservation exactly once (status released, resolvedAt stamped, reason linked; audit in the same transaction). Idempotent and deliberately forgiving so compensation and the sweep converge instead of error-looping: already-released and never-created both answer 200 with the current state (`released: false` and `status`). A CONSUMED reservation answers `status: consumed` distinctly — the award already settled with this money, and the caller must alarm rather than retry."
      security: [{ serviceKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [awardId, reason],
                properties:
                  { awardId: { type: string }, reason: { type: string } },
              }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [released, status, awardId, reservationId],
                  properties:
                    {
                      released:
                        {
                          type: boolean,
                          description: "True only for the call that actually moved active to released.",
                        },
                      status:
                        {
                          type: string,
                          enum: [released, consumed, missing],
                          description: "The reservation's state after this call. `consumed` means the award already settled — alarm, do not retry.",
                        },
                      awardId: { type: string },
                      reservationId: { type: string, nullable: true },
                    },
                }
  /v1/wallet/mp/holds/{reservationId}/amendments/{amendmentId}/reserve:
    post:
      summary: Reserve a post-award commission increment (internal, A02)
      description: "Service-authenticated. `reservationId` is the award's CAPTURED hold; the amendment id is the idempotency authority (same terms replay 200; different terms 409 idempotency_key_reuse). Encumbers commission(new fare) − captured on the driver's spendable, BEFORE approvals. 422 insufficient_spendable writes nothing; 409 version_conflict (stale prior, refreshedTerms.capturedTotalMinor); 409 conflict (another open amendment on the award, not captured, reversed)."
      security: [{ serviceKey: [] }]
      parameters:
        - {
            name: reservationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: amendmentId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeltaTerms" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionDelta" }
        "200":
          description: "Replay."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionDelta" }
  /v1/wallet/mp/holds/{reservationId}/amendments/{amendmentId}/capture:
    post:
      summary: Capture the committed increment exactly once (internal, A02)
      security: [{ serviceKey: [] }]
      parameters:
        - {
            name: reservationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: amendmentId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [awardId, newTotalMinor],
                properties:
                  {
                    awardId: { type: string },
                    newTotalMinor: { $ref: "#/components/schemas/Money" },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionDelta" }
  /v1/wallet/mp/holds/{reservationId}/amendments/{amendmentId}/release:
    post:
      summary: Release a reserved increment (reject/expiry; safe before any reserve)
      security: [{ serviceKey: [] }]
      parameters:
        - {
            name: reservationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: amendmentId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [awardId, reason],
                properties:
                  { awardId: { type: string }, reason: { type: string } },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionDelta" }
  /v1/wallet/mp/holds/{reservationId}/amendments/{amendmentId}/refund:
    post:
      summary: Refund a committed decrease as a linked partial reversal (internal, A02)
      security: [{ serviceKey: [] }]
      parameters:
        - {
            name: reservationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: amendmentId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeltaTerms" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionDelta" }
  /v1/wallet/mp/funding/top-up:
    post:
      summary: Reserve the rider's funding top-up for a fare increase (internal, A02)
      description: "Service-authenticated; bare-integer amounts. The original reservation is never edited. Cash answers secured:false (no row). 422 insufficient_funds writes nothing; 409 version_conflict (refreshedTerms.fundedAmountMinor); 409 conflict (another open top-up, reservation not active)."
      security: [{ serviceKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundingAmendment" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundingAdjustment" }
  /v1/wallet/mp/funding/top-up/commit:
    post:
      summary: Commit a reserved top-up when its amendment commits (internal, A02)
      security: [{ serviceKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [awardId, amendmentId, newAmountMinor],
                properties:
                  {
                    awardId: { type: string },
                    amendmentId: { type: string },
