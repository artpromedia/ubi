    Amendment:
      {
        type: object,
        description: "A post-award trip amendment (A02, mpAmendment machine). Priced server-side as a DELTA under the award's own pricing snapshot (its quote's city-config version — never today's policy). The original agreement stays in force until `committed`. Every amount is server-computed. The driver additionally sees commissionDeltaMinor (the incremental 10% — captured ONCE on an increase, refunded as a linked partial reversal on a decrease; the award's original capture is never re-charged) and driverNetDeltaMinor; the rider never sees the driver's commission.",
