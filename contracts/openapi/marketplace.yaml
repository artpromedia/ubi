            fareRevision,
            stops,
            dropoff,
            priorFareMinor,
            revisedFareMinor,
            fareDeltaMinor,
            riderFundingDeltaMinor,
            riderFunding,
            addedDistanceMeters,
            addedDurationSec,
            approvals,
            expiresAt,
            createdAt,
          ],
        properties:
          {
            amendmentId: { type: string },
            requestId: { type: string },
            awardId: { type: string },
            kind:
              {
                type: string,
                enum: [route, stop_waiting, early_termination],
                description: "`route` needs both parties' approvals; `stop_waiting` (paid waiting the rider authorized up front under the cap) and `early_termination` (a safe partial journey) are server-proposed and settle through the same linked-adjustment path.",
              },
            state:
              {
                type: string,
                enum:
                  [
                    proposed,
                    awaiting_approvals_and_funding,
                    committed,
                    rejected,
                    expired,
                    failed,
                    compensated,
                  ],
              },
            proposedByRole: { type: string, enum: [rider, driver, system] },
            baseRouteRevision: { type: integer },
            baseFareRevision: { type: integer },
            routeRevision: { type: integer },
            fareRevision: { type: integer },
            stops:
              {
                type: array,
                description: "The COMPLETE ordered stop list the amendment commits: stops already reached first, unchanged; surviving stops keep their stopId.",
                items: { $ref: "#/components/schemas/RouteStop" },
              },
            dropoff: { $ref: "#/components/schemas/TripPlace" },
            priorFareMinor: { $ref: "#/components/schemas/Money" },
            revisedFareMinor: { $ref: "#/components/schemas/Money" },
            fareDeltaMinor:
              {
                $ref: "#/components/schemas/Money",
                description: "Signed: revised − prior.",
              },
            riderFundingDeltaMinor:
              {
                $ref: "#/components/schemas/Money",
                description: "Signed: what the rider's funding adds (reserved as a top-up BEFORE approvals) or gets back (a partial release at commit).",
              },
            riderFunding:
              {
                type: string,
                enum:
                  [
                    pending,
                    reserved,
                    committed,
                    released,
                    release_on_commit,
                    partially_released,
                    not_required,
                    unsecured_cash,
                  ],
              },
            commissionDeltaMinor: { $ref: "#/components/schemas/Money" },
            driverNetDeltaMinor: { $ref: "#/components/schemas/Money" },
            addedDistanceMeters: { type: integer },
            addedDurationSec:
              {
                type: integer,
                description: "Driving time plus expected dwell added (negative when shorter).",
              },
            approvals:
              {
                type: object,
                required: [rider, driver],
                properties:
                  {
                    rider:
                      {
                        type: object,
                        required: [approved],
                        properties:
                          {
                            approved: { type: boolean },
                            approvedAt: { type: string, format: date-time },
                          },
                      },
                    driver:
                      {
                        type: object,
                        required: [approved],
                        properties:
                          {
                            approved: { type: boolean },
                            approvedAt: { type: string, format: date-time },
                          },
                      },
                  },
              },
            expiresAt:
              {
                type: string,
                format: date-time,
                description: "Unapproved amendments expire here (market-configured window) and release everything reserved.",
              },
            reason:
              {
                type: string,
                description: "e.g. next_job_conflict, insufficient_driver_spendable, insufficient_rider_funds, wallet_terms_refreshed, driver_rejected, rider_rejected, approval_window_elapsed, execution_ended, route_changed.",
              },
            pricing:
              {
                type: object,
                additionalProperties: true,
                description: "Driver only: the snapshot pricing (configVersion, policyVersion, per-km/per-minute rates, route delta, server bounds, boundedBy).",
              },
            createdAt: { type: string, format: date-time },
            resolvedAt: { type: string, format: date-time },
          },
      }
