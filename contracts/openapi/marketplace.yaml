                        {
                          type: string,
                          enum: [none, pending, failed_revalidating],
                        },
                    },
                }
  /v1/mp/driver/preferences:
    get:
      summary: Driver preferences in the caller's city (A04.2)
      description: "Version 0 with permissive defaults when the driver never saved any. bounds are derived from the market's policy (widest envelope, stop limit, rate-profile ceilings)."
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPreferences" }
    patch:
      summary: Save a new preferences version (idempotent, versioned)
      description: "Appends version expectedVersion + 1 (a stale expectedVersion or a concurrent writer answers 409 version_conflict with details.currentVersion). Absent fields are unchanged; null clears a nullable field; unknown keys are refused. A PATCH that changes nothing writes nothing. Writes one outbox event (mp.driver_preferences.saved, no homeward coordinates) and one audit row in the same transaction. Saving never touches a bid, hold, award or eligibility, and preferences never place a bid."
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [expectedVersion],
                properties:
                  {
                    expectedVersion: { type: integer, minimum: 0 },
                    minimumTripAmountMinor:
                      {
                        oneOf:
                          [
                            { $ref: "#/components/schemas/Money" },
                            { type: "null" },
                          ],
                      },
                    maxPickupDistanceMeters: { type: [integer, "null"] },
                    acceptsDeliveries: { type: boolean },
                    acceptsStops: { type: boolean },
                    maxStops: { type: [integer, "null"] },
                    homeward:
                      {
                        oneOf:
                          [
                            {
                              type: object,
                              additionalProperties: false,
                              required: [lat, lng, radiusMeters],
                              properties:
                                {
                                  lat: { type: number },
                                  lng: { type: number },
                                  radiusMeters: { type: integer },
                                  label: { type: string, maxLength: 40 },
                                },
                            },
                            { type: "null" },
                          ],
                      },
                    homewardOnly: { type: boolean },
                    availabilityWindows:
                      {
                        type: array,
                        maxItems: 28,
                        items:
                          { $ref: "#/components/schemas/AvailabilityWindow" },
                      },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPreferences" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/bids:
    post:
      summary: Submit a funded bid (D02 → D03)
      description: "Server revalidates eligibility and bounds, then reserves the 10% commission against cleared spendable funds through payment-service BEFORE the bid becomes live (insufficient_spendable with the exact shortfall otherwise). Slot intent (current|next) and the dependency claim are recorded at creation and never silently changed."
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
