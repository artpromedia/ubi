  # ── Book for Later (A03) — ride-service, gateway identity ────────────────
  /v1/mp/scheduled-requests:
    post:
      summary: Schedule a request (A03 product A — no driver is secured)
      description: "Rider only; flag scheduled_rides (deny-by-default) plus marketplace_rides. Stores an INTENT from a fresh quote (route, service and class pinned; the quote is not consumed): pickup as local date/time + IANA timezone (resolved and stored as a UTC instant with its DST resolution), a pickup window, the asked fare (inside the quote's bounds) and the rider's approved maximum. Nothing is published, reserved or charged. At publishAt (the market's lead time) a durable worker re-prices the route, re-checks the payment method and the wallet's spendable, and publishes an ordinary request within the approval (the ceiling tightened to the approved maximum) — or parks the intent in needs_rider_approval with the refreshed terms and a notification. Lead/horizon: at least minLeadSec and at most maxHorizonSec ahead (validation_failed)."
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  quoteId,
                  requestedFareMinor,
                  maxFareMinor,
                  paymentMethodId,
                  schedule,
                ]
              properties:
                quoteId: { type: string }
                requestedFareMinor: { $ref: "#/components/schemas/Money" }
                maxFareMinor: { $ref: "#/components/schemas/Money" }
                paymentMethodId: { type: string }
                schedule: { $ref: "#/components/schemas/PickupScheduleInput" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledRequest" }
        "404":
          {
            description: "feature_disabled (flag off) or the quote is not the rider's.",
          }
        "409": { description: "request_cap_reached, idempotency_key_reuse." }
        "422":
          {
            description: "validation_failed (schedule, lead, horizon, window), fare_out_of_bounds, payment_method_unavailable.",
          }
    get:
      summary: The rider's one-off scheduled requests (occurrences are listed under their series)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ScheduledRequest" }
  /v1/mp/scheduled-requests/{scheduledRequestId}:
    get:
      summary: One scheduled request (owner only; 404 otherwise)
      parameters:
        - {
            name: scheduledRequestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledRequest" }
  /v1/mp/scheduled-requests/{scheduledRequestId}/cancel:
    post:
      summary: Cancel an unpublished scheduled request (a published one is cancelled through its request — request_closed names it)
      parameters:
        - {
            name: scheduledRequestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledRequest" }
        "409": { description: "request_closed (already published / terminal)." }
  /v1/mp/scheduled-requests/{scheduledRequestId}/approve:
    post:
      summary: Renew approval of refreshed terms (needs_rider_approval → scheduled_unassigned)
      description: "The new maximum must be at or above the refreshed minimum (fare_out_of_bounds otherwise); an optional replacement payment method must be available in the city. The next worker pass re-refreshes and publishes — an approval is never stretched over terms that moved again."
      parameters:
        - {
            name: scheduledRequestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, maxFareMinor]
              properties:
                expectedVersion: { type: integer }
                maxFareMinor: { $ref: "#/components/schemas/Money" }
                requestedFareMinor: { $ref: "#/components/schemas/Money" }
                paymentMethodId: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledRequest" }
        "409":
          {
            description: "conflict (not awaiting approval), version_conflict, request_closed.",
          }
  /v1/mp/advance-requests:
    post:
      summary: Publish an advance-booking request (A03 product B)
      description: "Rider only; flag marketplace_advance_reservations (deny-by-default) plus marketplace_rides. Publishes a request (booking.kind=advance) that takes offers NOW for the FUTURE pickup window — no driver is secured until the rider selects an offer (POST /v1/mp/requests/{id}/select), which books that driver in advance. Pickup at least minLeadSec and at most bookingHorizonSec ahead; offers run for offerWindowSec (never past the reconfirmation opening). Drivers bid with slot=advance (stationary manual bidding, the 10% held from the cleared balance)."
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quoteId, requestedFareMinor, paymentMethodId, schedule]
              properties:
                quoteId: { type: string }
                requestedFareMinor: { $ref: "#/components/schemas/Money" }
                paymentMethodId: { type: string }
                schedule: { $ref: "#/components/schemas/PickupScheduleInput" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "404": { description: "feature_disabled." }
        "422":
          {
            description: "validation_failed, fare_out_of_bounds, payment_method_unavailable.",
          }
  /v1/mp/advance-bookings:
    get:
      summary: My advance bookings (rider — theirs; driver — theirs)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdvanceBooking" }
  /v1/mp/advance-bookings/{bookingId}:
    get:
      summary: One advance booking (its rider or its driver; 404 otherwise)
      parameters:
        - {
            name: bookingId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvanceBooking" }
  /v1/mp/advance-bookings/{bookingId}/cancel:
    post:
      summary: Rider cancels before activation — award cancelled, the driver's captured commission returned (linked reversal), rider funding released; no fee in this slice
      parameters:
        - {
            name: bookingId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvanceBooking" }
        "409":
          {
            description: "award_unresolved (still held) or conflict (already ended / activated).",
          }
  /v1/mp/advance-bookings/{bookingId}/reconfirm:
    post:
      summary: Driver reconfirms between reconfirmation.opensAt and deadline (a missed deadline fails the booking, commission returned)
      parameters:
        - {
            name: bookingId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvanceBooking" }
        "403": { description: "driver_ineligible (suspended)." }
        "409":
          { description: "conflict (window not open / closed / wrong state)." }
  /v1/mp/advance-bookings/{bookingId}/withdraw:
    post:
      summary: Driver cannot attend — the booking fails with the reason explained, commission returned, rider funding released, a consented rematch offered; nobody is silently substituted
      parameters:
        - {
            name: bookingId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { type: string, maxLength: 280 } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvanceBooking" }
  /v1/mp/advance-bookings/{bookingId}/rematch:
    post:
      summary: The rider's consent to re-publish a failed booking for the same window
      description: "A NEW advance request (no driver secured) priced with refreshed bounds, at the original asked fare unless the rider names another — never silently raised: a refreshed minimum above it answers fare_out_of_bounds for the rider to decide. Once per booking."
      parameters:
        - {
            name: bookingId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                requestedFareMinor: { $ref: "#/components/schemas/Money" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "409":
          {
            description: "conflict (not rematchable / already rematched / too late).",
          }
  /v1/mp/driver/calendar:
    get:
      summary: The driver's booking calendar — committed future bookings, separate from the live current/next jobs
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [bookings, note]
                properties:
                  bookings:
                    type: array
                    items: { $ref: "#/components/schemas/AdvanceBooking" }
                  note: { type: string }
  /v1/mp/recurring-templates:
    post:
      summary: Create a recurring journey (flag marketplace_recurring_journeys plus the product's flag)
      description: "Occurrences are generated idempotently (one per template and local date, replay-safe) generationHorizonDays ahead; each is its own ScheduledRequest (product scheduled_request or advance_reservation) with its own approval, funding, driver commitment, cancellation and receipt. A date whose local time falls in a DST gap/overlap resolves per dstDisambiguation; with reject that date is recorded as skipped (closeReason dst_ambiguous_time)."
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  quoteId,
                  product,
                  daysOfWeek,
                  localTime,
                  startsOn,
                  requestedFareMinor,
                  maxFareMinor,
                  paymentMethodId,
                ]
              properties:
                quoteId: { type: string }
                product:
                  {
                    type: string,
                    enum: [scheduled_request, advance_reservation],
                  }
                daysOfWeek:
                  type: array
                  minItems: 1
                  items:
                    { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
                localTime: { type: string }
                timeZone: { type: string }
                startsOn: { type: string }
                endsOn: { type: string }
                windowMinutes: { type: integer }
                dstDisambiguation:
                  { type: string, enum: [compatible, earlier, later, reject] }
                requestedFareMinor: { $ref: "#/components/schemas/Money" }
                maxFareMinor: { $ref: "#/components/schemas/Money" }
                paymentMethodId: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringTemplate" }
    get:
      summary: The rider's recurring journeys
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RecurringTemplate" }
  /v1/mp/recurring-templates/{templateId}:
    get:
      summary: One recurring journey with its occurrences
      parameters:
        - {
            name: templateId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringTemplate" }
  /v1/mp/recurring-templates/{templateId}/{command}:
    post:
      summary: Pause, resume or cancel a series
      description: "pause: nothing new is generated or published (a waiting occurrence whose pickup passes lapses); resume: generation and publication continue; cancel: generation stops and unpublished occurrences are cancelled — occurrences already sent to drivers (or booked) are separate trips and stand."
      parameters:
        - {
            name: templateId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: command,
            in: path,
            required: true,
            schema: { type: string, enum: [pause, resume, cancel] },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties: { expectedVersion: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringTemplate" }
        "409":
          { description: "version_conflict, conflict (illegal for the state)." }
  /v1/mp/recurring-templates/{templateId}/occurrences/{date}/skip:
    post:
      summary: Skip one occurrence (generated or not yet generated — generation never resurrects it); the rest of the series is untouched
      parameters:
        - {
            name: templateId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: date,
            in: path,
            required: true,
            schema: { type: string, example: "2026-10-07" },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledRequest" }
        "409":
          {
            description: "conflict (already sent to drivers — cancel its request or booking instead).",
          }
  /v1/mp/requests/{requestId}/receipt:
    get:
      summary: Trip receipt (JSON) — the requester's view or the awarded driver's view
      description: "A COMPLETED marketplace ride only. The requester gets the rider view (itemised agreed fare and committed adjustments, included taxes, total, payment method, trip facts — never the commission); the awarded driver gets the driver view (same lines and total as gross, the 10% captured once plus linked adjustments, net). Anyone else gets 404. The total reconciles exactly with the settlement (agreed fare + committed adjustments); while an adjustment still holds open money the route answers 409 conflict (details.reason settling); before completion 409 conflict (details.reason trip_not_completed). Read-only and not flag-gated: a receipt records a trip that already happened."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "404":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/preferred/decline:
    post:
      summary: The named driver declines a preferred request — free, idempotent, never recorded against them
      description: "Only the invited driver, only while the window is exclusive and the request open (409 conflict otherwise; 409 with details.reason live_offer while they hold a live offer — withdraw it first). Anyone else gets 404 (403 for a non-driver). The window ends at once: open market if the rider consented to fallback, otherwise the request expires free (closeReason preferred_driver_unavailable). The rider is not told whether the driver declined or simply did not answer. Emits mp.request.preferred_driver_declined (audience: that driver) and an audit row; nothing touches standing or reliability. Not flag-gated: a driver can always decline an invitation they received."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferredDecline" }
        "404":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/favourite-drivers:
    get:
      summary: The rider's saved drivers, with whether each can be asked first right now
      description: "Always readable (whatever the flag says), so a rider can always see what is stored about their choices."
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavouriteDrivers" }
    post:
      summary: Save the driver of a completed trip (marketplace_preferred_drivers)
      description: "Body {requestId}: a request of the caller's whose marketplace RIDE was completed (409 conflict details.reason trip_not_completed otherwise; 404 for someone else's request). Idempotent; saving an already-saved driver answers 200 and changes nothing. Emits mp.favourite_driver.saved (audience: the rider only) and an audit row."
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavouriteDriver" }
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavouriteDriver" }
        "404":
          {
            description: "feature_disabled, or not_found (not the caller's request).",
          }
        "409": { description: "conflict (details.reason trip_not_completed)." }
  /v1/mp/favourite-drivers/{driverId}/remove:
    post:
      summary: Remove a saved driver (always allowed)
      parameters:
        - {
            name: driverId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavouriteDriver" }
        "404":
          { description: "not_found — not one of the rider's saved drivers." }
  /v1/mp/service-needs:
    get:
      summary: Service requirements and preferences, with honest availability in the rider's market (marketplace_accessibility_requirements)
      parameters:
        - {
            name: service,
            in: query,
            required: false,
            schema: { type: string, enum: [ride], default: ride },
          }
        - {
            name: vehicleClass,
            in: query,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceNeedsCatalog" }
        "404": { description: "feature_disabled." }
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
