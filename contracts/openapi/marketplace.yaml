openapi: 3.1.0
info:
  {
    title: "UBI Negotiated-Fare Marketplace",
    version: 0.1.0,
    description: "Requester-selected fare marketplace for rides and package deliveries (M01–M09). The requester publishes a server-bounded fare, eligible drivers submit funded private bids (10% commission reserved at bid), and the requester selects the winner (commission debited exactly once at selection). Rider/driver routes are served by ride-service behind the gateway (/mp/* proxy); wallet hold routes are served by payment-service; both are documented here as one contract. Money is integer minor units with explicit currency from city config. All mutating POSTs accept Idempotency-Key. Unconfigured markets fail closed with market_not_configured.",
  }
servers: [{ url: https://api.ubi.africa }]
components:
  securitySchemes:
    {
      bearer: { type: http, scheme: bearer },
      serviceKey: { type: apiKey, in: header, name: X-Service-Key },
    }
  parameters:
    IdemKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, maxLength: 64 },
      }
    Cursor:
      { name: cursor, in: query, required: false, schema: { type: string } }
  schemas:
    Money:
      {
        type: object,
        required: [amountMinor, currency],
        properties:
          {
            amountMinor: { type: integer },
            currency: { type: string, example: NGN },
          },
      }
    Error:
      {
        type: object,
        required: [code, message],
        properties:
          {
            code:
              {
                type: string,
                description: "Canonical error code from @ubi/contracts (e.g. market_not_configured, fare_out_of_bounds, insufficient_spendable, slot_unavailable, award_unresolved, version_conflict).",
              },
            message: { type: string },
            details: { type: object, additionalProperties: true },
          },
      }
    Area:
      {
        type: object,
        required: [label, lat, lng],
        description: "Privacy-safe approximate area. Exact addresses are released only to the awarded driver via the execution service.",
        properties:
          {
            label: { type: string },
            lat: { type: number },
            lng: { type: number },
          },
      }
    StopPurpose:
      {
        type: string,
        enum: [pickup_passenger, drop_passenger, errand, other],
        description: "What an intermediate stop is for. Informs the awarded driver; never changes the price (expected dwell does).",
      }
    StopInput:
      {
        type: object,
        additionalProperties: false,
        required: [lat, lng],
        description: "One intermediate stop as the requester asks for it, in pickup → dropoff order. No stop id, no order and no price: the server assigns the stable id, the array position is the order, and the complete ordered route is priced server-side. Unknown keys are refused.",
        properties:
          {
            lat: { type: number, minimum: -90, maximum: 90 },
            lng: { type: number, minimum: -180, maximum: 180 },
            label: { type: string, maxLength: 80 },
            purpose:
              {
                $ref: "#/components/schemas/StopPurpose",
                description: "Defaults to other.",
              },
            dwellSec:
              {
                type: integer,
                minimum: 0,
                description: "Expected wait at the stop, priced as route time. Defaults to the market's defaultDwellSec (pilot 120); refused above its maxDwellSec (pilot 600).",
              },
          },
      }
    RouteStop:
      {
        type: object,
        required: [stopId, order, label, lat, lng, purpose, dwellSec],
        description: "One ordered intermediate stop on the requester's OWN quote/request (exact — this is their trip). stopId is server-assigned and stable from the quote through the request (and any pre-award route revision that keeps the stop) to the execution ride.",
        properties:
          {
            stopId: { type: string, format: uuid },
            order:
              {
                type: integer,
                minimum: 1,
                description: "1-based position between pickup and dropoff.",
              },
            label: { type: string },
            lat: { type: number },
            lng: { type: number },
            purpose: { $ref: "#/components/schemas/StopPurpose" },
            dwellSec: { type: integer, minimum: 0 },
          },
      }
    FeedStop:
      {
        type: object,
        required: [order, areaLabel, purpose, dwellSec],
        description: "A stop as a driver sees it BEFORE an award: coarsened exactly like the pickup/dropoff area labels — never a coordinate, never the requester's label.",
        properties:
          {
            order: { type: integer, minimum: 1 },
            areaLabel: { type: string },
            purpose: { $ref: "#/components/schemas/StopPurpose" },
            dwellSec: { type: integer, minimum: 0 },
          },
      }
    FeedRoute:
      {
        type: object,
        required:
          [
            stopCount,
            stops,
            routedDistanceMeters,
            routedDurationSec,
            stopsDwellSec,
          ],
        description: "Driver-card summary of a multi-stop request (absent for a plain pickup → dropoff request).",
        properties:
          {
            stopCount: { type: integer, minimum: 1 },
            stops:
              { type: array, items: { $ref: "#/components/schemas/FeedStop" } },
            routedDistanceMeters:
              {
                type: integer,
                description: "The complete ordered route's server-measured distance.",
              },
            routedDurationSec:
              {
                type: integer,
                description: "The complete ordered route's server-measured driving time.",
              },
            stopsDwellSec:
              {
                type: integer,
                description: "Total expected dwell at the stops (priced as route time).",
              },
          },
      }
    QuoteEnvelope:
      {
        type: object,
        required:
          [
            quoteId,
            service,
            vehicleClass,
            cityId,
            currency,
            suggestedFareMinor,
            minimumFareMinor,
            maximumFareMinor,
            expiresAt,
            pricingVersion,
            policyVersion,
            breakdown,
            routedDistanceMeters,
            routedDurationSec,
          ],
        properties:
          {
            quoteId: { type: string },
            service: { type: string, enum: [ride, delivery] },
            vehicleClass: { type: string },
            cityId: { type: string },
            currency: { type: string },
            suggestedFareMinor: { $ref: "#/components/schemas/Money" },
            minimumFareMinor: { $ref: "#/components/schemas/Money" },
            maximumFareMinor: { $ref: "#/components/schemas/Money" },
            expiresAt: { type: string, format: date-time },
            pricingVersion: { type: string },
            policyVersion: { type: integer },
            breakdown:
              {
                type: array,
                items:
                  {
                    type: object,
                    required: [label, amountMinor],
                    properties:
                      {
                        label: { type: string },
                        amountMinor: { $ref: "#/components/schemas/Money" },
                      },
                  },
              },
            routedDistanceMeters:
              {
                type: integer,
                description: "Server-measured metres of the COMPLETE ordered route (every pickup → stops → dropoff leg).",
              },
            routedDurationSec: { type: integer },
            stops:
              {
                type: array,
                items: { $ref: "#/components/schemas/RouteStop" },
                description: "Multi-stop envelopes only (absent for a plain quote): the ordered stops the route was measured and priced through. A request published from this quote carries exactly these stops; the publish body cannot restate them.",
              },
            stopsDwellSec:
              {
                type: integer,
                description: "Multi-stop only: total expected dwell, priced as route time (the 'Stop waiting' breakdown row).",
              },
            routeFingerprint:
              {
                type: string,
                description: "Multi-stop only: names the exact route (endpoints + ordered stop set) these bounds were priced for.",
              },
          },
      }
    DeliveryDetails:
      {
        type: object,
        required: [weightKg],
        properties:
          {
            weightKg: { type: number },
            lengthCm: { type: number },
            widthCm: { type: number },
            heightCm: { type: number },
            handling: { type: array, items: { type: string } },
          },
      }
    ProofReference:
      {
        type: object,
        description: "A proof REFERENCE only, never the bytes (C07 — no object storage client is wired into delivery-service today; see docs/marketplace/DELIVERY_CUSTODY.md).",
        required: [objectKey, contentType, sizeBytes, sha256],
        properties:
          {
            objectKey:
              {
                type: string,
                description: "Client-supplied storage key; validated (no path traversal, no leading slash, 4-256 chars).",
              },
            contentType:
              { type: string, enum: [image/jpeg, image/png, image/webp] },
            sizeBytes: { type: integer, maximum: 15728640 },
            sha256:
              {
                type: string,
                description: "64-character hex digest; case-insensitive, stored lowercase.",
              },
          },
      }
    ProofResult:
      {
        type: object,
        required: [proofId, deliveryId, type, replay, custodyState],
        properties:
          {
            proofId: { type: string },
            deliveryId: { type: string },
            type: { type: string, enum: [pickup, delivery] },
            replay:
              {
                type: boolean,
                description: "True when this exact proof (same delivery, type, checksum) was already recorded.",
              },
            custodyState: { type: string },
          },
      }
    CustodyStateResult:
      {
        type: object,
        required: [deliveryId, custodyState],
        properties:
          { deliveryId: { type: string }, custodyState: { type: string } },
      }
    ReturnProposalResult:
      {
        type: object,
        required:
          [returnId, deliveryId, custodyState, chargeStatus, consentExpiresAt],
        properties:
          {
            returnId: { type: string },
            deliveryId: { type: string },
            custodyState: { type: string },
            chargeStatus:
              {
                type: string,
                enum: [not_required, unsupported],
                description: "not_required: fee-free (or will resolve to a hold point). unsupported: a fee was proposed but cannot be authorized — see the endpoint description.",
              },
            consentExpiresAt: { type: string, format: date-time },
          },
      }
    CustodyEvent:
      {
        type: object,
        required: [toState, actorType, createdAt],
        properties:
          {
            fromState: { type: string },
            toState: { type: string },
            actorType:
              { type: string, enum: [sender, driver, recipient, system, ops] },
            reason: { type: string },
            createdAt: { type: string, format: date-time },
          },
      }
    CustodyTimeline:
      {
        type: object,
        required: [deliveryId, state, version, events],
        properties:
          {
            deliveryId: { type: string },
            state: { type: string },
            version: { type: integer },
            openReturn:
              {
                type: object,
                nullable: true,
                description: "The latest return proposal for this delivery, if any (absent entirely when none was ever proposed).",
                required:
                  [
                    returnId,
                    chargeStatus,
                    consentState,
                    consentExpiresAt,
                    feeMinor,
                    currency,
                  ],
                properties:
                  {
                    returnId: { type: string },
                    chargeStatus:
                      { type: string, enum: [not_required, unsupported] },
                    consentState:
                      {
                        type: string,
                        enum: [pending, consented, rejected, expired],
                      },
                    consentExpiresAt: { type: string, format: date-time },
                    feeMinor: { type: integer },
                    currency:
                      {
                        type: string,
                        description: "Empty when feeMinor is 0.",
                      },
                  },
              },
            events:
              {
                type: array,
                items: { $ref: "#/components/schemas/CustodyEvent" },
              },
          },
      }
    SearchEnvelope:
      {
        type: object,
        required: [step, radiusMeters, pickupEtaSec],
        properties:
          {
            step: { type: integer },
            radiusMeters: { type: integer },
            pickupEtaSec: { type: integer },
          },
      }
    Request:
      {
        type: object,
        required:
          [
            requestId,
            state,
            revision,
            version,
            service,
            vehicleClass,
            cityId,
            currency,
            requesterId,
            quoteId,
            requestedFareMinor,
            suggestedFareMinor,
            minimumFareMinor,
            maximumFareMinor,
            pickup,
            dropoff,
            searchEnvelope,
            policyVersion,
            pricingVersion,
            expiresAt,
            createdAt,
          ],
        properties:
          {
            requestId: { type: string },
            state:
              {
                type: string,
                enum:
                  [
                    draft,
                    open,
                    award_pending,
                    awarded,
                    execution,
                    cancelled,
                    expired,
                    no_offers,
                  ],
              },
            revision: { type: integer },
            version: { type: integer },
            service: { type: string, enum: [ride, delivery] },
            vehicleClass: { type: string },
            cityId: { type: string },
            currency: { type: string },
            requesterId: { type: string },
            quoteId: { type: string },
            requestedFareMinor: { $ref: "#/components/schemas/Money" },
            suggestedFareMinor: { $ref: "#/components/schemas/Money" },
            minimumFareMinor: { $ref: "#/components/schemas/Money" },
            maximumFareMinor: { $ref: "#/components/schemas/Money" },
            pickup: { $ref: "#/components/schemas/Area" },
            dropoff: { $ref: "#/components/schemas/Area" },
            delivery: { $ref: "#/components/schemas/DeliveryDetails" },
            searchEnvelope: { $ref: "#/components/schemas/SearchEnvelope" },
            policyVersion: { type: integer },
            pricingVersion: { type: string },
            expiresAt: { type: string, format: date-time },
            createdAt: { type: string, format: date-time },
            closeReason:
              {
                type: string,
                enum:
                  [
                    awarded,
                    cancelled,
                    expired,
                    no_offers,
                    driver_cancelled,
                    award_failed,
                  ],
              },
            stops:
              {
                type: array,
                items: { $ref: "#/components/schemas/RouteStop" },
                description: "Present only for a request that carries (or carried) intermediate stops; a plain request renders exactly as before. Absent ⇒ no stops.",
              },
            routeRevision:
              {
                type: integer,
                minimum: 1,
                description: "Bumps only when a revision changed the stop set. `revision` still bumps on every price- or route-affecting edit and is what bids are pinned to.",
              },
            routeFingerprint:
              {
                type: string,
                description: "The route the current bounds were priced for.",
              },
          },
      }
    Offer:
      {
        type: object,
        description: "Rider-facing view of one driver's bid. Never leaks rival prices or identities; bids are private per driver.",
        required:
          [
            bidId,
            bidVersion,
            requestRevision,
            amountMinor,
            kind,
            driver,
            pickupLabel,
            expiresAt,
            withdrawn,
          ],
        properties:
          {
            bidId: { type: string },
            bidVersion: { type: integer },
            requestRevision: { type: integer },
            amountMinor: { $ref: "#/components/schemas/Money" },
            kind: { type: string, enum: [immediate, finishing_trip] },
            driver: { $ref: "#/components/schemas/OfferDriver" },
            pickupLabel: { type: string },
            pickupWindow:
              {
                type: object,
                required: [earliestSec, latestSec, etaVersion],
                properties:
                  {
                    earliestSec: { type: integer },
                    latestSec: { type: integer },
                    etaVersion: { type: integer },
                  },
              },
            expiresAt: { type: string, format: date-time },
            withdrawn: { type: boolean },
            whyRecommended:
              {
                type: string,
                description: "Disclosed recommendation criteria. Never sponsored, never auto-selecting.",
              },
            bookingFeeMinor:
              {
                $ref: "#/components/schemas/Money",
                description: "Server-computed rider-side booking fee, when the market charges one.",
              },
            totalMinor:
              {
                $ref: "#/components/schemas/Money",
                description: "Server-computed total the rider pays for this offer.",
              },
            deltaLabel:
              {
                type: string,
                description: 'Server-phrased comparison to the requested amount (e.g. "+₦200").',
              },
          },
      }
    OfferDriver:
      {
        type: object,
        description: "Rider-facing driver display (G09). ride-service owns no verified driver identity/rating/vehicle registry — those live in user-service. When profileStatus is 'unavailable' the identity/rating fields are pseudonymous placeholders a client must not present as verified; 'vehicle' is always the server-verified eligible class. See docs/marketplace/DRIVER_IDENTITY.md.",
        required:
          [
            displayName,
            initials,
            rating,
            completedTrips,
            vehicle,
            plateMasked,
            profileStatus,
          ],
        properties:
          {
            displayName: { type: string },
            initials: { type: string },
            rating: { type: string },
            completedTrips: { type: integer },
            vehicle: { type: string },
            plateMasked: { type: string },
            profileStatus: { type: string, enum: [verified, unavailable] },
          },
      }
    QueueStep:
      {
        type: object,
        required: [label, state],
        properties:
          {
            label: { type: string },
            detail: { type: string },
            state: { type: string, enum: [done, active, pending, skipped] },
          },
      }
    QueueView:
      {
        type: object,
        description: "Rider-facing, owner-only, versioned queue projection (G07). Composed server-side from the real award/claim/promotion/execution state; carries an asOf freshness stamp for stale-ETA detection. Foreign rider → 404.",
        required:
          [
            requestId,
            version,
            asOf,
            status,
            promotion,
            driver,
            driverFirstName,
            steps,
            fareMinor,
            windowLabel,
            eta,
            actions,
          ],
        properties:
          {
            requestId: { type: string },
            version: { type: integer },
            asOf: { type: string, format: date-time },
            status:
              {
                type: string,
                enum:
                  [
                    queued,
                    promoting,
                    assigned,
                    arrived,
                    in_progress,
                    settled,
                    cancelled,
                  ],
              },
            promotion:
              { type: string, enum: [none, pending, failed_revalidating] },
            driver: { $ref: "#/components/schemas/OfferDriver" },
            driverFirstName: { type: string },
            steps:
              {
                type: array,
                items: { $ref: "#/components/schemas/QueueStep" },
              },
            fareMinor: { $ref: "#/components/schemas/Money" },
            windowLabel: { type: string },
            eta:
              {
                type: object,
                required: [label, inWindow, etaSeconds, asOf],
                properties:
                  {
                    label: { type: string },
                    inWindow: { type: boolean },
                    etaSeconds: { type: integer, nullable: true },
                    asOf: { type: string, format: date-time },
                  },
              },
            pickupWindow:
              {
                type: object,
                nullable: true,
                required: [earliestSec, latestSec, etaVersion, uncertaintySec],
                properties:
                  {
                    earliestSec: { type: integer },
                    latestSec: { type: integer },
                    etaVersion: { type: integer },
                    uncertaintySec: { type: integer },
                  },
              },
            actions:
              {
                type: object,
                required: [canCancel, feeFreeExit],
                properties:
                  {
                    canCancel: { type: boolean },
                    feeFreeExit: { type: boolean },
                  },
              },
            delayed:
              {
                type: object,
                nullable: true,
                required: [noticeTitle, noticeBody, keepLabel],
                properties:
                  {
                    noticeTitle: { type: string },
                    noticeBody: { type: string },
                    keepLabel: { type: string },
                    reversal:
                      {
                        type: object,
                        nullable: true,
                        required: [riderHold, driverFee],
                        properties:
                          {
                            riderHold:
                              { type: string, enum: [releasing, released] },
                            driverFee:
                              { type: string, enum: [pending, reversed] },
                          },
                      },
                  },
              },
          },
      }
    PickupPin:
      {
        type: object,
        description: "Secure pickup-PIN retrieval (G07 companion). Delivered ONLY over this authenticated REST channel — never in a push payload, event, analytics or log. Owner-only, rate-limited, and only while the execution ride is in a PIN-relevant state.",
        required: [rideId, pin, state, expiresAt],
        properties:
          {
            rideId: { type: string },
            pin: { type: string },
            state: { type: string },
            expiresAt: { type: string, format: date-time },
          },
      }
    Bid:
      {
        type: object,
        description: "Driver's own bid with their money view (commission and net). One live bid per driver per request revision.",
        required:
          [
            bidId,
            requestId,
            requestRevision,
            bidVersion,
            state,
            driverId,
            amountMinor,
            commissionMinor,
            netMinor,
            slot,
            reservationId,
            expiresAt,
            createdAt,
          ],
        properties:
          {
            bidId: { type: string },
            requestId: { type: string },
            requestRevision: { type: integer },
            bidVersion: { type: integer },
            state:
              {
                type: string,
                enum:
                  [
                    submitted,
                    revised,
                    selected_pending,
                    won,
                    lost,
                    withdrawn,
                    expired,
                    invalidated,
                  ],
              },
            driverId: { type: string },
            amountMinor: { $ref: "#/components/schemas/Money" },
            commissionMinor: { $ref: "#/components/schemas/Money" },
            netMinor: { $ref: "#/components/schemas/Money" },
            slot: { type: string, enum: [current, next] },
            dependsOnClaimId: { type: string },
            reservationId: { type: string },
            expiresAt: { type: string, format: date-time },
            createdAt: { type: string, format: date-time },
          },
      }
    Preset:
      {
        type: object,
        description: "Server-generated quick offer: deduplicated, in bounds, affordability-checked against spendable funds. Clients never compute fee or net.",
        required:
          [
            key,
            amountMinor,
            commissionMinor,
            netMinor,
            title,
            feeNetLabel,
            affordable,
            emphasized,
            source,
          ],
        properties:
          {
            key: { type: string },
            amountMinor: { $ref: "#/components/schemas/Money" },
            commissionMinor: { $ref: "#/components/schemas/Money" },
            netMinor: { $ref: "#/components/schemas/Money" },
            title: { type: string },
            feeNetLabel: { type: string },
            affordable: { type: boolean },
            shortfallMinor: { $ref: "#/components/schemas/Money" },
            shortfallLabel: { type: string },
            emphasized: { type: boolean },
            source:
              {
                type: string,
                enum:
                  [requested, lower, higher, rate_profile, preference_minimum],
                description: "preference_minimum (A04.2): the driver's minimum trip amount, suggested when the request asks less but its maximum can pay it. A suggestion only — nothing is bid automatically.",
              },
            earnings:
              {
                $ref: "#/components/schemas/EarningsBreakdown",
                description: "A04.1: the breakdown at this preset's amount.",
              },
          },
      }
    EligibilityReason:
      {
        type: object,
        required: [code, title, detail],
        properties:
          {
            code:
              {
                type: string,
                enum:
                  [
                    OUTSIDE_RADIUS,
                    PICKUP_ETA_TOO_LONG,
                    LOCATION_STALE,
                    LOCATION_INACCURATE,
                    NOT_STATIONARY,
                    NOT_NEAR_COMPLETION,
                    WRONG_DIRECTION,
                    SLOT_FULL,
                    QUEUE_DISABLED,
                    UNSUPPORTED_CAPABILITY,
                    ACCOUNT_NOT_ELIGIBLE,
                    OFFLINE,
                    INSUFFICIENT_SPENDABLE,
                    ROUTING_UNAVAILABLE,
                  ],
              },
            title: { type: string },
            detail: { type: string },
          },
      }
    Eligibility:
      {
        type: object,
        required:
          [eligible, reasons, policyVersion, availabilityEpoch, evaluatedAt],
        properties:
          {
            eligible: { type: boolean },
            slot: { type: string, enum: [current, next] },
            reasons:
              {
                type: array,
                items: { $ref: "#/components/schemas/EligibilityReason" },
              },
            policyVersion: { type: integer },
            availabilityEpoch: { type: integer },
            evaluatedAt: { type: string, format: date-time },
            predictedPickupSec:
              {
                type: [integer, "null"],
                minimum: 0,
                description: "A04.1: the time-until-pickup ESTIMATE for an eligible driver, rounded up to the whole minute; null when not eligible.",
              },
            predictedPickupBasis:
              {
                type: [string, "null"],
                enum: [routed_leg, finishing_trip_prediction, null],
                description: "routed_leg: the routed leg to the pickup. finishing_trip_prediction: remaining service + completion buffer + post-dropoff leg + uncertainty buffer.",
              },
          },
      }
    Award:
      {
        type: object,
        required:
          [
            awardId,
            requestId,
            bidId,
            state,
            requestVersion,
            bidVersion,
            driverId,
            requesterId,
            fareMinor,
            commissionMinor,
            slot,
            createdAt,
          ],
        properties:
          {
            awardId: { type: string },
            requestId: { type: string },
            bidId: { type: string },
            state:
              {
                type: string,
                enum: [pending, confirmed, failed, compensated, cancelled],
              },
            requestVersion: { type: integer },
            bidVersion: { type: integer },
            driverId: { type: string },
            requesterId: { type: string },
            fareMinor: { $ref: "#/components/schemas/Money" },
            commissionMinor: { $ref: "#/components/schemas/Money" },
            slot: { type: string, enum: [current, next] },
            executionRef:
              {
                type: object,
                required: [service, id],
                properties:
                  {
                    service: { type: string, enum: [ride, delivery] },
                    id: { type: string },
                  },
              },
            createdAt: { type: string, format: date-time },
            resolvedAt: { type: string, format: date-time },
            failReason:
              {
                type: string,
                description: "Human-phrased reason on award.failed; the request reopened if still valid.",
              },
          },
      }
    FeedItem:
      {
        type: object,
        required:
          [
            requestId,
            revision,
            service,
            title,
            meta,
            askedMinor,
            askedByLabel,
            expiresAt,
          ],
        properties:
          {
            requestId: { type: string },
            revision: { type: integer },
            service: { type: string, enum: [ride, delivery] },
            title: { type: string },
            meta: { type: string },
            askedMinor: { $ref: "#/components/schemas/Money" },
            askedByLabel: { type: string },
            capabilityBadge: { type: string },
            expiresAt: { type: string, format: date-time },
            route:
              {
                $ref: "#/components/schemas/FeedRoute",
                description: "Multi-stop requests only: stop count, coarse stop areas and the full route's distance/duration/dwell.",
              },
            earnings:
              {
                $ref: "#/components/schemas/EarningsBreakdown",
                description: "A04.1: the server-composed breakdown at the requester's fare, on every card.",
              },
            preferenceTags:
              {
                type: array,
                items: { type: string, enum: [homeward] },
                description: "A04.2: the driver's own preference matches; absent when none.",
              },
          },
      }
    FleetRemittance:
      {
        type: object,
        required: [status, amountMinor, reason],
        description: "The disclosed fleet share of a fare. No fleet arrangement applies to marketplace jobs, so status is none and the amount is null — never a fabricated number.",
        properties:
          {
            status: { type: string, enum: [none] },
            amountMinor: { type: "null" },
            reason: { type: string },
          },
      }
    PickupEstimate:
      {
        type: object,
        required:
          [
            distanceMeters,
            distanceBasis,
            durationSec,
            durationBasis,
            estimate,
            paid,
            label,
          ],
        description: "The UNPAID drive to the pickup. Always an estimate; pre-award the distance is coarsened to 100 m and the time rounded up to the minute. Null with basis unavailable when the server has no location.",
        properties:
          {
            distanceMeters: { type: [integer, "null"], minimum: 0 },
            distanceBasis:
              { type: string, enum: [routed, straight_line, unavailable] },
            durationSec: { type: [integer, "null"], minimum: 0 },
            durationBasis:
              {
                type: string,
                enum: [routed_leg, straight_line_estimate, unavailable],
              },
            estimate: { type: boolean, enum: [true] },
            paid: { type: boolean, enum: [false] },
            label: { type: string },
          },
      }
    PaidRoute:
      {
        type: object,
        required:
          [
            distanceMeters,
            durationSec,
            stopCount,
            stopsWaitingSec,
            estimate,
            label,
            waitingLabel,
          ],
        description: "The trip the fare pays for: the complete ordered route the request was priced on (every leg through every stop) and the expected stop waiting.",
        properties:
          {
            distanceMeters: { type: integer, minimum: 1 },
            durationSec: { type: integer, minimum: 0 },
            stopCount: { type: integer, minimum: 0 },
            stopsWaitingSec: { type: integer, minimum: 0 },
            estimate: { type: boolean, enum: [true] },
            label: { type: string },
            waitingLabel: { type: string },
          },
      }
    EarningsBreakdown:
      {
        type: object,
        required:
          [
            grossMinor,
            grossBasis,
            commissionMinor,
            commissionBps,
            fleetRemittance,
            estimatedNetMinor,
            pickup,
            route,
            estimatedNetPerHour,
            runningCosts,
            disclaimer,
          ],
        description: "A04.1 server-composed driver earnings: commissionMinor = commissionMinorFor(grossMinor) (10%, half-up); estimatedNetMinor = gross − commission − fleet remittance. Clients render; they never derive a fee, net or rate. No fuel/energy estimate exists because no such input is disclosed.",
        properties:
          {
            grossMinor: { $ref: "#/components/schemas/Money" },
            grossBasis: { type: string, enum: [requested_fare, preset_amount] },
            commissionMinor: { $ref: "#/components/schemas/Money" },
            commissionBps: { type: integer, enum: [1000] },
            fleetRemittance: { $ref: "#/components/schemas/FleetRemittance" },
            estimatedNetMinor: { $ref: "#/components/schemas/Money" },
            pickup: { $ref: "#/components/schemas/PickupEstimate" },
            route:
              {
                oneOf:
                  [
                    { $ref: "#/components/schemas/PaidRoute" },
                    { type: "null" },
                  ],
                description: "Null only for a request stored before route metrics existed.",
              },
            estimatedNetPerHour:
              {
                description: "Estimate over pickup + paid route + stop waiting (the figures shown); null whenever any time input is unknown.",
                oneOf:
                  [
                    {
                      type: object,
                      required: [amountMinor, estimate, basisSec, basis],
                      properties:
                        {
                          amountMinor: { $ref: "#/components/schemas/Money" },
                          estimate: { type: boolean, enum: [true] },
                          basisSec: { type: integer, minimum: 1 },
                          basis: { type: string },
                        },
                    },
                    { type: "null" },
                  ],
              },
            runningCosts:
              {
                type: object,
                required: [status, reason],
                properties:
                  {
                    status: { type: string, enum: [not_estimated] },
                    reason: { type: string },
                  },
              },
            disclaimer: { type: string },
          },
      }
    FeedPreferences:
      {
        type: object,
        required: [version, applied, hiddenCount, note],
        description: "A04.2: whether the driver's saved preferences shaped this page and how many requests they hid (never which). Absent when the driver saved none.",
        properties:
          {
            version: { type: integer, minimum: 1 },
            applied: { type: boolean },
            hiddenCount: { type: integer, minimum: 0 },
            note: { type: string },
          },
      }
    AvailabilityWindow:
      {
        type: object,
        required: [day, startMinute, endMinute],
        description: "One weekly window in the city's local time (minutes from midnight, end exclusive). Stored only: the scheduled marketplace is a later slice.",
        properties:
          {
            day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] },
            startMinute: { type: integer, minimum: 0, maximum: 1439 },
            endMinute: { type: integer, minimum: 1, maximum: 1440 },
          },
      }
    Homeward:
      {
        type: object,
        required: [lat, lng, radiusMeters, label],
        description: "The driver's OWN return area. Never shown to a requester, never in an event payload; matching uses the dropoff's coarse area cell.",
        properties:
          {
            lat: { type: number },
            lng: { type: number },
            radiusMeters: { type: integer },
            label: { type: string },
          },
      }
    DriverPreferences:
      {
        type: object,
        description: "A04.2 driver preferences in one city, versioned and append-only (version 0 = unsaved defaults). They FILTER and RANK the feed and PRE-FILL a suggested preset; they are never eligibility and never bid. The per-km rate and minimum trip fare stay in rate profiles.",
        required:
          [
            driverId,
            cityId,
            version,
            currency,
            timezone,
            minimumTripAmountMinor,
            maxPickupDistanceMeters,
            acceptsDeliveries,
            acceptsStops,
            maxStops,
            homeward,
            homewardOnly,
            availabilityWindows,
            availabilityNote,
            bounds,
            disclosure,
            updatedAt,
          ],
        properties:
          {
            driverId: { type: string },
            cityId: { type: string },
            version: { type: integer, minimum: 0 },
            currency: { type: string },
            timezone: { type: string },
            minimumTripAmountMinor:
              {
                oneOf:
                  [{ $ref: "#/components/schemas/Money" }, { type: "null" }],
                description: "Hide requests whose MAXIMUM fare cannot reach this; null = none.",
              },
            maxPickupDistanceMeters:
              {
                type: [integer, "null"],
                description: "Hide pickups farther than this; null = the request's envelope decides (a preference never widens it).",
              },
            acceptsDeliveries: { type: boolean },
            acceptsStops: { type: boolean },
            maxStops:
              {
                type: [integer, "null"],
                description: "Null = up to the market's stop limit; cleared when stops are declined.",
              },
            homeward:
              {
                oneOf:
                  [{ $ref: "#/components/schemas/Homeward" }, { type: "null" }],
              },
            homewardOnly: { type: boolean },
            availabilityWindows:
              {
                type: array,
                items:
                  {
                    allOf:
                      [
                        { $ref: "#/components/schemas/AvailabilityWindow" },
                        {
                          type: object,
                          required: [label],
                          properties: { label: { type: string } },
                        },
                      ],
                  },
              },
            availabilityNote: { type: string },
            bounds:
              {
                type: object,
                required:
                  [
                    minimumTripAmountMaxMinor,
                    maxPickupDistanceMeters,
                    maxStopsCeiling,
                    homewardRadiusMeters,
                    maxAvailabilityWindows,
                  ],
                properties:
                  {
                    minimumTripAmountMaxMinor:
                      {
                        oneOf:
                          [
                            { $ref: "#/components/schemas/Money" },
                            { type: "null" },
                          ],
                      },
                    maxPickupDistanceMeters:
                      {
                        type: object,
                        required: [min, max],
                        properties:
                          { min: { type: integer }, max: { type: integer } },
                      },
                    maxStopsCeiling: { type: integer },
                    homewardRadiusMeters:
                      {
                        type: object,
                        required: [min, max],
                        properties:
                          { min: { type: integer }, max: { type: integer } },
                      },
                    maxAvailabilityWindows: { type: integer },
                  },
              },
            disclosure: { type: string },
            updatedAt: { type: [string, "null"], format: date-time },
          },
      }
    DriverJob:
      {
        type: object,
        required: [claimId, slot, service, state, fareMinor, commissionMinor],
        properties:
          {
            claimId: { type: string },
            slot: { type: string, enum: [current, next] },
            service: { type: string, enum: [ride, delivery] },
            state: { type: string },
            fareMinor: { $ref: "#/components/schemas/Money" },
            commissionMinor: { $ref: "#/components/schemas/Money" },
            receiptId: { type: string },
            executionRef:
              {
                type: object,
                required: [service, id],
                properties:
                  {
                    service: { type: string, enum: [ride, delivery] },
                    id: { type: string },
                  },
              },
            pickupWindow:
              {
                type: object,
                required: [earliestSec, latestSec, etaVersion],
                properties:
                  {
                    earliestSec: { type: integer },
                    latestSec: { type: integer },
                    etaVersion: { type: integer },
                  },
              },
          },
      }
    RateProfile:
      {
        type: object,
        required:
          [
            profileId,
            driverId,
            version,
            cityId,
            service,
            vehicleClass,
            currency,
            perKmMinor,
            minimumTripFareMinor,
            components,
            createdAt,
          ],
        properties:
          {
            profileId: { type: string },
            driverId: { type: string },
            version: { type: integer },
            cityId: { type: string },
            service: { type: string, enum: [ride, delivery] },
            vehicleClass: { type: string },
            currency: { type: string },
            perKmMinor:
              {
                type: integer,
                description: "Gross (before 10% commission) minor units per routed km.",
              },
            minimumTripFareMinor: { type: integer },
            components:
              {
                type: object,
                properties:
                  {
                    perMinuteMinor: { type: integer },
                    pickupPerKmMinor: { type: integer },
                    handlingMinor: { type: integer },
                  },
              },
            createdAt: { type: string, format: date-time },
          },
      }
    WalletHold:
      {
        type: object,
        required:
          [
            reservationId,
            bidId,
            driverId,
            state,
            amountMinor,
            commissionBps,
            createdAt,
          ],
        properties:
          {
            reservationId: { type: string },
            bidId: { type: string },
            driverId: { type: string },
            state:
              {
                type: string,
                enum: [active, capture_pending, captured, released, reversed],
              },
            amountMinor: { $ref: "#/components/schemas/Money" },
            commissionBps: { type: integer, const: 1000 },
            baseMinor: { $ref: "#/components/schemas/Money" },
            roundingRule: { type: string, const: half_up },
            policyVersion: { type: integer },
            createdAt: { type: string, format: date-time },
            releasedAt: { type: string, format: date-time },
            capturedAt: { type: string, format: date-time },
          },
      }
    WalletOverview:
      {
        type: object,
        description: "The single spendable calculation: cleared journal balance minus active holds. Every debit path honors it.",
        required: [clearedMinor, heldMinor, spendableMinor, holds],
        properties:
          {
            clearedMinor: { $ref: "#/components/schemas/Money" },
            heldMinor: { $ref: "#/components/schemas/Money" },
            spendableMinor: { $ref: "#/components/schemas/Money" },
            holds:
              {
                type: array,
                items: { $ref: "#/components/schemas/WalletHold" },
              },
          },
      }
security: [{ bearer: [] }]
paths:
  /v1/mp/quote:
    get:
      summary: Bounded fare quote envelope (R02)
      description: "Prices the trip/delivery with the deterministic engine, wraps the signed quote with negotiation bounds (floor = max(absolute, cost-based, bps-of-suggested); ceiling = bps-of-suggested). 503 market_not_configured when the city/service/vehicle has no marketplace policy. With `stops` (rides only, behind the deny-by-default marketplace_multi_stop flag) the COMPLETE ordered route pickup → stops → dropoff is routed and priced, expected dwell is priced as route time, and the bounds derive from that full-route price; the market's stop limit (pilot 3), coordinates, dwell bounds and duplicate/adjacent-identical stops are validated (422 validation_failed with details.field). A delivery with stops is 422 validation_failed (deliveries are single-drop); stops while the flag is off are 404 feature_disabled."
      parameters:
        - {
            name: service,
            in: query,
            required: true,
            schema: { type: string, enum: [ride, delivery] },
          }
        - {
            name: vehicleClass,
            in: query,
            required: true,
            schema: { type: string },
          }
        - {
            name: pickupLat,
            in: query,
            required: true,
            schema: { type: number },
          }
        - {
            name: pickupLng,
            in: query,
            required: true,
            schema: { type: number },
          }
        - {
            name: dropoffLat,
            in: query,
            required: true,
            schema: { type: number },
          }
        - {
            name: dropoffLng,
            in: query,
            required: true,
            schema: { type: number },
          }
        - {
            name: weightKg,
            in: query,
            required: false,
            schema: { type: number },
          }
        - {
            name: stops,
            in: query,
            required: false,
            description: 'Ordered intermediate stops as ONE JSON-encoded array (URL-encoded), e.g. [{"lat":6.53,"lng":3.38,"purpose":"errand","dwellSec":120}]. Absent, null or [] is the plain pickup → dropoff route, priced exactly as before.',
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        maxItems: 10,
                        items: { $ref: "#/components/schemas/StopInput" },
                      },
                  },
              },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteEnvelope" }
        "404":
          description: "feature_disabled — stops while marketplace_multi_stop is off here (or the vertical itself is off)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "validation_failed — a stop over the market limit, off-planet, duplicated, identical to its adjacent pickup/dropoff, with an out-of-bounds dwell or unknown purpose, or any stop on a delivery."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests:
    post:
      summary: Publish a request (R03)
      description: "Validates the requested amount against the quote's snapshotted bounds server-side (fare_out_of_bounds with a structured field error otherwise). Requires a live, owned, unconsumed quote. One open request per requester per policy cap. A multi-stop quote publishes its own ordered stops (ids, order, dwell and routeFingerprint) — the body cannot carry stops (unknown keys are refused) — and only while marketplace_multi_stop is on."
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [quoteId, requestedFareMinor, paymentMethodId],
                properties:
                  {
                    quoteId: { type: string },
                    requestedFareMinor: { $ref: "#/components/schemas/Money" },
                    paymentMethodId: { type: string },
                    delivery: { $ref: "#/components/schemas/DeliveryDetails" },
                  },
              }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}:
    get:
      summary: Owner snapshot (R04) — request plus private offers
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [request, offers, seq],
                  properties:
                    {
                      request: { $ref: "#/components/schemas/Request" },
                      offers:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Offer" },
                        },
                      award: { $ref: "#/components/schemas/Award" },
                      seq: { type: integer },
                    },
                }
  /v1/mp/requests/{requestId}/queue:
    get:
      summary: Rider queue projection (R10 / G07) — owner-only, versioned, asOf-stamped
      description: >-
        Composed queue tracker for the requester of an awarded finishing-trip
        job: current claim/job status, promotion state, ETA vs the consented
        window with an asOf freshness stamp, the pickup window and its
        uncertainty, and the rider's permitted actions (cancel, fee-free
        missed-window exit). A foreign rider gets 404 — existence is not leaked.
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueView" }
        "404":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/pin:
    get:
      summary: Secure pickup-PIN retrieval (G07 companion) — owner-only, lifecycle-restricted, rate-limited
      description: >-
        Returns the pickup PIN for a marketplace execution ride (including one a
        promotion created) over this authenticated channel only. The PIN is
        never in a push payload, event, analytics or log. Owner-only (foreign
        rider → 404); refused with 409 when the ride is not in a PIN-relevant
        state; rate-limited (429).
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickupPin" }
        "404":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/revise:
    post:
      summary: Price- or route-affecting edit — new revision, bids invalidated, holds released
      description: "Open requests only (request_closed otherwise). A replacement quote for the SAME endpoints but a different ordered stop set is the pre-award route edit: the request adopts the quote's stops (a surviving stop keeps its stopId), its bounds come from the quote's full-route price, routeRevision bumps together with revision, and every live bid — pinned to the old revision — is invalidated with its commission hold released exactly once. A stale-revision bid can never be selected afterwards."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [requestedFareMinor, expectedVersion],
                properties:
                  {
                    requestedFareMinor: { $ref: "#/components/schemas/Money" },
                    quoteId:
                      {
                        type: string,
                        description: "Required when route/service details changed — a fresh quote re-snapshots bounds. Must price the same service, class, city, currency, active policy and endpoints; it MAY carry a different stop set (the route edit).",
                      },
                    expectedVersion: { type: integer },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/cancel:
    post:
      summary: Cancel an open request (releases all bid holds)
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
  /v1/mp/requests/{requestId}/select:
    post:
      summary: Select the winner (R05, M05 award saga)
      description: "Authenticated request owner only. Pins requestVersion and bidVersion (version_conflict on stale terms). Runs the award saga: claim request + driver capacity atomically, authorize rider funding for the selected amount, capture the winning commission hold exactly once under the award id, commit execution, resolve losers. Answers 202 with the pending award; the client converges on award.confirmed/failed via events or GET. award_unresolved is returned to a second selection racing a pending award. A bid placed on an earlier request revision (a fare or route edit landed since) answers version_conflict with the refreshed terms (current revision, routeRevision/routeFingerprint for multi-stop requests, and the bid's own requestRevision) and never wins. The execution ride of a multi-stop award carries the request's ordered stops with their stable ids."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [bidId, requestVersion, bidVersion],
                properties:
                  {
                    bidId: { type: string },
                    requestVersion: { type: integer },
                    bidVersion: { type: integer },
                    pickupWindowConsent:
                      {
                        type: object,
                        required: [etaVersion, accepted],
                        description: "Required for finishing-trip (next-slot) winners; etaVersion must match the currently displayed window or the server returns the refreshed window for reconfirmation.",
                        properties:
                          {
                            etaVersion: { type: integer },
                            accepted: { type: boolean, const: true },
                          },
                      },
                  },
              }
      responses:
        "202":
          description: "The award (pending, or already confirmed when the saga completed synchronously). `pickupPin` is present ONLY when this call confirmed a current-slot ride award: it is revealed exactly once to the owner and deliberately absent from idempotent replays."
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [award],
                  properties:
                    {
                      award: { $ref: "#/components/schemas/Award" },
                      pickupPin: { type: string },
                    },
                }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/award:
    get:
      summary: Award state (poll/converge)
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Award" }
  /v1/mp/feed:
    get:
      summary: Paginated eligible open-request feed (D01)
      description: "All requests the driver is eligible to discover in their current envelope. Receiving the feed never reserves the driver or removes availability. Every card carries the A04.1 earnings breakdown; the driver's saved preferences (A04.2) hide what they do not want and rank homeward requests first within the page — a filter on discovery, never on eligibility."
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - {
            name: preferences,
            in: query,
            required: false,
            description: "apply (default) or ignore — ignore shows the whole envelope, unfiltered and unranked by preferences.",
            schema: { type: string, enum: [apply, ignore] },
          }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [items, availabilityEpoch],
                  properties:
                    {
                      items:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/FeedItem" },
                        },
                      nextCursor: { type: string },
                      availabilityEpoch: { type: integer },
                      preferences:
                        { $ref: "#/components/schemas/FeedPreferences" },
                    },
                }
  /v1/mp/requests/{requestId}/driver-view:
    get:
      summary: Driver detail — privacy-limited request, presets, eligibility, own bid (D02/D03/D10)
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [item, eligibility, presets],
                  properties:
                    {
                      item: { $ref: "#/components/schemas/FeedItem" },
                      eligibility: { $ref: "#/components/schemas/Eligibility" },
                      presets:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Preset" },
                        },
                      profileLine: { type: string },
                      ceilingNotice: { type: string },
                      preferenceNotice:
                        {
                          type: string,
                          description: "A04.2: a preference this request cannot meet (e.g. the minimum trip amount is above its maximum).",
                        },
                      myBid: { $ref: "#/components/schemas/Bid" },
                      currentClaimId:
                        {
                          type: string,
                          description: "The driver's current work claim id — the mandatory dependsOnClaimId for a next-slot bid. Null unless a current claim exists.",
                        },
                    },
                }
  /v1/mp/driver/parked:
    post:
      summary: Explicit safely-parked attestation (driver)
      description: "Records the attestation the stationary gate combines with telemetry (it can never override clearly moving samples). The response is the state the SERVER acknowledges; the client adopts it rather than assuming."
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required:
                    [
                      state,
                      availabilityEpoch,
                      confirmedAt,
                      expiresAt,
                      ttlSeconds,
                    ],
                  properties:
                    {
                      state:
                        {
                          type: string,
                          enum: [parked_confirmed, moving, stale_location],
                        },
                      availabilityEpoch: { type: integer },
                      confirmedAt: { type: string, format: date-time },
                      expiresAt: { type: string, format: date-time },
                      ttlSeconds: { type: integer },
                    },
                }
  /v1/mp/driver/jobs:
    get:
      summary: Driver claims projection (D05 winner card + D11 current-plus-next timeline)
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [promotion],
                  properties:
                    {
                      current: { $ref: "#/components/schemas/DriverJob" },
                      next: { $ref: "#/components/schemas/DriverJob" },
