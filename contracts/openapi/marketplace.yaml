            application/json:
              schema: { $ref: "#/components/schemas/WalletOverview" }
  /v1/wallet/mp/holds/overview:
    get:
      summary: Wallet overview for a named driver (internal, marketplace engine)
      description: "Service-authenticated variant the engine uses to build affordability-checked presets. Lives under /holds so the gateway's admin-only rule covers it; user tokens can never name another driver."
      security: [{ serviceKey: [] }]
      parameters:
        - {
            name: driverId,
            in: query,
            required: true,
            schema: { type: string },
          }
        - { name: cityId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletOverview" }
  /v1/wallet/mp/settlements:
    post:
      summary: Marketplace completion settlement (internal, M06)
      description: "Called by the marketplace engine when a marketplace execution completes. The 10% fee was captured at selection and is NEVER charged here: wallet trips debit the rider the agreed fare and credit the driver the FULL fare (tips bypass commission); cash trips post nothing except a wallet tip. Idempotent on the award id — a replay returns the original outcome."
      security: [{ serviceKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required:
                  [
                    awardId,
                    executionRef,
                    requesterId,
                    driverId,
                    fareMinor,
                    method,
                    cityId,
                  ],
                properties:
                  {
                    awardId: { type: string },
                    executionRef:
                      {
                        type: object,
                        required: [service, id],
                        properties:
                          {
                            service: { type: string, enum: [ride, delivery] },
                            id: { type: string },
                          },
                      },
                    requesterId: { type: string },
                    driverId: { type: string },
                    fareMinor: { $ref: "#/components/schemas/Money" },
                    tipMinor: { $ref: "#/components/schemas/Money" },
                    method: { type: string, enum: [wallet, cash] },
                    cityId: { type: string },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [settled, method],
                  properties:
                    {
                      settled: { type: boolean, const: true },
                      method: { type: string },
                      journalEntryId: { type: string },
                    },
                }
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/wallet/mp/holds/reserve:
    post:
      summary: Reserve a commission hold (internal, marketplace engine → payment-service)
      description: "Service-authenticated. Idempotent on the reservation key with payload-hash conflict detection. Reserves the full commission per live bid against cleared spendable funds; fails with insufficient_spendable and the exact shortfall."
      security: [{ serviceKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required:
                  [
                    driverId,
                    bidId,
                    requestId,
                    amountMinor,
                    baseMinor,
                    policyVersion,
                    cityId,
                  ],
                properties:
                  {
                    driverId: { type: string },
                    bidId: { type: string },
                    requestId: { type: string },
                    amountMinor: { $ref: "#/components/schemas/Money" },
                    baseMinor: { $ref: "#/components/schemas/Money" },
                    policyVersion: { type: integer },
                    cityId: { type: string },
                  },
              }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletHold" }
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/wallet/mp/holds/{reservationId}/adjust:
    post:
      summary: Atomically raise/lower a hold (internal)
      description: "A raise succeeds only if the extra reservation fits spendable funds (the old hold stays valid otherwise); a lower releases the difference."
      security: [{ serviceKey: [] }]
      parameters:
        - {
            name: reservationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [amountMinor, baseMinor],
                properties:
                  {
                    amountMinor: { $ref: "#/components/schemas/Money" },
                    baseMinor: { $ref: "#/components/schemas/Money" },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletHold" }
  /v1/wallet/mp/holds/{reservationId}/release:
    post:
      summary: Release a hold once (internal; refuses while its award is unresolved)
      security: [{ serviceKey: [] }]
      parameters:
        - {
            name: reservationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletHold" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/wallet/mp/holds/{reservationId}/capture:
    post:
      summary: Capture the winning hold exactly once under the award id (internal)
      description: "Posts the single 10% commission journal debit (wallet → ubi_commission) with counterpart award reference. Idempotent on the award id; a repeat answers the original receipt. `expectedAmountMinor` is the award's pinned commission: a hold whose current amount differs (e.g. a bid revision raced the selection) is REFUSED with 409 conflict so the saga compensates instead of debiting terms that were never awarded. Completion settlement must not charge the fee again."
      security: [{ serviceKey: [] }]
      parameters:
        - {
            name: reservationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [awardId, expectedAmountMinor],
                properties:
                  {
                    awardId: { type: string },
                    expectedAmountMinor: { $ref: "#/components/schemas/Money" },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [hold, receiptId, journalEntryId],
                  properties:
                    {
                      hold: { $ref: "#/components/schemas/WalletHold" },
                      receiptId: { type: string },
                      journalEntryId: { type: string },
                    },
                }
  /v1/wallet/mp/funding/authorize:
    post:
      summary: Rider funding authorization for a selection (internal, M05 step 3, C02)
      description: "Service-authenticated. Secures the SELECTED amount with the request's stored payment method. `wallet` creates a DURABLE reservation (a table row, never a journal movement) that encumbers spendable from selection until settlement consumes it or a release frees it — idempotent on the award id: an identical replay answers the existing reservation (`secured: true`, its `reservationId`), a replay with different terms is a 409 conflict. `cash` is explicitly unsecured (`secured: false`, `reservationId: null`) — availability-checked only, with the audit record stating unsecured collection. Any OTHER config-listed method (card/PSP) FAILS CLOSED with payment_method_unavailable: config availability is not provider authorization, and PSP authorization is not built yet. Nothing is debited — settlement stays at completion. 2xx = authorized; 4xx carries a canonical error code (insufficient_funds with the exact shortfall, payment_method_unavailable, wallet_locked, conflict); 5xx is an unknown outcome the award saga keeps pending."
      security: [{ serviceKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required:
                  [
                    requesterId,
                    requestId,
                    awardId,
                    paymentMethodId,
                    amountMinor,
                    currency,
                    cityId,
                  ],
                properties:
                  {
                    requesterId: { type: string },
                    requestId: { type: string },
                    awardId: { type: string },
                    paymentMethodId: { type: string },
                    amountMinor:
                      {
                        type: integer,
                        description: "Bare integer minor units (matches ride-service's FundingRequest wire shape).",
                      },
                    currency: { type: string },
                    cityId: { type: string },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required:
                    [
                      authorized,
                      awardId,
                      paymentMethodId,
                      secured,
                      reservationId,
                    ],
                  properties:
                    {
                      authorized: { type: boolean, const: true },
                      awardId: { type: string },
                      paymentMethodId: { type: string },
                      secured:
                        {
                          type: boolean,
                          description: "True when a durable reservation encumbers the amount; false for explicitly unsecured cash collection.",
                        },
                      reservationId:
                        {
                          type: string,
                          nullable: true,
                          description: "The reservation backing a secured authorization; null for cash.",
                        },
                    },
                }
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/wallet/mp/funding/release:
    post:
      summary: Release an award's rider funding reservation (internal, C02)
      description: "Service-authenticated. Releases the award's ACTIVE funding reservation exactly once (status released, resolvedAt stamped, reason linked; audit in the same transaction). Idempotent and deliberately forgiving so compensation and the sweep converge instead of error-looping: already-released and never-created both answer 200 with the current state (`released: false` and `status`). A CONSUMED reservation answers `status: consumed` distinctly — the award already settled with this money, and the caller must alarm rather than retry."
      security: [{ serviceKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [awardId, reason],
                properties:
                  { awardId: { type: string }, reason: { type: string } },
              }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [released, status, awardId, reservationId],
                  properties:
                    {
                      released:
                        {
                          type: boolean,
                          description: "True only for the call that actually moved active to released.",
                        },
                      status:
                        {
                          type: string,
                          enum: [released, consumed, missing],
                          description: "The reservation's state after this call. `consumed` means the award already settled — alarm, do not retry.",
                        },
                      awardId: { type: string },
                      reservationId: { type: string, nullable: true },
                    },
                }
  /api/v1/webhooks/marketplace-assign:
    post:
      summary: Delivery execution hand-off (internal, marketplace engine → delivery-service)
      description: "Service-authenticated adapter per ADR-0002. Idempotent on awardId: creates the delivery already DRIVER_ASSIGNED with the award id, agreed fare (authoritative in minor units in the marketplace/ledger) and fencing token carried in the package metadata; a replay returns the existing delivery. Marketplace-managed deliveries are refused by the legacy first-come AcceptDelivery path."
      security: [{ serviceKey: [] }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required:
                  [
                    awardId,
                    requestId,
                    driverId,
                    customerId,
                    fareMinor,
                    currency,
                    pickup,
                    dropoff,
                    fencingToken,
                  ],
                properties:
                  {
                    awardId: { type: string },
                    requestId: { type: string },
                    driverId: { type: string },
                    customerId: { type: string },
                    fareMinor: { type: integer },
                    currency: { type: string },
                    pickup: { $ref: "#/components/schemas/Area" },
                    dropoff: { $ref: "#/components/schemas/Area" },
                    packageDetails:
                      { $ref: "#/components/schemas/DeliveryDetails" },
                    fencingToken: { type: integer },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [deliveryId, awardId],
                  properties:
                    { deliveryId: { type: string }, awardId: { type: string } },
                }
  /api/v1/deliveries/{deliveryId}/custody:
    get:
      summary: Custody timeline (C07, G08) — sender or assigned driver only
      description: "Marketplace-managed deliveries only (no delivery_custody row exists for an open-market delivery). Foreign actor, unknown delivery id, or a legacy delivery with no custody row all answer 404 — the marketplace 404 convention: existence is not revealed to a caller who is not a party."
      parameters:
        - {
            name: deliveryId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustodyTimeline" }
        "404":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/deliveries/{deliveryId}/custody/pickup-proof:
    post:
      summary: Post a pickup custody proof (C07) — assigned driver only
      description: "A proof REFERENCE, never the bytes: no S3/MinIO client is wired into delivery-service today, so this validates and stores a client-supplied object key + checksum + content-type only (see docs/marketplace/DELIVERY_CUSTODY.md). Idempotent on (deliveryId, type, sha256): an identical replay answers 200 with the existing row, never a second one. courier_assigned -> picked_up -> in_transit (a pickup starts transit immediately)."
      parameters:
        - {
            name: deliveryId,
            in: path,
            required: true,
            schema: { type: string },
          }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProofReference" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProofResult" }
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProofResult" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/deliveries/{deliveryId}/custody/delivery-proof:
    post:
      summary: Post a delivery custody proof (C07) — assigned driver only
      description: "Reaches `delivered` from in_transit, delivery_attempted or delivery_retry directly; from recipient_unreachable it chains through delivery_retry — a successful retry IS a delivery proof, there is no separate 'start retry' call. Same idempotency rule as pickup-proof."
      parameters:
        - {
            name: deliveryId,
            in: path,
            required: true,
            schema: { type: string },
          }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProofReference" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProofResult" }
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProofResult" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/deliveries/{deliveryId}/custody/recipient-unreachable:
    post:
      summary: Report the recipient unreachable (C07) — assigned driver only
      description: "in_transit -> delivery_attempted -> recipient_unreachable. Starts the return/hold-point timer (recipient_unreachable_at); the safe default (held_at_point) applies automatically once a subsequent return proposal's consent window elapses with no sender response — never an auto-charge."
      parameters:
        - {
            name: deliveryId,
            in: path,
            required: true,
            schema: { type: string },
          }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustodyStateResult" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/deliveries/{deliveryId}/custody/return/propose:
    post:
      summary: Propose a return (C07) — sender or assigned driver
      description: "recipient_unreachable -> return_proposed only. A proposed feeMinor is recorded honestly but NEVER authorizes a charge: delivery-service owns no money, and there is no payment-service delivery-return funding endpoint to call without reusing the delivery's own award-scoped commission/fare reservation — which this must never do (see docs/marketplace/DELIVERY_CUSTODY.md 'return-leg charge'). A fee-bearing proposal is gated `chargeStatus: unsupported`; only `not_required` (fee-free, or diverted to a hold point) can complete."
      parameters:
        - {
            name: deliveryId,
            in: path,
            required: true,
            schema: { type: string },
          }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [reason],
                properties:
                  {
                    reason: { type: string },
                    feeMinor: { type: integer, default: 0 },
                    currency:
                      {
                        type: string,
                        description: "Required when feeMinor > 0",
                      },
                  },
              }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnProposalResult" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/deliveries/{deliveryId}/custody/return/consent:
    post:
      summary: Sender consent/reject on a proposed return (C07) — sender ONLY
      description: "The assigned driver may propose a return but never authorize or refuse one (403 otherwise). `action: consent` on a chargeStatus=unsupported return is refused with RETURN_CHARGE_UNSUPPORTED (409) — consent is necessary but never sufficient for a charged return. `action: reject` always succeeds and moves to held_at_point, exactly like an unanswered consent window expiring (the lazy expiry check runs at the top of this endpoint, GET custody, and collected-at-point)."
      parameters:
        - {
            name: deliveryId,
            in: path,
            required: true,
            schema: { type: string },
          }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [action],
                properties:
                  { action: { type: string, enum: [consent, reject] } },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustodyStateResult" }
        "403":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "STATE_CONFLICT (no pending proposal) or RETURN_CHARGE_UNSUPPORTED (consenting to a charged return)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/deliveries/{deliveryId}/custody/collected:
    post:
      summary: Collected at a hold point (C07) — assigned driver or ops
      description: "held_at_point -> collected. Also accepts recipient_unreachable or return_proposed directly, chaining through held_at_point, so a driver taking the parcel straight to a hold point converges on the same endpoint."
      parameters:
        - {
            name: deliveryId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustodyStateResult" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/wallet/mp/holds/{reservationId}/reverse:
    post:
      summary: Reverse a captured fee with a linked journal entry (internal; compensation)
      security: [{ serviceKey: [] }]
      parameters:
        - {
            name: reservationId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [awardId, reason],
                properties:
                  { awardId: { type: string }, reason: { type: string } },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletHold" }
  /v1/admin/mp/requests:
    get:
      summary: Marketplace monitor (A01)
      parameters:
        - { name: cityId, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [rows],
                  properties:
                    {
                      rows:
                        {
                          type: array,
                          items:
                            {
                              type: object,
                              required: [requestId, state, service, cityId],
                              properties:
                                {
                                  requestId: { type: string },
                                  state: { type: string },
                                  service: { type: string },
                                  cityId: { type: string },
                                  askedMinor:
                                    { $ref: "#/components/schemas/Money" },
                                  bids: { type: integer },
                                  reach: { type: integer },
                                  envelope:
                                    {
                                      $ref: "#/components/schemas/SearchEnvelope",
                                    },
                                },
                            },
                        },
                      nextCursor: { type: string },
                    },
                }
  /v1/admin/mp/requests/{requestId}/timeline:
    get:
      summary: Versioned request/bid/award timeline (A02) — append-only, no mutations
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [requestId, policyVersion, events],
                  properties:
                    {
                      requestId: { type: string },
                      policyVersion: { type: integer },
                      events:
                        {
                          type: array,
                          items:
                            {
                              type: object,
                              required: [at, type, detail],
                              properties:
                                {
                                  at: { type: string, format: date-time },
                                  type: { type: string },
                                  detail: { type: string },
                                },
                            },
                        },
                    },
                }
  /v1/admin/mp/repairs/stranded-rides:
    post:
      summary: G04 repair — converge marketplace rides stranded in `rematching` (dryRun preview, then apply; Idempotency-Key on apply)
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                properties:
                  {
                    dryRun: { type: boolean },
                    rideIds: { type: array, items: { type: string } },
                    limit: { type: integer, maximum: 50 },
                  },
              }
      responses:
        "200":
          description: Dry-run listing or applied repair results, per ride.
  /v1/admin/mp/requests/{requestId}/resolution:
    get:
      summary: C08 unified resolution timeline — request → award → funding → commission → execution → settlement → notification
      parameters:
        [
          {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          },
        ]
      responses:
        "200":
          description: The composed resolution case for one request, with a per-stage status (view/proposed/committed/failed/unavailable) and named data-source gaps.
  /v1/admin/mp/pending-sagas:
    get:
      summary: C08 stuck-saga board — awards stuck in `award_pending`, oldest first, with saga step/attempts
      parameters:
        [
          {
            name: cityId,
            in: query,
            required: false,
            schema: { type: string },
          },
          { $ref: "#/components/parameters/Cursor" },
        ]
      responses:
        "200": { description: Paginated pending-saga rows. }
  /v1/admin/mp/awards/{awardId}/reconcile:
    post:
      summary: C08 — ask the engine to advance ONE stuck award's saga now (same step the sweep would take); dryRun previews, apply requires expectedUpdatedAt + Idempotency-Key
      parameters:
        [
          { name: awardId, in: path, required: true, schema: { type: string } },
          { $ref: "#/components/parameters/IdemKey" },
        ]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                properties:
                  {
                    dryRun: { type: boolean },
                    expectedUpdatedAt: { type: string, format: date-time },
                  },
              }
      responses:
        "200":
          { description: The reconcile outcome (preview/resolved/unresolved). }
        "409":
          {
            description: version_conflict — the award changed since expectedUpdatedAt was read.,
          }
  /v1/admin/mp/recoveries:
    get:
      summary: C08 failed reservation-recovery board — unresolved mp.reservation_recovery rows, oldest first
      parameters:
        [
          {
            name: action,
            in: query,
            required: false,
            schema: { type: string },
          },
          { $ref: "#/components/parameters/Cursor" },
        ]
      responses:
        "200": { description: Paginated recovery rows. }
  /v1/admin/mp/recoveries/{recoveryId}/retry:
    post:
      summary: C08 — force one recovery row's retry now (same runRecovery the sweep uses); dryRun previews, apply requires expectedAttempts + Idempotency-Key
      parameters:
        [
          {
            name: recoveryId,
            in: path,
            required: true,
            schema: { type: string },
          },
          { $ref: "#/components/parameters/IdemKey" },
        ]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                properties:
                  {
                    dryRun: { type: boolean },
                    expectedAttempts: { type: integer },
                  },
              }
      responses:
        "200":
          {
            description: The retry outcome (preview/resolved/deferred/already_resolved).,
          }
        "409":
          {
            description: version_conflict — the row's attempts changed since expectedAttempts was read.,
          }
  /v1/admin/mp/cancellations:
    get:
      summary: C08 cancellations/no-shows board — marketplace-managed rides ended cancelled_by_driver/cancelled_by_rider/no_show, newest first
      parameters:
        [
          {
            name: cityId,
            in: query,
            required: false,
            schema: { type: string },
          },
          {
            name: driverId,
            in: query,
            required: false,
            schema: { type: string },
          },
          { $ref: "#/components/parameters/Cursor" },
        ]
      responses:
        "200": { description: Paginated cancellation/no-show rows. }
  /v1/admin/mp/drivers/standing:
    get:
      summary: C08 pattern-detection board (abuse addendum A06) — drivers whose trailing-window cancellation rate is worst first, computed live
      parameters:
        [
          {
            name: cityId,
            in: query,
            required: false,
            schema: { type: string },
          },
          {
            name: windowDays,
            in: query,
            required: false,
            schema: { type: integer },
          },
          {
            name: minRides,
            in: query,
            required: false,
            schema: { type: integer },
          },
          {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer },
          },
          {
            name: offset,
            in: query,
            required: false,
            schema: { type: integer },
          },
        ]
      responses:
        "200": { description: Offset-paginated driver standing rows. }
  /v1/admin/mp/drivers/{driverId}/standing:
    get:
      summary: C08 — one driver's completion/cancellation/no-show aggregate, blocked state and standing-action history
      parameters:
        [
          {
            name: driverId,
            in: path,
            required: true,
            schema: { type: string },
          },
          {
            name: windowDays,
            in: query,
            required: false,
            schema: { type: integer },
          },
        ]
      responses:
        "200": { description: The driver standing summary. }
  /v1/admin/mp/drivers/{driverId}/standing-actions:
    post:
      summary: C08 — propose a standing action (warning/suspension/reinstatement). Suspension/reinstatement are PROTECTED and stay pending_approval until a second, distinct operator approves them; a reasonCode is required. Idempotency-Key required.
      parameters:
        [
          {
            name: driverId,
            in: path,
            required: true,
            schema: { type: string },
          },
          { $ref: "#/components/parameters/IdemKey" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [actionType, reasonCode, cityId],
                properties:
                  {
                    actionType:
                      {
                        type: string,
                        enum: [warning, suspension, reinstatement],
                      },
                    reasonCode: { type: string },
                    reasonNote: { type: string },
                    cityId: { type: string },
                  },
              }
      responses:
        "201": { description: The created standing-action row. }
  /v1/admin/mp/standing-actions:
    get:
      summary: C08 — the standing-action review queue, filterable by status, newest first
      parameters:
        [
          {
            name: status,
            in: query,
            required: false,
            schema: { type: string },
          },
          { $ref: "#/components/parameters/Cursor" },
        ]
      responses:
        "200": { description: Paginated standing-action rows. }
  /v1/admin/mp/standing-actions/{actionId}/decide:
    post:
      summary: C08 maker-checker — approve or reject a pending protected standing action. The proposer can never decide their own proposal (403 forbidden). A reason is required. Idempotency-Key required.
      parameters:
        [
          {
            name: actionId,
            in: path,
            required: true,
            schema: { type: string },
          },
          { $ref: "#/components/parameters/IdemKey" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [approve, reason],
                properties:
                  { approve: { type: boolean }, reason: { type: string } },
              }
      responses:
        "200": { description: The decided standing-action row. }
        "403":
          {
            description: forbidden — the proposer cannot decide their own proposal.,
          }
        "409":
          {
            description: version_conflict — this action is no longer pending_approval.,
          }
  /v1/admin/mp/standing-actions/{actionId}/appeal:
    post:
      summary: C08 — record that an active suspension is being appealed (e.g. filed through support). A note is required. Idempotency-Key required.
      parameters:
        [
          {
            name: actionId,
            in: path,
            required: true,
            schema: { type: string },
          },
          { $ref: "#/components/parameters/IdemKey" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [note],
                properties: { note: { type: string } },
              }
      responses:
        "200": { description: The appealed standing-action row. }
        "409":
          {
            description: version_conflict — only an active suspension can be appealed.,
          }
  /v1/admin/mp/standing-actions/{actionId}/appeal-decision:
    post:
      summary: C08 maker-checker — decide a filed appeal (uphold overturns the suspension; deny leaves it standing). The operator who filed the appeal can never decide it (403 forbidden). A reason is required. Idempotency-Key required.
      parameters:
        [
          {
            name: actionId,
            in: path,
            required: true,
            schema: { type: string },
          },
          { $ref: "#/components/parameters/IdemKey" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [uphold, reason],
                properties:
                  { uphold: { type: boolean }, reason: { type: string } },
              }
      responses:
        "200": { description: The decided standing-action row. }
        "403":
          {
            description: forbidden — the appeal filer cannot decide their own appeal.,
          }
        "409":
          { description: version_conflict — this action has no pending appeal. }
