            lat: { type: number },
            lng: { type: number },
            radiusMeters: { type: integer },
            label: { type: string },
          },
      }
    DriverPreferences:
      {
        type: object,
        description: "A04.2 driver preferences in one city, versioned and append-only (version 0 = unsaved defaults). They FILTER and RANK the feed and PRE-FILL a suggested preset; they are never eligibility and never bid. The per-km rate and minimum trip fare stay in rate profiles.",
        required:
          [
            driverId,
            cityId,
            version,
            currency,
            timezone,
            minimumTripAmountMinor,
            maxPickupDistanceMeters,
            acceptsDeliveries,
            acceptsStops,
            maxStops,
            homeward,
            homewardOnly,
            availabilityWindows,
            availabilityNote,
            bounds,
            disclosure,
            updatedAt,
          ],
        properties:
          {
            driverId: { type: string },
            cityId: { type: string },
            version: { type: integer, minimum: 0 },
            currency: { type: string },
            timezone: { type: string },
            minimumTripAmountMinor:
              {
                oneOf:
                  [{ $ref: "#/components/schemas/Money" }, { type: "null" }],
                description: "Hide requests whose MAXIMUM fare cannot reach this; null = none.",
              },
            maxPickupDistanceMeters:
              {
                type: [integer, "null"],
                description: "Hide pickups farther than this; null = the request's envelope decides (a preference never widens it).",
              },
            acceptsDeliveries: { type: boolean },
            acceptsStops: { type: boolean },
            maxStops:
              {
                type: [integer, "null"],
                description: "Null = up to the market's stop limit; cleared when stops are declined.",
              },
            homeward:
              {
                oneOf:
                  [{ $ref: "#/components/schemas/Homeward" }, { type: "null" }],
              },
            homewardOnly: { type: boolean },
            availabilityWindows:
              {
                type: array,
                items:
                  {
                    allOf:
                      [
                        { $ref: "#/components/schemas/AvailabilityWindow" },
                        {
                          type: object,
                          required: [label],
                          properties: { label: { type: string } },
                        },
                      ],
                  },
              },
            availabilityNote: { type: string },
            acceptsPreferredRequests:
              {
                type: boolean,
                description: "A04 item 3: the opt-in to riders naming this driver on a preferred request. Off unless the driver turns it on.",
              },
            preferredRequestsNote: { type: string },
            bounds:
              {
                type: object,
                required:
                  [
                    minimumTripAmountMaxMinor,
                    maxPickupDistanceMeters,
                    maxStopsCeiling,
                    homewardRadiusMeters,
                    maxAvailabilityWindows,
                  ],
                properties:
                  {
                    minimumTripAmountMaxMinor:
                      {
                        oneOf:
                          [
                            { $ref: "#/components/schemas/Money" },
                            { type: "null" },
                          ],
                      },
                    maxPickupDistanceMeters:
                      {
                        type: object,
                        required: [min, max],
                        properties:
                          { min: { type: integer }, max: { type: integer } },
                      },
                    maxStopsCeiling: { type: integer },
                    homewardRadiusMeters:
                      {
                        type: object,
                        required: [min, max],
                        properties:
                          { min: { type: integer }, max: { type: integer } },
                      },
                    maxAvailabilityWindows: { type: integer },
                  },
              },
            disclosure: { type: string },
            updatedAt: { type: [string, "null"], format: date-time },
          },
      }
    DriverJob:
      {
        type: object,
        required: [claimId, slot, service, state, fareMinor, commissionMinor],
        properties:
          {
            claimId: { type: string },
            requestId:
              {
                type: string,
                description: "The award's marketplace request — the key of the trip, stop and amendment routes (/v1/mp/requests/{requestId}/...). Absent only for a claim with no award.",
              },
            passenger:
              {
                $ref: "#/components/schemas/DriverPassenger",
                description: "A06 part B: present only on a trip booked for another adult — the passenger's first name and the pickup verification, never the phone or the requester.",
              },
            slot: { type: string, enum: [current, next] },
            service: { type: string, enum: [ride, delivery] },
            state: { type: string },
            fareMinor: { $ref: "#/components/schemas/Money" },
            commissionMinor: { $ref: "#/components/schemas/Money" },
            receiptId: { type: string },
            executionRef:
              {
                type: object,
                required: [service, id],
                properties:
                  {
                    service: { type: string, enum: [ride, delivery] },
                    id: { type: string },
                  },
              },
            pickupWindow:
              {
                type: object,
                required: [earliestSec, latestSec, etaVersion],
                properties:
                  {
                    earliestSec: { type: integer },
                    latestSec: { type: integer },
                    etaVersion: { type: integer },
                  },
              },
          },
      }
    RateProfile:
      {
        type: object,
        required:
          [
            profileId,
            driverId,
            version,
            cityId,
            service,
            vehicleClass,
            currency,
            perKmMinor,
            minimumTripFareMinor,
            components,
            createdAt,
          ],
        properties:
          {
            profileId: { type: string },
            driverId: { type: string },
            version: { type: integer },
            cityId: { type: string },
            service: { type: string, enum: [ride, delivery] },
            vehicleClass: { type: string },
            currency: { type: string },
            perKmMinor:
              {
                type: integer,
                description: "Gross (before 10% commission) minor units per routed km.",
              },
            minimumTripFareMinor: { type: integer },
            components:
              {
                type: object,
                properties:
                  {
                    perMinuteMinor: { type: integer },
                    pickupPerKmMinor: { type: integer },
                    handlingMinor: { type: integer },
                  },
              },
            createdAt: { type: string, format: date-time },
          },
      }
    WalletHold:
      {
        type: object,
        required:
          [
            reservationId,
            bidId,
            driverId,
            state,
            amountMinor,
            commissionBps,
            createdAt,
          ],
        properties:
          {
            reservationId: { type: string },
            bidId: { type: string },
            driverId: { type: string },
            state:
              {
                type: string,
                enum: [active, capture_pending, captured, released, reversed],
              },
            amountMinor: { $ref: "#/components/schemas/Money" },
            commissionBps: { type: integer, const: 1000 },
            baseMinor: { $ref: "#/components/schemas/Money" },
            roundingRule: { type: string, const: half_up },
            policyVersion: { type: integer },
            createdAt: { type: string, format: date-time },
            releasedAt: { type: string, format: date-time },
            capturedAt: { type: string, format: date-time },
          },
      }
    WalletOverview:
      {
        type: object,
        description: "The single spendable calculation: cleared journal balance minus active holds. Every debit path honors it.",
        required: [clearedMinor, heldMinor, spendableMinor, holds],
        properties:
          {
            clearedMinor: { $ref: "#/components/schemas/Money" },
            heldMinor: { $ref: "#/components/schemas/Money" },
            spendableMinor: { $ref: "#/components/schemas/Money" },
            holds:
              {
                type: array,
                items: { $ref: "#/components/schemas/WalletHold" },
              },
          },
      }
    # ── Book for Later (A03) ──────────────────────────────────────────────
    # Two explicitly different products: a SCHEDULED REQUEST (a stored
    # intent; no driver is secured until an offer is selected after it is
    # published at the market's lead time — flag scheduled_rides) and an
    # ADVANCE DRIVER RESERVATION (drivers bid on a future window now; the
    # requester selects one in advance; the commission is captured once at
    # that award; flag marketplace_advance_reservations) — plus recurring
    # templates (flag marketplace_recurring_journeys). All deny-by-default.
    AdvanceOffer:
      type: object
      description: "A03: an offer on an advance-booking request — a driver's bid on a FUTURE pickup window, not transport now. Listed under the snapshot's advanceOffers, never under offers. pickupLabel names the booked window; pickupWindow is null (no live ETA). Private per driver like Offer."
      required:
        [
          bidId,
          bidVersion,
          requestRevision,
          amountMinor,
          kind,
          driver,
          pickupLabel,
          expiresAt,
          withdrawn,
        ]
      properties:
        bidId: { type: string }
        bidVersion: { type: integer }
        requestRevision: { type: integer }
        amountMinor: { $ref: "#/components/schemas/Money" }
        kind: { type: string, enum: [advance_booking] }
        driver: { $ref: "#/components/schemas/OfferDriver" }
        pickupLabel: { type: string }
        pickupWindow: { type: "null" }
        expiresAt: { type: string, format: date-time }
        withdrawn: { type: boolean }
        whyRecommended: { type: [string, "null"] }
        bookingFeeMinor: { $ref: "#/components/schemas/Money" }
        totalMinor: { $ref: "#/components/schemas/Money" }
        deltaLabel: { type: [string, "null"] }
    PickupScheduleInput:
      type: object
      additionalProperties: false
      required: [localDate, localTime]
      description: "A requested pickup: local date + local wall time + IANA timezone. The server resolves and stores the UTC instant; a client never sends one."
      properties:
        localDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        localTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        timeZone:
          { type: string, description: "IANA zone; the city's when omitted." }
        windowMinutes:
          {
            type: integer,
            minimum: 1,
            description: "Bounded by the market's scheduling policy.",
          }
        dstDisambiguation:
          type: string
          enum: [compatible, earlier, later, reject]
          description: "compatible (default): a spring-forward gap shifts forward by the gap, a fall-back overlap takes the earlier instant; earlier/later pick explicitly; reject refuses both (validation_failed)."
    PickupSchedule:
      type: object
      required:
        [
          localDate,
          localTime,
          timeZone,
          utcOffset,
          dstResolution,
          pickupAt,
          windowStart,
          windowEnd,
          windowMinutes,
          label,
        ]
      properties:
        localDate: { type: string }
        localTime: { type: string }
        timeZone: { type: string }
        utcOffset: { type: string, example: "+01:00" }
        dstResolution:
          type: string
          enum:
            [
              exact,
              gap_shifted_forward,
              gap_shifted_backward,
              overlap_earlier,
              overlap_later,
            ]
        pickupAt: { type: string, format: date-time }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        windowMinutes: { type: integer }
        label: { type: string }
    RequestBooking:
      type: object
      required: [kind, schedule, scheduledRequestId, driverSecured, notice]
      properties:
        kind: { type: string, enum: [scheduled, advance] }
        schedule: { $ref: "#/components/schemas/PickupSchedule" }
        scheduledRequestId: { type: [string, "null"] }
        driverSecured:
          {
            type: boolean,
            description: "False until an offer is selected and confirmed.",
          }
        notice: { type: string }
    AdvanceCommitment:
      type: object
      description: "What an advance bid commits the driver's wallet to: the 10% held from the cleared balance while the offer stands, captured ONCE at the advance award, never charged again at activation, returned with a linked reversal if the booking fails or is cancelled."
      required:
        [
          commissionMinor,
          heldFrom,
          capturedAt,
          chargedAgainAtActivation,
          holdExpiresAt,
          pickupWindowStart,
          pickupWindowEnd,
          terms,
        ]
      properties:
        commissionMinor: { $ref: "#/components/schemas/Money" }
        heldFrom: { type: string, const: cleared_balance }
        capturedAt: { type: string, const: advance_award }
        chargedAgainAtActivation: { type: boolean, const: false }
        holdExpiresAt: { type: [string, "null"], format: date-time }
        pickupWindowStart: { type: string, format: date-time }
        pickupWindowEnd: { type: string, format: date-time }
        terms: { type: array, items: { type: string } }
    ScheduledRequest:
      type: object
      description: "A stored Book for Later intent — a scheduled request, or one occurrence of a recurring template. NO driver is secured in any state; `published` hands it to an ordinary request (requestId)."
      required:
        [
          scheduledRequestId,
          product,
          state,
          version,
          driverSecured,
          statusLabel,
          notice,
          schedule,
          publishAt,
          requestedFareMinor,
          maxFareMinor,
          paymentMethodId,
        ]
      properties:
        scheduledRequestId: { type: string }
        product:
          { type: string, enum: [scheduled_request, advance_reservation] }
        state:
          type: string
          enum:
            [
              scheduled_unassigned,
              needs_rider_approval,
              published,
              cancelled,
              skipped,
              expired,
              unfulfilled,
            ]
        version: { type: integer }
        driverSecured: { type: boolean }
        statusLabel:
          { type: string, example: "Scheduled — no driver secured yet" }
        notice: { type: string }
        service: { type: string, enum: [ride] }
        vehicleClass: { type: string }
        cityId: { type: string }
        currency: { type: string }
        pickup: { $ref: "#/components/schemas/Area" }
        dropoff: { $ref: "#/components/schemas/Area" }
        stops:
          { type: array, items: { $ref: "#/components/schemas/RouteStop" } }
        schedule: { $ref: "#/components/schemas/PickupSchedule" }
        publishAt: { type: string, format: date-time }
        requestedFareMinor: { $ref: "#/components/schemas/Money" }
        maxFareMinor:
          {
            $ref: "#/components/schemas/Money",
            description: "The most the rider approved; refreshed bounds above it need renewed approval.",
          }
        paymentMethodId: { type: string }
        requestId: { type: [string, "null"] }
        requestState: { type: [string, "null"] }
        templateId: { type: [string, "null"] }
        occurrenceDate: { type: [string, "null"] }
        approval:
          type: [object, "null"]
          properties:
            reason:
              type: string
              enum:
                [
                  fare_above_approval,
                  payment_method_unavailable,
                  funding_unavailable,
                ]
            message: { type: string }
            refreshedTerms:
              type: [object, "null"]
              properties:
                minimumFareMinor: { $ref: "#/components/schemas/Money" }
                maximumFareMinor: { $ref: "#/components/schemas/Money" }
                suggestedFareMinor: { $ref: "#/components/schemas/Money" }
        closeReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BookingFailure:
      type: object
      required: [reason, message, financialOutcome, rematchAvailable]
      properties:
        reason:
          type: string
          enum:
            [
              driver_withdrew,
              driver_ineligible,
              reconfirmation_missed,
              funding_not_secured,
              driver_unavailable,
              driver_on_running_trip,
              execution_blocked,
              award_cancelled,
              trip_cancelled,
              rider_cancelled,
            ]
        message: { type: string }
        financialOutcome:
          type: object
          required: [commissionReversed, riderFundingReleased, riderCharged]
          properties:
            commissionReversed: { type: boolean }
            riderFundingReleased: { type: boolean }
            riderCharged: { type: boolean, const: false }
        rematchAvailable:
          {
            type: boolean,
            description: "A consented re-publish is available — never an automatic substitute.",
          }
    AdvanceBooking:
      type: object
      description: "An advance driver reservation on the driver's booking calendar (separate from the live current/next slots). held → confirmed (funding secured, or cash explicitly unsecured) | payment_pending (driver reserved, rider funding not yet secured) → reconfirmed → activated (into the live slots, exactly once, no second commission) → completed; failed / cancelled carry the explained financial outcome."
      required:
        [
          bookingId,
          requestId,
          awardId,
          state,
          version,
          viewer,
          driverReserved,
          fullySecured,
          statusLabel,
          notices,
          schedule,
          pickup,
          dropoff,
          fareMinor,
          funding,
          reconfirmation,
          activationAt,
        ]
      properties:
        bookingId: { type: string }
        requestId: { type: string }
        awardId: { type: string }
        state:
          type: string
          enum:
            [
              held,
              payment_pending,
              confirmed,
              reconfirmed,
              activated,
              completed,
              failed,
              cancelled,
              released,
            ]
        version: { type: integer }
        viewer: { type: string, enum: [rider, driver] }
        driverReserved: { type: boolean }
        fullySecured: { type: boolean }
        statusLabel: { type: string }
        notices:
          {
            type: array,
            items: { type: string },
            description: "Always includes the no-guaranteed-pickup disclosure for the rider.",
          }
        schedule: { $ref: "#/components/schemas/PickupSchedule" }
        pickup: { $ref: "#/components/schemas/Area" }
        dropoff: { $ref: "#/components/schemas/Area" }
        fareMinor: { $ref: "#/components/schemas/Money" }
        commissionMinor:
          {
            $ref: "#/components/schemas/Money",
            description: "Driver view only: captured once at the advance award.",
          }
        netMinor: { $ref: "#/components/schemas/Money" }
        driver: { $ref: "#/components/schemas/OfferDriver" }
        funding:
          type: object
          required: [state, label, dueAt, deadline]
          properties:
            state:
              type: string
              enum: [pending, secured, unsecured_cash, refused, released]
            label: { type: string }
            dueAt: { type: [string, "null"], format: date-time }
            deadline: { type: [string, "null"], format: date-time }
        reconfirmation:
          type: object
          required: [opensAt, deadline, reconfirmedAt]
          properties:
            opensAt: { type: string, format: date-time }
            deadline: { type: string, format: date-time }
            reconfirmedAt: { type: [string, "null"], format: date-time }
        activationAt: { type: string, format: date-time }
        activatedSlot: { type: [string, "null"], enum: [current, next, null] }
        failure:
          oneOf:
            - { $ref: "#/components/schemas/BookingFailure" }
            - { type: "null" }
        rematchRequestId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecurringTemplate:
      type: object
      description: "A recurring journey, stored apart from its occurrences (ScheduledRequest rows with templateId + occurrenceDate). Each occurrence has its own approval, funding, driver commitment, cancellation and receipt; a series is never `confirmed`."
      required:
        [
          templateId,
          state,
          version,
          product,
          daysOfWeek,
          localTime,
          timeZone,
          startsOn,
          windowMinutes,
          requestedFareMinor,
          maxFareMinor,
          paymentMethodId,
          seriesNote,
          occurrences,
        ]
      properties:
        templateId: { type: string }
        state: { type: string, enum: [active, paused, cancelled, ended] }
        version: { type: integer }
        product:
          { type: string, enum: [scheduled_request, advance_reservation] }
        daysOfWeek:
          type: array
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        localTime: { type: string }
        timeZone: { type: string }
        startsOn: { type: string }
        endsOn: { type: [string, "null"] }
        windowMinutes: { type: integer }
        requestedFareMinor: { $ref: "#/components/schemas/Money" }
        maxFareMinor: { $ref: "#/components/schemas/Money" }
        paymentMethodId: { type: string }
        service: { type: string }
        vehicleClass: { type: string }
        pickup: { $ref: "#/components/schemas/Area" }
        dropoff: { $ref: "#/components/schemas/Area" }
        stops:
          { type: array, items: { $ref: "#/components/schemas/RouteStop" } }
        generatedThrough: { type: [string, "null"] }
        seriesNote: { type: string }
        occurrences:
          type: array
          items: { $ref: "#/components/schemas/ScheduledRequest" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OfferPickupEstimate:
      type: object
      description: "A06 part A: an offer's pickup ESTIMATE — the eligibility prediction the bid passed (minute-coarsened) and when it was made, else a live straight-line estimate, else unavailable. Never a promise."
      required: [seconds, basis, label, estimatedAt, estimate]
      properties:
        seconds: { type: [integer, "null"], minimum: 0 }
        basis:
          type: string
          enum:
            [
              routed_leg,
              finishing_trip_prediction,
              straight_line_estimate,
              advance_booking,
              unavailable,
            ]
        label: { type: string }
        estimatedAt: { type: [string, "null"], format: date-time }
        estimate: { type: boolean, const: true }
    OfferVehicle:
      type: object
      description: "The class ride-service verified the driver eligible for; the registered vehicle only from a VERIFIED user-service card. Seat capacity is null where the market publishes none."
      required:
        [
          class,
          capacitySeats,
          capacityNote,
          bodyType,
          make,
          model,
          colour,
          plateMasked,
          verified,
        ]
      properties:
        class: { type: string }
        capacitySeats: { type: [integer, "null"] }
        capacityNote: { type: string }
        bodyType:
          type: [string, "null"]
          enum: [sedan, suv, van, motorcycle, electric, null]
        make: { type: [string, "null"] }
        model: { type: [string, "null"] }
        colour: { type: [string, "null"] }
        plateMasked: { type: [string, "null"] }
        verified: { type: boolean }
    OfferDriverProfile:
      type: object
      description: "The driver card from user-service's privacy-limited read model. status verified / not_verified (checks not complete) / unavailable (no card could be resolved — unconfigured, down, slow, malformed or non-disclosing; every field null, the offer is still served). rating is exactly user-service's {average, count} or null — never invented."
      required:
        [
          status,
          label,
          displayName,
          initials,
          photoRef,
          photoVerified,
          verifiedAt,
          rating,
          ratingLabel,
          completedTrips,
          memberSince,
          accessibility,
        ]
      properties:
        status: { type: string, enum: [verified, not_verified, unavailable] }
        label: { type: string }
        displayName: { type: [string, "null"] }
        initials: { type: [string, "null"] }
        photoRef: { type: [string, "null"] }
        photoVerified: { type: [boolean, "null"] }
        verifiedAt: { type: [string, "null"], format: date }
        rating:
          oneOf:
            - type: object
              required: [average, count]
              properties:
                average: { type: number, minimum: 1, maximum: 5 }
                count: { type: integer, minimum: 1 }
            - { type: "null" }
        ratingLabel: { type: string }
        completedTrips: { type: [integer, "null"], minimum: 0 }
        memberSince: { type: [string, "null"] }
        accessibility: { type: string, enum: [unavailable] }
    Reliability:
      type: object
      description: "Reliability, DEFINED: of the marketplace rides the driver was awarded in the trailing windowDays that ended, the share completed and the share the driver cancelled (rider cancellations, rider no-shows, declined or lapsed preferred invitations and trips under way are not counted). Below minimumSample the status is insufficient_history and both rates are null. Rates are basis points summing to 10,000."
      required:
        [
          status,
          definition,
          windowDays,
          minimumSample,
          sampleSize,
          completedJobs,
          driverCancellations,
          completionRateBps,
          driverCancellationRateBps,
          label,
          computedAt,
        ]
      properties:
        status:
          { type: string, enum: [available, insufficient_history, unavailable] }
        definition: { type: string }
        windowDays: { type: integer }
        minimumSample: { type: integer }
        sampleSize: { type: integer }
        completedJobs: { type: integer }
        driverCancellations: { type: integer }
        completionRateBps:
          { type: [integer, "null"], minimum: 0, maximum: 10000 }
        driverCancellationRateBps:
          { type: [integer, "null"], minimum: 0, maximum: 10000 }
        label: { type: string }
        computedAt: { type: string, format: date-time }
    Criterion:
      type: object
      description: "One named fact behind a service-fit point or a badge."
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
    ServiceFit:
      type: object
      description: "One point per criterion — driver details verified, a driver the rider saved, each stated preference the driver's VERIFIED vehicle meets — every matched and unmet criterion named."
      required: [score, maxScore, matched, unmet, definition]
      properties:
        score: { type: integer }
        maxScore: { type: integer }
        matched:
          { type: array, items: { $ref: "#/components/schemas/Criterion" } }
        unmet:
          { type: array, items: { $ref: "#/components/schemas/Criterion" } }
        definition: { type: string }
    OfferOrder:
      type: object
      description: "Which order a snapshot's offers are in (and the other orders), with the tie-breaks each applies."
      required: [sort, label, tieBreak, options, note]
      properties:
        sort: { type: string, enum: [offered, price, pickup, service_fit] }
        label: { type: string }
        tieBreak: { type: string }
        options:
          type: array
          items:
            type: object
            required: [key, label, tieBreak]
            properties:
              key: { type: string, enum: [offered, price, pickup, service_fit] }
              label: { type: string }
              tieBreak: { type: string }
        note: { type: string }
    ServiceNeedsInput:
      type: object
      additionalProperties: false
      description: "A06 part D (marketplace_accessibility_requirements; rides only). Requirements match VERIFIED capability only; preferences only affect the service-fit order."
      properties:
        requirements:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
              [
                wheelchair_accessible_vehicle,
                assistance_animal,
                extra_luggage_capacity,
              ]
        preferences:
          type: array
          maxItems: 2
          items: { type: string, enum: [larger_vehicle, electric_vehicle] }
    ServiceNeeds:
      type: object
      required: [requirements, preferences]
      properties:
        requirements:
          type: array
          items:
            type: string
            enum:
              [
                wheelchair_accessible_vehicle,
                assistance_animal,
                extra_luggage_capacity,
              ]
        preferences:
          type: array
          items: { type: string, enum: [larger_vehicle, electric_vehicle] }
    ServiceNeedsCatalog:
      type: object
      description: "The requirements a rider may state, each with its honest availability in the rider's market (unavailable wherever no verified capability source reports supply), and the soft preferences (ranking only)."
      required:
        [
          cityId,
          service,
          vehicleClass,
          requirements,
          preferences,
          fallback,
          disclosure,
        ]
      properties:
        cityId: { type: string }
        service: { type: string, enum: [ride] }
        vehicleClass: { type: string }
        requirements:
          type: array
          items:
            type: object
            required: [code, title, availability, detail]
            properties:
              code: { type: string }
              title: { type: string }
              availability: { type: string, enum: [verified, unavailable] }
              detail: { type: string }
        preferences:
          type: array
          items:
            type: object
            required: [code, title, effect, detail]
            properties:
              code: { type: string }
              title: { type: string }
              effect: { type: string, enum: [ranking_only] }
              detail: { type: string }
        fallback: { type: string }
        disclosure: { type: string }
    PreferredDriverPolicy:
      type: object
      description: "Per-market preferred-driver window (MarketplacePolicy.preferredDriver). Absent: the pilot 120 s (half the request lifetime where requests live shorter). Always strictly shorter than the request lifetime."
      required: [exclusiveWindowSec]
      properties:
        exclusiveWindowSec: { type: integer, minimum: 30, maximum: 900 }
    PreferredDriverInput:
      type: object
      additionalProperties: false
      description: "A04 item 3 (marketplace_preferred_drivers; rides only): ask a driver the rider saved after a completed trip, who opted in. fallbackToMarket is REQUIRED — the rider's explicit consent (or refusal) to open the request to every driver if the named one does not offer in the window."
      required: [driverId, fallbackToMarket]
      properties:
        driverId: { type: string, format: uuid }
        fallbackToMarket: { type: boolean }
    PreferredDriver:
      type: object
      description: "The requester's view of the window (mpPreferredWindow): exclusive (only the named driver may discover and offer — through the ordinary funded-bid path, nothing waived) → market_open (window over, no live offer from them, fallback consented) or closed (no consent: the request expired free, closeReason preferred_driver_unavailable)."
      required:
        [driverId, state, windowSec, windowEndsAt, fallbackToMarket, label]
      properties:
        driverId: { type: string }
        state: { type: string, enum: [exclusive, market_open, closed] }
        windowSec: { type: integer }
        windowEndsAt: { type: string, format: date-time }
        fallbackToMarket: { type: boolean }
        label: { type: string }
    PreferredInvitation:
      type: object
      description: "The named driver's invitation (feed card / driver view). Never identifies the rider; declining is free."
      required: [windowEndsAt, label, note, canDecline]
      properties:
        windowEndsAt: { type: string, format: date-time }
        label: { type: string }
        note: { type: string }
        canDecline: { type: boolean }
    PreferredDecline:
      type: object
      required: [requestId, declined, declinedAt, note]
      properties:
        requestId: { type: string }
        declined: { type: boolean, const: true }
        declinedAt: { type: string, format: date-time }
        note: { type: string }
    FavouriteDriver:
      type: object
      description: "A saved driver. canRequest says whether the rider may ask them first right now; why not (opted out, or not taking marketplace work) is deliberately not distinguished."
      required:
        [
          driverId,
          cityId,
          state,
          savedAt,
          driver,
          driverProfile,
          canRequest,
          canRequestLabel,
        ]
      properties:
        driverId: { type: string }
        cityId: { type: string }
        state: { type: string, enum: [active, removed] }
        savedAt: { type: string, format: date-time }
        driver: { $ref: "#/components/schemas/OfferDriver" }
        driverProfile: { $ref: "#/components/schemas/OfferDriverProfile" }
        canRequest: { type: boolean }
        canRequestLabel: { type: string }
    FavouriteDrivers:
      type: object
      required: [items, note]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FavouriteDriver" }
        note: { type: string }
    ReceiptLine:
      type: object
      required: [code, label, amountMinor]
      properties:
        code:
          type: string
          enum:
            [
              agreed_fare,
              route_change,
              stop_waiting,
              early_termination,
              commission,
              commission_adjustment,
            ]
        label: { type: string }
        amountMinor: { $ref: "#/components/schemas/Money" }
        amendmentId: { type: string }
        committedAt: { type: string, format: date-time }
    Receipt:
      type: object
      description: "A COMPLETED marketplace ride's receipt, to its two parties only. lines (agreed fare + committed adjustments) sum to totalMinor, which equals reconciliation.settledFareMinor. The rider's view carries taxes (the INCLUDED share at the market's configured rates for the trip's pricing snapshot — nothing is added) and never a commission line; the driver's view carries driver (gross, the 10% captured once plus linked adjustments, net). JSON only; a PDF rendering is a documented follow-up."
      required:
        [
          receiptId,
          viewer,
          requestId,
          awardId,
          executionId,
          currency,
          lines,
          totalMinor,
          payment,
          trip,
          settlement,
          reconciliation,
          format,
          issuedAt,
        ]
      properties:
        receiptId: { type: string }
        viewer: { type: string, enum: [rider, driver] }
        requestId: { type: string }
        awardId: { type: string }
        executionId: { type: string }
        currency: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReceiptLine" }
        totalMinor: { $ref: "#/components/schemas/Money" }
        taxes:
          type: object
          required: [basis, lines, note]
          properties:
            basis:
              { type: string, enum: [included, not_configured, unavailable] }
            lines:
              type: array
              items:
                type: object
                required: [code, rateBps, label, amountMinor]
                properties:
                  code: { type: string }
                  rateBps: { type: integer }
                  label: { type: string }
                  amountMinor: { $ref: "#/components/schemas/Money" }
            note: { type: string }
        payment:
          type: object
          required: [method, label]
          properties:
            method: { type: string, enum: [wallet, cash] }
            label: { type: string }
        trip:
          type: object
          required:
            [
              service,
              vehicleClass,
              pickup,
              dropoff,
              stopCount,
              stopsVisited,
              stopsSkipped,
              routedDistanceMeters,
              startedAt,
              completedAt,
              terminatedEarly,
              driver,
            ]
          properties:
            service: { type: string, enum: [ride] }
            vehicleClass: { type: string }
            pickup: { type: string }
            dropoff: { type: string }
            stopCount: { type: integer }
            stopsVisited: { type: integer }
            stopsSkipped: { type: integer }
            routedDistanceMeters: { type: integer }
            startedAt: { type: [string, "null"], format: date-time }
            completedAt: { type: string, format: date-time }
            terminatedEarly: { type: boolean }
            driver: { $ref: "#/components/schemas/OfferDriver" }
        settlement:
          type: object
          required: [status, settledAt, note]
          properties:
            status: { type: string, enum: [posted, pending] }
            settledAt: { type: [string, "null"], format: date-time }
            note: { type: string }
        reconciliation:
          type: object
          required:
            [
              originalFareMinor,
              adjustmentsMinor,
              totalMinor,
              settledFareMinor,
              rule,
            ]
          properties:
            originalFareMinor: { $ref: "#/components/schemas/Money" }
            adjustmentsMinor: { $ref: "#/components/schemas/Money" }
            totalMinor: { $ref: "#/components/schemas/Money" }
            settledFareMinor: { $ref: "#/components/schemas/Money" }
            rule: { type: string }
        driver:
          type: object
          required:
            [
              grossMinor,
              commissionBps,
              commissionLines,
              commissionMinor,
              netMinor,
              note,
            ]
          properties:
            grossMinor: { $ref: "#/components/schemas/Money" }
            commissionBps: { type: integer, const: 1000 }
            commissionLines:
              type: array
              items: { $ref: "#/components/schemas/ReceiptLine" }
            commissionMinor: { $ref: "#/components/schemas/Money" }
            netMinor: { $ref: "#/components/schemas/Money" }
            note: { type: string }
        format: { type: string, enum: [json] }
        issuedAt: { type: string, format: date-time }
    PassengerInput:
      description: "A06 part B (marketplace_guest_bookings, deny by default; rides only): book the ride for another named ADULT. Both attestations are required: isAdult false is refused 422 with details.reason unaccompanied_minor_not_supported (unaccompanied minors need a separately designed service), consentConfirmed false with passenger_consent_required, either missing with passenger_attestation_required. Names are letters (any script), combining marks, spaces, hyphens and apostrophes (lastName may also carry full stops) — the first name opens a UBI-sent SMS to a number the requester chose, so it can never carry a link, a number or a call to action (422 validation_failed otherwise). The requester stays the payer and the only authenticated party."
      type: object
      additionalProperties: false
      required: [firstName, phone, isAdult, consentConfirmed]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 40 }
        lastName: { type: string, maxLength: 60 }
        phone: { type: string, pattern: "^\\+[1-9][0-9]{7,14}$" }
        isAdult: { type: boolean }
        consentConfirmed: { type: boolean }
    RequestPassenger:
      description: "The passenger block of the requester's own request view: what they entered, on this request only, and where the passenger's trip link stands. Never the link token."
      type: object
      required:
        [
          firstName,
          lastName,
          phone,
          payerRole,
          attestation,
          attestedAt,
          accessStatus,
          accessSentAt,
          accessExpiresAt,
          declinedAt,
        ]
      properties:
        firstName: { type: string }
        lastName: { type: [string, "null"] }
        phone: { type: string }
        payerRole: { type: string, const: requester }
        attestation: { type: string }
        attestedAt: { type: string, format: date-time }
        accessStatus:
          { type: string, enum: [active, revoked, expired, declined] }
        accessSentAt: { type: [string, "null"], format: date-time }
        accessExpiresAt: { type: [string, "null"], format: date-time }
        declinedAt: { type: [string, "null"], format: date-time }
    DriverPassenger:
      type: object
      required: [firstName, bookedForAnother, pickupVerification, note]
      properties:
        firstName: { type: string }
        bookedForAnother: { type: boolean, const: true }
        pickupVerification: { type: string, enum: [pin, first_name] }
        note: { type: string }
    TripAccessView:
      description: "A guest passenger's trip, authenticated ONLY by the X-Trip-Access-Token header. Nothing about the requester, the money or any other trip. driver is the verified-card projection every rider surface uses, present once a driver is committed."
      type: object
      required:
        [
          status,
          statusLabel,
          passenger,
          pickup,
          dropoff,
          driver,
          eta,
          pickupVerification,
          support,
          actions,
          expiresAt,
          asOf,
        ]
      properties:
        status:
          type: string
          enum:
            [
              finding_driver,
              confirming_driver,
              driver_queued,
              driver_on_the_way,
              driver_arrived,
              in_progress,
              completed,
              cancelled,
              declined,
            ]
        statusLabel: { type: string }
        passenger:
          type: object
          required: [firstName]
          properties: { firstName: { type: string } }
        pickup:
          type: object
          required: [label]
          properties: { label: { type: string } }
        dropoff:
          type: object
          required: [label]
          properties: { label: { type: string } }
        driver:
          oneOf:
            - { $ref: "#/components/schemas/OfferDriver" }
            - { type: "null" }
        eta:
          oneOf:
            - type: object
              required: [label, etaSeconds, basis, asOf]
              properties:
                label: { type: string }
                etaSeconds: { type: [integer, "null"] }
                basis: { type: string, enum: [routed_leg, unavailable] }
                asOf: { type: string, format: date-time }
            - { type: "null" }
        pickupVerification:
          type: object
          required: [method, pinAvailable, instructions]
          properties:
            method: { type: string, enum: [pin, first_name] }
            pinAvailable: { type: boolean }
            instructions: { type: string }
        support:
          type: object
          required: [reference, emergencyNumber, note]
          properties:
            reference: { type: string }
            emergencyNumber: { type: [string, "null"] }
            note: { type: string }
        actions:
          type: object
          required: [canDecline, declineIsFree, declineNote]
          properties:
            canDecline: { type: boolean }
            declineIsFree: { type: boolean, const: true }
            declineNote: { type: string }
        expiresAt: { type: string, format: date-time }
        asOf: { type: string, format: date-time }
security: [{ bearer: [] }]
paths:
  /v1/mp/quote:
    get:
      summary: Bounded fare quote envelope (R02)
      description: "Prices the trip/delivery with the deterministic engine, wraps the signed quote with negotiation bounds (floor = max(absolute, cost-based, bps-of-suggested); ceiling = bps-of-suggested). 503 market_not_configured when the city/service/vehicle has no marketplace policy. With `stops` (rides only, behind the deny-by-default marketplace_multi_stop flag) the COMPLETE ordered route pickup → stops → dropoff is routed and priced, expected dwell is priced as route time, and the bounds derive from that full-route price; the market's stop limit (pilot 3), coordinates, dwell bounds and duplicate/adjacent-identical stops are validated (422 validation_failed with details.field). A delivery with stops is 422 validation_failed (deliveries are single-drop); stops while the flag is off are 404 feature_disabled."
      parameters:
        - {
            name: service,
            in: query,
            required: true,
            schema: { type: string, enum: [ride, delivery] },
          }
        - {
            name: vehicleClass,
            in: query,
            required: true,
            schema: { type: string },
          }
        - {
            name: pickupLat,
            in: query,
            required: true,
            schema: { type: number },
          }
        - {
            name: pickupLng,
            in: query,
            required: true,
            schema: { type: number },
          }
        - {
            name: dropoffLat,
            in: query,
            required: true,
            schema: { type: number },
          }
        - {
            name: dropoffLng,
            in: query,
            required: true,
            schema: { type: number },
          }
        - {
            name: weightKg,
            in: query,
            required: false,
            schema: { type: number },
          }
        - {
            name: stops,
            in: query,
            required: false,
            description: 'Ordered intermediate stops as ONE JSON-encoded array (URL-encoded), e.g. [{"lat":6.53,"lng":3.38,"purpose":"errand","dwellSec":120}]. Absent, null or [] is the plain pickup → dropoff route, priced exactly as before.',
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        maxItems: 10,
                        items: { $ref: "#/components/schemas/StopInput" },
                      },
                  },
              },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteEnvelope" }
        "404":
          description: "feature_disabled — stops while marketplace_multi_stop is off here (or the vertical itself is off)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "validation_failed — a stop over the market limit, off-planet, duplicated, identical to its adjacent pickup/dropoff, with an out-of-bounds dwell or unknown purpose, or any stop on a delivery."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests:
    post:
      summary: Publish a request (R03)
      description: "Validates the requested amount against the quote's snapshotted bounds server-side (fare_out_of_bounds with a structured field error otherwise). Requires a live, owned, unconsumed quote. One open request per requester per policy cap. A multi-stop quote publishes its own ordered stops (ids, order, dwell and routeFingerprint) — the body cannot carry stops (unknown keys are refused) — and only while marketplace_multi_stop is on."
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [quoteId, requestedFareMinor, paymentMethodId],
                properties:
                  {
                    quoteId: { type: string },
                    requestedFareMinor: { $ref: "#/components/schemas/Money" },
                    paymentMethodId: { type: string },
                    delivery: { $ref: "#/components/schemas/DeliveryDetails" },
                    preferredDriver:
                      { $ref: "#/components/schemas/PreferredDriverInput" },
                    serviceNeeds:
                      { $ref: "#/components/schemas/ServiceNeedsInput" },
                    passenger: { $ref: "#/components/schemas/PassengerInput" },
                  },
              }
      responses:
        "201":
          description: "With a passenger: the passenger is recorded with the attestation, ONE trip link is issued (stored only as its SHA-256; handed to notification-service once in the trip_access.issued event for the SMS — never in this response) and the view carries `passenger`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "404":
          {
            description: "feature_disabled — preferredDriver needs marketplace_preferred_drivers; serviceNeeds needs marketplace_accessibility_requirements; passenger needs marketplace_guest_bookings (all deny by default).",
          }
        "409":
          {
            description: "conflict with details.reason: service_need_unavailable (a stated requirement has no VERIFIED supply in this market — details.requirements lists each with its reason, details.fallback the options; nothing is published and the quote is not spent) or preferred_driver_unavailable (the saved driver is not taking preferred requests right now; why is not disclosed).",
          }
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}:
    get:
      summary: Owner snapshot (R04) — request plus private offers
      description: "A06 part A: every offer carries its server-computed comparison (total, pickup estimate, vehicle, verified driver card, defined reliability, service fit, reasoned badges). `sort` orders the offers server-side; absent (or `offered`) is the neutral order drivers offered — there is no default winner. An unknown sort is 422 validation_failed."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: sort,
            in: query,
            required: false,
            schema:
              {
                type: string,
                enum: [offered, price, pickup, service_fit],
                default: offered,
              },
          }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [request, offers, seq],
                  properties:
                    {
                      request: { $ref: "#/components/schemas/Request" },
                      offers:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Offer" },
                        },
                      advanceOffers:
                        {
                          type: array,
                          description: "A03: present only on an advance-booking request. Offers on a future pickup window are listed here, never under offers.",
                          items: { $ref: "#/components/schemas/AdvanceOffer" },
                        },
                      award: { $ref: "#/components/schemas/Award" },
                      seq: { type: integer },
                      offerOrder: { $ref: "#/components/schemas/OfferOrder" },
                    },
                }
  /v1/mp/requests/{requestId}/queue:
    get:
      summary: Rider queue projection (R10 / G07) — owner-only, versioned, asOf-stamped
      description: >-
        Composed queue tracker for the requester of an awarded finishing-trip
        job: current claim/job status, promotion state, ETA vs the consented
        window with an asOf freshness stamp, the pickup window and its
        uncertainty, and the rider's permitted actions (cancel, fee-free
        missed-window exit). A foreign rider gets 404 — existence is not leaked.
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueView" }
        "404":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/passenger/access/revoke:
    post:
      summary: Revoke a guest passenger's trip link (A06 part B) — requester only
      description: "Withdraws the live trip link (trip_access.revoked). Idempotent; always allowed — a safety control is never behind a flag. A foreign requester, or a request with no passenger, is 404."
      parameters:
        - { $ref: "#/components/parameters/IdemKey" }
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPassenger" }
        "404":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/passenger/access/reissue:
    post:
      summary: Send the guest passenger a fresh trip link (A06 part B) — requester only
      description: "Revokes the live link and issues a new one to the same passenger (trip_access.revoked + trip_access.issued), while the trip is still ahead and the passenger has not declined. New links are issued only while marketplace_guest_bookings is on (404 feature_disabled otherwise); 409 conflict after a decline, 409 request_closed once the trip ended. Every link is an SMS to the passenger's phone, so one booking sends at most 5 links (the first plus 4 reissues): beyond that 429 rate_limited with details.reason trip_link_limit."
      parameters:
        - { $ref: "#/components/parameters/IdemKey" }
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPassenger" }
        "404":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/trip-access:
    get:
      summary: A guest passenger's trip (A06 part B) — trip-link token only
      description: "Authenticated ONLY by the X-Trip-Access-Token header (never a URL parameter; no gateway identity — one, if present, grants nothing). The token is bound to one trip, expires and is revocable. Rate limited per client and per token (429 before the token is looked up). Answers are Cache-Control: no-store and Referrer-Policy: no-referrer. 401 unauthorized with details.reason invalid (malformed, unknown or forged), expired or revoked — never naming a trip."
      security: [{ tripAccessToken: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripAccessView" }
        "401":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/trip-access/pin:
    get:
      summary: The guest passenger's pickup PIN (A06 part B) — trip-link token only
      description: "The execution ride's pickup PIN while it is relevant (driver assigned/arrived, PIN not yet verified), under the PIN vault's own retrieval rate limit — shared with the requester's retrieval of the same PIN. 409 when not relevant or after a decline."
      security: [{ tripAccessToken: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickupPin" }
        "401":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/trip-access/decline:
    post:
      summary: The guest passenger declines the trip before pickup, free (A06 part B)
      description: "Free for everyone before pickup: an open request closes (closeReason passenger_declined; every live offer's hold released); a queued award is cancelled with the driver's commission returned (linked reversal) and the requester's funding released; an execution not yet at pickup (driver assigned or arrived) ends cancelled_by_rider with feeMinor 0 through the same unwind a driver cancellation uses — commission reversed, funding released, the driver freed. Refused 409 conflict (details.reason past_pickup) once the PIN is being verified or the trip started; 409 award_unresolved while a selection is being confirmed. Publishes trip_access.declined (audience: the requester). Replays byte for byte under the same key."
      security: [{ tripAccessToken: [] }]
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripAccessView" }
        "401":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/pin:
    get:
      summary: Secure pickup-PIN retrieval (G07 companion) — owner-only, lifecycle-restricted, rate-limited
      description: >-
        Returns the pickup PIN for a marketplace execution ride (including one a
        promotion created) over this authenticated channel only. The PIN is
        never in a push payload, event, analytics or log. Owner-only (foreign
        rider → 404); refused with 409 when the ride is not in a PIN-relevant
        state; rate-limited (429).
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickupPin" }
        "404":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/revise:
    post:
      summary: Price- or route-affecting edit — new revision, bids invalidated, holds released
      description: "Open requests only (request_closed otherwise). A replacement quote for the SAME endpoints but a different ordered stop set is the pre-award route edit: the request adopts the quote's stops (a surviving stop keeps its stopId), its bounds come from the quote's full-route price, routeRevision bumps together with revision, and every live bid — pinned to the old revision — is invalidated with its commission hold released exactly once. A stale-revision bid can never be selected afterwards."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [requestedFareMinor, expectedVersion],
                properties:
                  {
                    requestedFareMinor: { $ref: "#/components/schemas/Money" },
                    quoteId:
                      {
                        type: string,
                        description: "Required when route/service details changed — a fresh quote re-snapshots bounds. Must price the same service, class, city, currency, active policy and endpoints; it MAY carry a different stop set (the route edit).",
                      },
                    expectedVersion: { type: integer },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/cancel:
    post:
      summary: Cancel an open request (releases all bid holds)
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
  /v1/mp/requests/{requestId}/select:
    post:
      summary: Select the winner (R05, M05 award saga)
      description: "Authenticated request owner only. Pins requestVersion and bidVersion (version_conflict on stale terms). Runs the award saga: claim request + driver capacity atomically, authorize rider funding for the selected amount, capture the winning commission hold exactly once under the award id, commit execution, resolve losers. Answers 202 with the pending award; the client converges on award.confirmed/failed via events or GET. award_unresolved is returned to a second selection racing a pending award. A bid placed on an earlier request revision (a fare or route edit landed since) answers version_conflict with the refreshed terms (current revision, routeRevision/routeFingerprint for multi-stop requests, and the bid's own requestRevision) and never wins. The execution ride of a multi-stop award carries the request's ordered stops with their stable ids."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [bidId, requestVersion, bidVersion],
                properties:
                  {
                    bidId: { type: string },
                    requestVersion: { type: integer },
                    bidVersion: { type: integer },
                    pickupWindowConsent:
                      {
                        type: object,
                        required: [etaVersion, accepted],
                        description: "Required for finishing-trip (next-slot) winners; etaVersion must match the currently displayed window or the server returns the refreshed window for reconfirmation.",
                        properties:
                          {
                            etaVersion: { type: integer },
                            accepted: { type: boolean, const: true },
                          },
                      },
                  },
              }
      responses:
        "202":
          description: "The award (pending, or already confirmed when the saga completed synchronously). `pickupPin` is present ONLY when this call confirmed a current-slot ride award: it is revealed exactly once to the owner and deliberately absent from idempotent replays."
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [award],
                  properties:
                    {
                      award: { $ref: "#/components/schemas/Award" },
                      pickupPin: { type: string },
                      booking:
                        {
                          $ref: "#/components/schemas/AdvanceBooking",
                          description: "A03: the advance booking an advance selection created — driver reserved, and whether the rider's funding is secured yet (payment_pending beyond the funding horizon). No PIN: the execution starts at activation near pickup.",
                        },
                    },
                }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/award:
    get:
      summary: Award state (poll/converge)
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Award" }
  /v1/mp/requests/{requestId}/trip:
    get:
      summary: The executing trip's committed terms, stops and waiting (A02)
      description: "Requester or awarded driver only (anyone else: not_found). Behind marketplace_rides and marketplace_multi_stop (or marketplace_trip_amendments for a trip without stops). Reads only: waiting figures are computed from the server's timestamps at read time."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "404":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/amendments:
    get:
      summary: Every change proposed on the executing trip, with the committed terms
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmendmentList" }
    post:
      summary: Propose a post-award route change (A02 item 4)
      description: "Requester or awarded driver (a driver only while the server confirms them parked — 403 driver_ineligible otherwise; never an in-motion fare interaction), behind the deny-by-default marketplace_trip_amendments flag (stops also need marketplace_multi_stop); rides only. Priced server-side as a DELTA under the award's pricing snapshot — only distance and time move, base/booking/minimum top-up are never re-charged; the route part is held inside the new route's server bounds. The driver's queued next job is revalidated FIRST (stop-aware remaining time): a change that would break the consented pickup window is refused with 409 conflict details.reason=next_job_conflict and nothing is reserved. For an increase the incremental commission (payment-service /holds/{id}/amendments/{amendmentId}/reserve) and the rider's top-up (/funding/top-up) are reserved BEFORE approvals. One amendment with open money per trip (409 conflict details.reason=amendment_open). The original agreement stays in force until the amendment commits. Replays with the same Idempotency-Key answer the SAME amendment's current view."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [stops, expectedRouteRevision, expectedFareRevision],
                additionalProperties: false,
                properties:
                  {
                    stops:
                      {
                        type: array,
                        description: "The REMAINING intermediate stops after the change, in order; stops already reached are history and stay as they are. A surviving stop keeps its stopId. Bounded by the market's stop limit.",
                        items: { $ref: "#/components/schemas/StopInput" },
                      },
                    dropoff:
                      {
                        type: object,
                        required: [lat, lng],
                        properties:
                          {
                            lat: { type: number },
                            lng: { type: number },
                            label: { type: string, maxLength: 80 },
                          },
                      },
                    expectedRouteRevision: { type: integer },
                    expectedFareRevision: { type: integer },
                  },
              }
      responses:
        "201":
          description: "Priced and funded: awaiting both approvals."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Amendment" }
        "202":
          description: "Recorded; the reservation's outcome is unknown and the sweep converges it (poll the amendment)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Amendment" }
        "403":
          description: "driver_ineligible: the proposing driver is not confirmed parked (details.reason, e.g. NOT_STATIONARY)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "version_conflict (stale expected revisions, refreshedTerms), conflict (next_job_conflict, amendment_open)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "insufficient_spendable (driver cannot cover the incremental commission) or insufficient_funds (rider cannot cover the top-up): the proposal is rejected with nothing held; validation_failed for a proposal that changes nothing or breaks the stop limits."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/amendments/{amendmentId}:
    get:
      summary: One amendment (poll/converge)
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: amendmentId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Amendment" }
  /v1/mp/requests/{requestId}/amendments/{amendmentId}/approve:
    post:
      summary: Approve the exact terms (A02 item 4)
      description: "Binds to (amendment id, route revision, fare revision). The driver's approval is accepted only while the server confirms them stationary and parked (403 driver_ineligible details.reason=NOT_STATIONARY) — never an in-motion control. The second approval runs the commit saga: revalidate (trip running, reached stops unchanged, next job still honoured — else rejected with next_job_conflict and everything released), then rider top-up commit + commission increment capture (an increase) or commission refund + rider partial release (a decrease), each idempotent on the amendment id and recorded durably, then the committed terms, stops and execution ride are rewritten in one transaction (ride.terms_amended). A refusal part-way fails the amendment and compensates with linked adjustments; an unknown outcome parks it for the sweep."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: amendmentId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmendmentDecision" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Amendment" }
        "403":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/amendments/{amendmentId}/reject:
    post:
      summary: Reject a proposed change (no standing penalty)
      description: "Either party, until both approved; a driver only while the server confirms them parked (403 driver_ineligible otherwise — an unanswered proposal simply expires). Releases the commission increment and the rider's top-up (idempotent; the sweep retries an unconfirmed release). A driver's rejection carries NO standing or acceptance penalty."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: amendmentId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmendmentDecision" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Amendment" }
  /v1/mp/requests/{requestId}/terminate:
    post:
      summary: Safe early end of the journey (partial trip)
      description: "Behind marketplace_trip_amendments. Rider (any reason) or driver (parked, reason one of excessive_waiting, rider_request, safety_concern, vehicle_issue). Ends the trip at the vehicle's current position: stops never reached are skipped, the stop being waited at closes with its earned waiting, and the fare drops by the unvisited remainder priced under the award's snapshot (never below the travelled route's server floor) — ONE early_termination adjustment through the same linked path (partial commission refund, partial funding release). The driver then completes the ride; completion settles exactly the committed fare."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [expectedFareRevision],
                properties:
                  {
                    reason: { type: string, maxLength: 80 },
                    expectedFareRevision: { type: integer },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "202":
          description: "The adjustment's money outcome is unknown; the sweep converges it."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
  /v1/mp/requests/{requestId}/stops/{stopId}/arrive:
    post:
      summary: Driver arrival at a stop (server-authoritative)
      description: "Awarded driver only, passenger aboard, stops in order (one at a time). Geofenced against the driver's last ACCEPTED position with the fix's GPS accuracy as tolerance (up to the market's accuracy ceiling) and a freshness bound; outside it answers 422 not_at_pickup details.reason=not_at_stop|position_stale|position_inaccurate with the server's evidence. `disputed: true` records the arrival anyway as DISPUTED (mp.stop.arrival_disputed) — it never starts paid waiting; a later arrival from inside the fence confirms it and starts the clock then. Emits mp.stop.arrived and mp.stop.waiting_started."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { name: stopId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              { type: object, properties: { disputed: { type: boolean } } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/requests/{requestId}/stops/{stopId}/depart:
    post:
      summary: Driver departure from a stop — finalises its waiting
      description: "Awarded driver only. The waiting fee is computed once from server timestamps (confirmed arrival → departure), capped at the rider's authorized cap, and settled as ONE stop_waiting adjustment through the amendment money path (commission increment captured once, rider top-up committed, agreed fare raised). Waiting milestones up to departure (allowance consumed, paid waiting accruing, approval required, excessive) are published once each, stamped when they happened."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { name: stopId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdemKey" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
  /v1/mp/requests/{requestId}/stops/{stopId}/skip:
    post:
      summary: Skip a stop
      description: "The rider may drop any stop not yet left; the driver may leave a stop only once its waiting is excessive (409 conflict details.reason=waiting_not_excessive otherwise). Skipping never lowers the agreed fare; waiting already earned settles."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { name: stopId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              {
                type: object,
                properties: { reason: { type: string, maxLength: 80 } },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
  /v1/mp/requests/{requestId}/stops/{stopId}/waiting-approval:
    post:
      summary: Rider approval to keep paying for waiting beyond the agreed cap
      description: "Rider only, while the driver waits at the stop. Extends the authorized cap by one more increment of the published maximum, bound to the cap revision the rider saw (stale: version_conflict with the refreshed cap). Without it nothing accrues past the cap."
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - { name: stopId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdemKey" }
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required: [capRevision],
                properties: { capRevision: { type: integer } },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
  /v1/mp/feed:
    get:
      summary: Paginated eligible open-request feed (D01)
      description: "All requests the driver is eligible to discover in their current envelope. Receiving the feed never reserves the driver or removes availability. Every card carries the A04.1 earnings breakdown; the driver's saved preferences (A04.2) hide what they do not want and rank homeward requests first within the page — a filter on discovery, never on eligibility."
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - {
            name: preferences,
            in: query,
            required: false,
            description: "apply (default) or ignore — ignore shows the whole envelope, unfiltered and unranked by preferences.",
            schema: { type: string, enum: [apply, ignore] },
          }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [items, availabilityEpoch],
                  properties:
                    {
                      items:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/FeedItem" },
                        },
                      nextCursor: { type: string },
                      availabilityEpoch: { type: integer },
                      preferences:
                        { $ref: "#/components/schemas/FeedPreferences" },
                    },
                }
  /v1/mp/requests/{requestId}/driver-view:
    get:
      summary: Driver detail — privacy-limited request, presets, eligibility, own bid (D02/D03/D10)
      parameters:
        - {
            name: requestId,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [item, eligibility, presets],
                  properties:
                    {
                      item: { $ref: "#/components/schemas/FeedItem" },
                      eligibility: { $ref: "#/components/schemas/Eligibility" },
                      presets:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Preset" },
                        },
                      profileLine: { type: string },
                      ceilingNotice: { type: string },
                      preferenceNotice:
                        {
                          type: string,
                          description: "A04.2: a preference this request cannot meet (e.g. the minimum trip amount is above its maximum).",
                        },
                      myBid: { $ref: "#/components/schemas/Bid" },
                      currentClaimId:
                        {
                          type: string,
                          description: "The driver's current work claim id — the mandatory dependsOnClaimId for a next-slot bid. Null unless a current claim exists.",
                        },
                      advanceCommitment:
                        {
                          $ref: "#/components/schemas/AdvanceCommitment",
                          description: "A03: on an advance-booking request, what bidding commits the driver's wallet to — explained BEFORE the bid.",
                        },
                      preferredRequest:
                        {
                          $ref: "#/components/schemas/PreferredInvitation",
                          description: "A04 item 3: a rider asked this driver first — offer through the ordinary presets, or decline for free. While the window is exclusive every other driver gets 404 here.",
                        },
                    },
                }
  /v1/mp/driver/parked:
    post:
      summary: Explicit safely-parked attestation (driver)
      description: "Records the attestation the stationary gate combines with telemetry (it can never override clearly moving samples). The response is the state the SERVER acknowledges; the client adopts it rather than assuming."
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required:
                    [
                      state,
                      availabilityEpoch,
                      confirmedAt,
                      expiresAt,
                      ttlSeconds,
                    ],
                  properties:
                    {
                      state:
                        {
                          type: string,
                          enum: [parked_confirmed, moving, stale_location],
                        },
                      availabilityEpoch: { type: integer },
                      confirmedAt: { type: string, format: date-time },
                      expiresAt: { type: string, format: date-time },
                      ttlSeconds: { type: integer },
                    },
                }
  /v1/mp/driver/jobs:
    get:
      summary: Driver claims projection (D05 winner card + D11 current-plus-next timeline)
      responses:
        "200":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [promotion],
                  properties:
                    {
                      current: { $ref: "#/components/schemas/DriverJob" },
                      next: { $ref: "#/components/schemas/DriverJob" },
                      promotion:
                        {
                          type: string,
                          enum: [none, pending, failed_revalidating],
                        },
                    },
                }
  /v1/mp/driver/preferences:
    get:
      summary: Driver preferences in the caller's city (A04.2)
      description: "Version 0 with permissive defaults when the driver never saved any. bounds are derived from the market's policy (widest envelope, stop limit, rate-profile ceilings)."
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPreferences" }
    patch:
      summary: Save a new preferences version (idempotent, versioned)
      description: "Appends version expectedVersion + 1 (a stale expectedVersion or a concurrent writer answers 409 version_conflict with details.currentVersion). Absent fields are unchanged; null clears a nullable field; unknown keys are refused. A PATCH that changes nothing writes nothing. Writes one outbox event (mp.driver_preferences.saved, no homeward coordinates) and one audit row in the same transaction. Saving never touches a bid, hold, award or eligibility, and preferences never place a bid."
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                additionalProperties: false,
                required: [expectedVersion],
                properties:
                  {
                    expectedVersion: { type: integer, minimum: 0 },
                    minimumTripAmountMinor:
                      {
                        oneOf:
                          [
                            { $ref: "#/components/schemas/Money" },
                            { type: "null" },
                          ],
                      },
                    maxPickupDistanceMeters: { type: [integer, "null"] },
                    acceptsDeliveries: { type: boolean },
                    acceptsStops: { type: boolean },
                    maxStops: { type: [integer, "null"] },
                    homeward:
                      {
                        oneOf:
                          [
                            {
                              type: object,
                              additionalProperties: false,
                              required: [lat, lng, radiusMeters],
                              properties:
                                {
                                  lat: { type: number },
                                  lng: { type: number },
                                  radiusMeters: { type: integer },
                                  label: { type: string, maxLength: 40 },
                                },
                            },
                            { type: "null" },
                          ],
                      },
                    homewardOnly: { type: boolean },
                    availabilityWindows:
                      {
                        type: array,
                        maxItems: 28,
                        items:
                          { $ref: "#/components/schemas/AvailabilityWindow" },
                      },
                    acceptsPreferredRequests:
                      {
                        type: boolean,
                        description: "A04 item 3: opt in to (or out of) preferred requests. Turning it on needs marketplace_preferred_drivers (404 feature_disabled otherwise); turning it off never does.",
                      },
                  },
              }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPreferences" }
        "409":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/bids:
    post:
      summary: Submit a funded bid (D02 → D03)
      description: "Server revalidates eligibility and bounds, then reserves the 10% commission against cleared spendable funds through payment-service BEFORE the bid becomes live (insufficient_spendable with the exact shortfall otherwise). Slot intent (current|next) and the dependency claim are recorded at creation and never silently changed."
      parameters: [{ $ref: "#/components/parameters/IdemKey" }]
      requestBody:
        content:
          application/json:
            schema:
              {
                type: object,
                required:
                  [
                    requestId,
                    requestRevision,
                    amountMinor,
                    slot,
                    availabilityEpoch,
                  ],
                properties:
                  {
                    requestId: { type: string },
                    requestRevision: { type: integer },
                    amountMinor: { $ref: "#/components/schemas/Money" },
                    slot:
                      {
                        type: string,
                        enum: [current, next, advance],
                        description: "`advance` only on an advance-booking request (A03): the offer is for its future pickup window; the 10% is held now and captured once if selected.",
                      },
                    dependsOnClaimId: { type: string },
                    availabilityEpoch: { type: integer },
                    rateProfileVersion: { type: integer },
                  },
              }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bid" }
        "422":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/mp/bids/{bidId}/revise:
    post:
      summary: Revise a live bid (raise re-reserves the delta first; lower releases it)
