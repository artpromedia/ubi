# Vendored from the design handoff, with one repair.
#
# The handoff copy of this document declared `components:` TWICE at the top
# level. YAML has no merge semantics for duplicate keys -- the later mapping
# simply replaces the earlier one -- so the first block was silently discarded,
# taking `securitySchemes`, the required `Idempotency-Key` parameter and the
# shared `Money`/`Error` schemas with it. Every `$ref` to them dangled, and the
# API declared no authentication at all.
#
# The two blocks are merged here into one. No content was changed, added or
# removed; the file is re-emitted in block style, so it no longer matches the
# handoff byte for byte.
openapi: 3.1.0
info:
  title: UBI Flights (One-Ticket)
  version: 0.1.0
  description:
    Search, book, watch, switch and refund partner-airline flights. Money is integer minor
    units (kobo) with explicit currency from city config. All mutating POSTs accept Idempotency-Key.
servers:
  - url: https://api.ubi.africa
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    IdemKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
  schemas:
    Money:
      type: object
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          type: integer
        currency:
          type: string
          example: NGN
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
    Offer:
      type: object
      properties:
        offerId:
          type: string
        airline:
          type: string
        flightNo:
          type: string
          example: P4 7120
        depart:
          type: string
          format: date-time
        arrive:
          type: string
          format: date-time
        fromTerminal:
          type: string
          example: MMA2
        fare:
          $ref: "#/components/schemas/Money"
        seatsLeft:
          type: integer
        oneTicketEligible:
          type: boolean
    Passenger:
      type: object
      required:
        - nameAsOnId
        - idType
        - idRef
      properties:
        nameAsOnId:
          type: string
        idType:
          type: string
          enum:
            - nin
            - passport
        idRef:
          type: string
        phone:
          type: string
    Booking:
      type: object
      properties:
        bookingId:
          type: string
        pnr:
          type: string
        status:
          type: string
          enum:
            - ticketed
            - watching
            - checked_in
            - flown
            - cancelled_by_airline
            - oneticket_active
            - switched
            - refunded
        protection:
          type: object
          properties:
            covered:
              type: boolean
            activatedAt:
              type: string
              format: date-time
            coveredMinor:
              type: integer
        flight:
          $ref: "#/components/schemas/Offer"
        journeyId:
          type: string
    Alternative:
      type: object
      properties:
        offerId:
          type: string
        flight:
          $ref: "#/components/schemas/Offer"
        sameTerminal:
          type: boolean
        terminalTransferRide:
          type: object
          properties:
            free:
              type: boolean
            minutes:
              type: integer
        travellerPrice:
          $ref: "#/components/schemas/Money"
        listPrice:
          $ref: "#/components/schemas/Money"
security:
  - bearer: []
paths:
  /v1/flights/search:
    get:
      parameters:
        - name: from
          in: query
          schema:
            type: string
            example: LOS
        - name: to
          in: query
          schema:
            type: string
            example: ABV
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: pax
          in: query
          schema:
            type: integer
            default: 1
        - name: oneTicketOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Offer"
  /v1/flights/offers/{offerId}/hold:
    post:
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: price held 10 min
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdId:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  fare:
                    $ref: "#/components/schemas/Money"
  /v1/flights/bookings:
    post:
      parameters:
        - $ref: "#/components/parameters/IdemKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - holdId
                - passenger
                - paymentMethodId
              properties:
                holdId:
                  type: string
                passenger:
                  $ref: "#/components/schemas/Passenger"
                paymentMethodId:
                  type: string
                journeyId:
                  type: string
      responses:
        "201":
          description: ticketed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: price changed → re-offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/flights/bookings/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /v1/flights/bookings/{id}/alternatives:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "ranked: same terminal, seats left, time; travellerPrice is 0 when protection active"
          content:
            application/json:
              schema:
                type: object
                properties:
                  protectionActive:
                    type: boolean
                  alternatives:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alternative"
                  fallbacks:
                    type: array
                    items:
                      type: string
                      enum:
                        - next_day_free
                        - refund_to_wallet
  /v1/flights/bookings/{id}/switch:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdemKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - offerId
              properties:
                offerId:
                  type: string
                actor:
                  type: string
                  enum:
                    - traveller
                    - desk_agent
      responses:
        "200":
          description: seat held at airline first; new PNR; coverage ledgered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: seat lost → try next alternative
  /v1/flights/bookings/{id}/refund:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: refund to wallet (protection or airline cause)
  /v1/desk/scan:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                qr:
                  type: string
      responses:
        "200":
          description: traveller record scoped to this booking
  /v1/flights/disruptions:
    get:
      responses:
        "200":
          description: "ops: per-flight protected/switched/choosing/help, seats left, exposure, reclaims"
