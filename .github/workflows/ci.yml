# UBI Monorepo CI Pipeline
# Runs on all pull requests and pushes to main
# Uses affected-based execution to only test/build changed packages

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  NODE_VERSION: "20"

jobs:
  # ===========================================
  # SETUP & LINT
  # ===========================================
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get affected packages
        id: affected
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            AFFECTED=$(pnpm turbo run build --filter='...[origin/${{ github.base_ref }}]' --dry-run=json | jq -c '.packages')
          else
            AFFECTED=$(pnpm turbo run build --dry-run=json | jq -c '.packages')
          fi
          echo "packages=$AFFECTED" >> $GITHUB_OUTPUT

  lint:
    name: Lint & Format
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        # Bounded concurrency: ten parallel eslint processes exhaust the
        # runner's memory and take the whole job down as "cancelled".
        run: pnpm exec turbo run lint --affected --concurrency=4

  typecheck:
    name: TypeScript Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        # Bounded concurrency: parallel tsc processes are memory-hungry too.
        run: pnpm exec turbo run typecheck --affected --concurrency=4

  # ===========================================
  # BUILD
  # ===========================================
  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build affected packages
        # Next.js builds spawn their own worker pools; more than two at once
        # exhausts the runner's memory.
        run: pnpm exec turbo run build --affected --concurrency=2

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/.next
            packages/*/dist
            services/*/dist
          retention-days: 1
          # `turbo run build --affected` builds nothing on a push that touches
          # only non-JS files (terraform, docs, workflows), so no dist/.next is
          # produced and there is nothing to upload. Without this, v4 both warns
          # AND — because no files matched — the `test` job's download below
          # fails with "Artifact not found". `ignore` makes an empty upload a
          # clean no-op; the download step tolerates the missing artifact.
          if-no-files-found: ignore

  # ===========================================
  # TEST
  # ===========================================
  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        # Priming dist/.next from the build job is only an optimization: the
        # `test` turbo task `dependsOn: ["^build"]`, so `turbo run test` builds
        # any missing upstream package itself. When the build job produced no
        # artifact (an --affected build with no JS changes — see its upload
        # step), download-artifact@v4 errors with "Artifact not found"; tolerate
        # that so a terraform/docs/workflow-only push does not fail Unit Tests.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-artifacts

      - name: Run tests
        # Hermetic unit suites only: packages/* and apps/* run with nothing but
        # node. Suites that need real infrastructure run where it is
        # provisioned instead — the Node services and @ubi/outbox
        # (Postgres/Redis) in the Testing Pipeline (test.yml), the Go services
        # in this workflow's go-build jobs. @ubi/contract-testing's pact
        # provider verification needs running providers and has no CI home yet.
        # (--affected cannot be combined with --filter, and this scope is
        # small and fast, so it simply always runs.)
        run: >-
          pnpm exec turbo run test --concurrency=4
          --filter='./packages/*' --filter='./apps/*'
          --filter='!@ubi/outbox' --filter='!@ubi/config-client'
          --filter='!@ubi/contract-testing'

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # ===========================================
  # GO SERVICES
  # ===========================================
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run golangci-lint (ride-service)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/ride-service

      - name: Run golangci-lint (delivery-service)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/delivery-service

  go-build:
    name: Go Build
    needs: go-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ride-service, delivery-service, location-service]
    # ride-service's test harness runs against live Postgres (PostGIS) + Redis
    # and expects the prisma-managed public tables (cities, feature_flags, ...),
    # so the job provisions both and applies the migrations before testing.
    # delivery-service and location-service don't touch them, but one uniform
    # job is simpler and the idle services are harmless.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubi
          POSTGRES_PASSWORD: ubi_dev_password
          POSTGRES_DB: ubi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubi -d ubi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: DATABASE_URL=postgresql://ubi:ubi_dev_password@localhost:5432/ubi_test pnpm --filter @ubi/database exec prisma migrate deploy

      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          go mod download
          go build -v -o bin/server ./cmd/server

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          RIDE_TEST_DATABASE_URL: postgres://ubi:ubi_dev_password@localhost:5432/ubi_test?sslmode=disable
          RIDE_TEST_REDIS_URL: redis://localhost:6379/1
        run: go test -v -race -coverprofile=coverage.out ./...

  # ===========================================
  # DATABASE
  # ===========================================
  db-check:
    name: Database Schema & Migration Chain
    needs: setup
    runs-on: ubuntu-latest
    # A schema that validates is not the same as a migration chain that runs.
    # This job provisions an EMPTY database from the migrations, which is the
    # Phase 0 database exit gate, and then checks the chain has not drifted
    # from the schema.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubi
          POSTGRES_PASSWORD: ubi_ci_password
          POSTGRES_DB: ubi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubi -d ubi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ubi:ubi_ci_password@localhost:5432/ubi_ci
      SHADOW_DATABASE_URL: postgresql://ubi:ubi_ci_password@localhost:5432/ubi_ci_shadow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @ubi/database exec prisma validate

      - name: Provision an empty database from the migration chain
        run: pnpm --filter @ubi/database exec prisma migrate deploy

      - name: Confirm migrations are idempotent (deploy.sh runs this on every deploy)
        # infrastructure/hetzner/scripts/deploy.sh invokes `prisma migrate
        # deploy` on every `deploy`/`migrate` call, whether or not there are
        # new migrations to apply that day. Re-running it here against the
        # database `migrate deploy` just provisioned proves that a second,
        # no-op invocation exits 0 instead of erroring (stale checksum,
        # broken migration-history bookkeeping, etc.) — the exact operation
        # the Hetzner pilot's deploy runbook depends on being safe to repeat.
        run: pnpm --filter @ubi/database exec prisma migrate deploy

      - name: Create the shadow database
        # migrate diff replays the chain into an EXISTING shadow database; the
        # service container only provisions ubi_ci.
        run: |
          PGPASSWORD=ubi_ci_password psql -h localhost -U ubi -d ubi_ci \
            -c 'CREATE DATABASE ubi_ci_shadow'

      - name: Fail on schema drift
        # migrate diff between what the migrations produce and what the schema
        # declares must be empty; --exit-code makes a non-empty diff fail.
        run: |
          pnpm --filter @ubi/database exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Generate Prisma client
        run: pnpm --filter @ubi/database exec prisma generate

      - name: Assert the ledger invariant is enforced by the database
        # The double-entry rule is a deferred constraint trigger, not an
        # application convention. If this ever stops failing, the ledger has
        # silently become unguarded.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO wallets (id, owner_type, owner_id, currency, tier, version, created_at, updated_at)
            VALUES ('ci_w','user','ci_user','NGN','tier1',1,now(),now());"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
                BEGIN;
                INSERT INTO journal_entries (id, kind, reference, occurred_at, created_at)
                VALUES ('ci_je','test','ci', now(), now());
                INSERT INTO journal_lines (id, entry_id, account, wallet_id, amount_minor, currency, created_at)
                VALUES ('ci_jl','ci_je','wallet','ci_w',-100,'NGN',now());
                COMMIT;"; then
            echo "FAIL: an unbalanced journal entry was committed"
            exit 1
          fi
          echo "OK: unbalanced journal entry refused by the database"

  contracts:
    name: Contract Validation
    needs: setup
    runs-on: ubuntu-latest
    # Guards the two contract failures that are invisible on reading: a
    # duplicate top-level YAML key (which silently discards the earlier block)
    # and a $ref that does not resolve.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI documents and state machines
        run: node tooling/scripts/validate-contracts.mjs

      - name: Assert the generated state machines match the contract
        # codegen must be a no-op on a clean tree; if it is not, the committed
        # code has drifted from contracts/state-machines.json.
        run: |
          pnpm --filter @ubi/contracts codegen
          git diff --exit-code packages/contracts/src/state-machines/machines.generated.ts

  # ===========================================
  # MOBILE (FLUTTER)
  # ===========================================
  rn-mobile:
    name: RN Mobile (typecheck + jest)
    needs: setup
    runs-on: ubuntu-latest
    # Owner instruction (docs/launch-readiness/handoff-rn/CLAUDE.md rule 13): the
    # delivery targets are the React Native apps apps/rider-mobile and
    # apps/driver-mobile. This job is the JS/TS gate that CAN run on ubuntu:
    # tsc for both apps and the shared mobile packages, and jest for both apps
    # (native modules are mocked). It is REAL and fails on error — no
    # continue-on-error. The native iOS/Android build + device E2E gate lives in
    # rn-native.yml and requires macOS/Android runners (see FLUTTER_TO_RN_CUTOVER).
    #
    # Flutter under mobile/ is a FROZEN behavioural reference until RN acceptance
    # and is no longer analysed here.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts (RN apps depend on @ubi/contracts dist)
        run: pnpm --filter @ubi/contracts build

      - name: Typecheck shared mobile packages
        run: |
          pnpm --filter @ubi/mobile-tokens exec tsc --noEmit
          pnpm --filter @ubi/mobile-ui exec tsc --noEmit
          pnpm --filter @ubi/mobile-core exec tsc --noEmit

      - name: Typecheck RN apps
        run: |
          pnpm --filter @ubi/rider-mobile exec tsc --noEmit
          pnpm --filter @ubi/driver-mobile exec tsc --noEmit

      - name: Jest (rider + driver)
        run: |
          pnpm --filter @ubi/rider-mobile exec jest
          pnpm --filter @ubi/driver-mobile exec jest

  # ===========================================
  # MARKETING SITE E2E (Playwright)
  # ===========================================
  marketing-e2e:
    name: Marketing E2E (Playwright)
    needs: setup
    runs-on: ubuntu-latest
    # Required: the production build of apps/marketing-site against mocked
    # config-service and user-service, every state in the handoff's
    # ACCEPTANCE.md at 1440 and 390, axe on every route. No continue-on-error.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the marketing site's workspace dependencies
        run: pnpm turbo run build --filter=@ubi/marketing-site^...

      - name: Install Playwright Chromium
        run: pnpm --filter @ubi/marketing-site exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm --filter @ubi/marketing-site test

      - name: Build and run the E2E suite
        run: pnpm --filter @ubi/marketing-site test:e2e

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-e2e
          path: |
            apps/marketing-site/e2e-report
            apps/marketing-site/e2e-results
            apps/marketing-site/e2e/screenshots
          retention-days: 7

  ci-success:
    name: CI Success
    needs:
      [build, test, go-build, db-check, contracts, rn-mobile, marketing-e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        # rn-mobile was already listed above in `needs` (so this job waited
        # for it) but was never checked here — a failing rn-mobile could not
        # fail ci-success. Fixed this pass; rn-mobile currently always
        # succeeds (37/37 + 71/71 jest, tsc 0), so this changes no behaviour
        # today and only starts mattering if it ever regresses.
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.go-build.result }}" != "success" ] || \
             [ "${{ needs.db-check.result }}" != "success" ] || \
             [ "${{ needs.contracts.result }}" != "success" ] || \
             [ "${{ needs.rn-mobile.result }}" != "success" ] || \
             [ "${{ needs.marketing-e2e.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
