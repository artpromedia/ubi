# UBI Monorepo CI Pipeline
# Runs on all pull requests and pushes to main
# Uses affected-based execution to only test/build changed packages

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ===========================================
  # SETUP & LINT
  # ===========================================
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get affected packages
        id: affected
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            AFFECTED=$(pnpm turbo run build --filter='...[origin/${{ github.base_ref }}]' --dry-run=json | jq -c '.packages')
          else
            AFFECTED=$(pnpm turbo run build --dry-run=json | jq -c '.packages')
          fi
          echo "packages=$AFFECTED" >> $GITHUB_OUTPUT

  lint:
    name: Lint & Format
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint:affected

  typecheck:
    name: TypeScript Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm typecheck:affected

  # ===========================================
  # BUILD
  # ===========================================
  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build affected packages
        run: pnpm build:affected

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/.next
            packages/*/dist
            services/*/dist
          retention-days: 1

  # ===========================================
  # TEST
  # ===========================================
  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Run tests
        run: pnpm test:affected

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # ===========================================
  # GO SERVICES
  # ===========================================
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run golangci-lint (ride-service)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/ride-service

      - name: Run golangci-lint (delivery-service)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/delivery-service

  go-build:
    name: Go Build
    needs: go-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ride-service, delivery-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          go mod download
          go build -v -o bin/server ./cmd/server

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: go test -v -race -coverprofile=coverage.out ./...

  # ===========================================
  # DATABASE
  # ===========================================
  db-check:
    name: Database Schema & Migration Chain
    needs: setup
    runs-on: ubuntu-latest
    # A schema that validates is not the same as a migration chain that runs.
    # This job provisions an EMPTY database from the migrations, which is the
    # Phase 0 database exit gate, and then checks the chain has not drifted
    # from the schema.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubi
          POSTGRES_PASSWORD: ubi_ci_password
          POSTGRES_DB: ubi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubi -d ubi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ubi:ubi_ci_password@localhost:5432/ubi_ci
      SHADOW_DATABASE_URL: postgresql://ubi:ubi_ci_password@localhost:5432/ubi_ci_shadow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @ubi/database exec prisma validate

      - name: Provision an empty database from the migration chain
        run: pnpm --filter @ubi/database exec prisma migrate deploy

      - name: Fail on schema drift
        # migrate diff between what the migrations produce and what the schema
        # declares must be empty; --exit-code makes a non-empty diff fail.
        run: |
          pnpm --filter @ubi/database exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Generate Prisma client
        run: pnpm --filter @ubi/database exec prisma generate

      - name: Assert the ledger invariant is enforced by the database
        # The double-entry rule is a deferred constraint trigger, not an
        # application convention. If this ever stops failing, the ledger has
        # silently become unguarded.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO wallets (id, owner_type, owner_id, currency, tier, version, created_at, updated_at)
            VALUES ('ci_w','user','ci_user','NGN','tier1',1,now(),now());"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
                BEGIN;
                INSERT INTO journal_entries (id, kind, reference, occurred_at, created_at)
                VALUES ('ci_je','test','ci', now(), now());
                INSERT INTO journal_lines (id, entry_id, account, wallet_id, amount_minor, currency, created_at)
                VALUES ('ci_jl','ci_je','wallet','ci_w',-100,'NGN',now());
                COMMIT;"; then
            echo "FAIL: an unbalanced journal entry was committed"
            exit 1
          fi
          echo "OK: unbalanced journal entry refused by the database"

  contracts:
    name: Contract Validation
    needs: setup
    runs-on: ubuntu-latest
    # Guards the two contract failures that are invisible on reading: a
    # duplicate top-level YAML key (which silently discards the earlier block)
    # and a $ref that does not resolve.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI documents and state machines
        run: node tooling/scripts/validate-contracts.mjs

      - name: Assert the generated state machines match the contract
        # codegen must be a no-op on a clean tree; if it is not, the committed
        # code has drifted from contracts/state-machines.json.
        run: |
          pnpm --filter @ubi/contracts codegen
          git diff --exit-code packages/contracts/src/state-machines/machines.generated.ts

  # ===========================================
  # MOBILE (FLUTTER)
  # ===========================================
  mobile:
    name: Flutter Analyze & Test
    needs: setup
    runs-on: ubuntu-latest
    # The audit found CI does not build or test either Flutter app, so nothing
    # in mobile/ has ever been gated. This job analyses and tests both apps and
    # the shared Dart packages.
    #
    # continue-on-error is set ONLY for the initial adoption: mobile/ has known
    # analysis failures today (rider_app dependency injection, repository and
    # use-case signature mismatches). Remove it — and add `mobile` to
    # ci-success below — as soon as the baseline is clean, otherwise this job
    # reports green while proving nothing.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Resolve dependencies
        working-directory: mobile
        run: |
          for pkg in packages/* apps/*; do
            if [ -f "$pkg/pubspec.yaml" ]; then
              echo "::group::pub get $pkg"
              (cd "$pkg" && flutter pub get)
              echo "::endgroup::"
            fi
          done

      - name: Analyze
        working-directory: mobile
        run: |
          status=0
          for pkg in packages/* apps/*; do
            if [ -f "$pkg/pubspec.yaml" ]; then
              echo "::group::analyze $pkg"
              (cd "$pkg" && flutter analyze) || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

      - name: Test
        working-directory: mobile
        run: |
          status=0
          for pkg in packages/* apps/*; do
            if [ -d "$pkg/test" ]; then
              echo "::group::test $pkg"
              (cd "$pkg" && flutter test) || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

  # ===========================================
  # FINAL STATUS CHECK
  # ===========================================
  ci-success:
    name: CI Success
    needs: [build, test, go-build, db-check, contracts]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.go-build.result }}" != "success" ] || \
             [ "${{ needs.db-check.result }}" != "success" ] || \
             [ "${{ needs.contracts.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
