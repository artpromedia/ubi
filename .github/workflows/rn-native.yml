# React Native native build + device E2E gate.
#
# This is the acceptance evidence the RN migration owner requires (handoff
# rule 30): real iOS + Android builds of BOTH apps, plus device E2E. It is
# SEPARATE from ci.yml and NOT part of the ci-success merge gate: nothing in
# this file is (or should be made) a required branch-protection check, and no
# job here is allowed to report success as evidence of a device build when it
# did not actually produce one.
#
# Two external prerequisites are NOT met in this repository today, so the
# real native builds and device E2E cannot run here — see
# docs/ops/NATIVE_RELEASE.md for the exact, checkable list of what's missing:
#
#   1. Neither apps/rider-mobile nor apps/driver-mobile has an android/ or
#      ios/ native project directory yet. These are plain React Native CLI
#      apps (react-native ^0.79 — there is no app.config.*, no `expo`
#      dependency, so this is NOT an Expo project). The previous version of
#      this file generated missing native dirs with `npx expo prebuild`,
#      which does not apply here and would not have worked. The correct
#      scaffold command is documented in NATIVE_RELEASE.md and is
#      deliberately NOT run automatically in CI — it needs the real store
#      bundle id / applicationId from the App Store Connect / Play consoles,
#      which must never be invented here.
#   2. Signing: bundle id / applicationId / provisioning must equal the
#      existing Flutter app's (taken from the store consoles), and the actual
#      keystore / distribution certificate must be supplied as CI secrets —
#      never generated or hardcoded in this file.
#
# What this file DOES do, unconditionally and for real:
#   - `rn-verify`: install, build @ubi/contracts, typecheck the shared mobile
#     packages + both apps, run both apps' jest suites, and lint both apps.
#     None of this needs a native project. Every command below was
#     reproduced locally before this file was landed (docs/ops/CI_EVIDENCE.md
#     records the exact output: rider 37/37 jest, driver 71/71 jest, lint
#     0 errors on both). This deliberately overlaps ci.yml's `rn-mobile` job
#     (the required merge-gate check) — this job additionally runs lint, and
#     exists so the release lane's JS evidence lives alongside the
#     (currently inert) native build jobs below, in the file the RN handoff
#     names as the native/device gate.
#   - `rn-android` / `rn-ios` / `rn-e2e`: run on every trigger, but each real
#     build step is gated on the native project directory AND the relevant
#     signing/runner secrets actually being present. When either is missing
#     the job prints exactly what is missing and SUCCEEDS — that is a report
#     of "not attempted", never a fabricated "device build passed", and this
#     workflow is not wired into any required check, so that success cannot
#     be mistaken for device coverage on a PR.
name: RN Native

on:
  workflow_dispatch: {}
  pull_request:
    branches: [master, main, develop]
    paths:
      - "apps/rider-mobile/**"
      - "apps/driver-mobile/**"
      - "packages/mobile-core/**"
      - "packages/mobile-ui/**"
      - "packages/mobile-tokens/**"
      - "packages/contracts/**"
      - ".github/workflows/rn-native.yml"
  push:
    branches: [master, main, develop]
    paths:
      - "apps/rider-mobile/**"
      - "apps/driver-mobile/**"
      - "packages/mobile-core/**"
      - "packages/mobile-ui/**"
      - "packages/mobile-tokens/**"
      - "packages/contracts/**"
      - ".github/workflows/rn-native.yml"

env:
  NODE_VERSION: "20"

jobs:
  # ===========================================================================
  # GATE: decide, on a cheap ubuntu runner, whether the real native jobs have
  # their prerequisites. Secrets cannot be read in a job-level `if:`, so this
  # job reads them and exposes plain "true"/"false" outputs the native jobs
  # gate on. The effect: with no native projects / signing secrets (the state
  # today) the native jobs are SKIPPED entirely — no macOS runner is ever
  # allocated (rn-ios would otherwise burn 10x-cost minutes, or fail to start
  # on an account with no macOS entitlement, just to print "skipped"). A
  # skipped job is not a failure, so the workflow stays green on rn-verify
  # alone, and no success is ever reported as device coverage.
  # ===========================================================================
  gate:
    name: Native prerequisites gate
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
      e2e: ${{ steps.check.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Evaluate prerequisites
        id: check
        run: |
          android=false; ios=false; e2e=false
          if { [ -d apps/rider-mobile/android ] || [ -d apps/driver-mobile/android ]; } && [ -n "$ANDROID_KEYSTORE" ]; then android=true; fi
          if { [ -d apps/rider-mobile/ios ] || [ -d apps/driver-mobile/ios ]; } && [ -n "$IOS_CERT" ]; then ios=true; fi
          if [ -n "$MAESTRO" ]; then e2e=true; fi
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "native gate → android=$android ios=$ios e2e=$e2e (all false is expected today; native jobs skip)"
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          IOS_CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          MAESTRO: ${{ secrets.MAESTRO_CLOUD_API_KEY }}

  # ===========================================================================
  # WHAT ACTUALLY RUNS: JS/TS verification, no native project required
  # ===========================================================================
  rn-verify:
    name: RN Verify (typecheck + jest + lint; no native project required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts (RN apps depend on @ubi/contracts dist)
        run: pnpm --filter @ubi/contracts build

      - name: Typecheck shared mobile packages
        run: |
          pnpm --filter @ubi/mobile-tokens exec tsc --noEmit
          pnpm --filter @ubi/mobile-ui exec tsc --noEmit
          pnpm --filter @ubi/mobile-core exec tsc --noEmit

      - name: Typecheck RN apps
        run: |
          pnpm --filter @ubi/rider-mobile exec tsc --noEmit
          pnpm --filter @ubi/driver-mobile exec tsc --noEmit

      - name: Jest (rider + driver)
        run: |
          pnpm --filter @ubi/rider-mobile exec jest
          pnpm --filter @ubi/driver-mobile exec jest

      - name: Lint (rider + driver)
        run: |
          pnpm --filter @ubi/rider-mobile exec eslint . --ext .ts,.tsx
          pnpm --filter @ubi/driver-mobile exec eslint . --ext .ts,.tsx

      - name: Bundler dry-run (documented gap, not enabled)
        # A Metro bundle build (react-native bundle --platform android/ios)
        # would be closer to real device evidence than tsc+jest, and needs no
        # native project directory. It does NOT run here: verified locally
        # (2026-09-21) that `react-native bundle` exits 1 in both apps with
        # "react-native depends on @react-native-community/cli for cli
        # commands" — that CLI package is not a devDependency of either app
        # (react-native's own bin only re-exports to it, it does not vendor
        # it). Adding it is an application package.json/lockfile change,
        # outside this prompt's writable scope (.github/workflows/**,
        # infrastructure/**, k8s/**, docs/**). Tracked in
        # docs/ops/NATIVE_RELEASE.md and docs/launch/GAP_REGISTER.md instead
        # of silently working around it or claiming this step passed.
        run: |
          echo "SKIPPED: react-native bundle cannot run here today."
          echo "Missing @react-native-community/cli devDependency in both apps' package.json."
          echo "See docs/ops/NATIVE_RELEASE.md for the verified failure and the fix."

  # ===========================================================================
  # GUARDED: real native builds, only when the prerequisites actually exist
  # ===========================================================================
  rn-android:
    name: RN Android (assembleRelease)
    needs: gate
    if: needs.gate.outputs.android == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rider-mobile, driver-mobile]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode signing keystore
        working-directory: apps/${{ matrix.app }}/android
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}

      - name: Gradle assembleRelease
        working-directory: apps/${{ matrix.app }}/android
        # Assumes android/app/build.gradle's signingConfigs.release reads
        # these exact env var names once the project is scaffolded (see
        # docs/ops/NATIVE_RELEASE.md) — set that wiring up there; never
        # hardcode a keystore path/password/alias in this workflow file.
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: rn-android-${{ matrix.app }}-${{ github.sha }}
          path: apps/${{ matrix.app }}/android/app/build/outputs/**/*.apk
          retention-days: 14

  rn-ios:
    name: RN iOS (archive)
    needs: gate
    if: needs.gate.outputs.ios == 'true'
    # Requires: a macOS runner (this repo has none self-hosted; macos-14 is a
    # GitHub-hosted runner, billed at a materially higher per-minute rate
    # than ubuntu-latest — see docs/ops/NATIVE_RELEASE.md). The gate job keeps
    # this from ever allocating a macOS runner until the prerequisites exist.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        app: [rider-mobile, driver-mobile]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pods
        working-directory: apps/${{ matrix.app }}/ios
        run: pod install

      - name: xcodebuild archive
        working-directory: apps/${{ matrix.app }}/ios
        # The scheme is whatever `react-native-community/cli init` named the
        # project during the scaffold in docs/ops/NATIVE_RELEASE.md — Xcode
        # names the scheme after the project, NOT "Release" (a configuration
        # name, not a scheme). The previous version of this file hardcoded
        # `-scheme Release`, which would not have matched a real generated
        # project. Set IOS_SCHEME_RIDER / IOS_SCHEME_DRIVER as repo variables
        # once the projects are scaffolded; there is no safe default, so an
        # unset variable fails loudly instead of silently building the wrong
        # target.
        run: |
          if [ "${{ matrix.app }}" = "rider-mobile" ]; then
            SCHEME="${{ vars.IOS_SCHEME_RIDER }}"
          else
            SCHEME="${{ vars.IOS_SCHEME_DRIVER }}"
          fi
          if [ -z "$SCHEME" ]; then
            echo "IOS_SCHEME_RIDER / IOS_SCHEME_DRIVER repo variable is not set for ${{ matrix.app }}." >&2
            exit 1
          fi
          WORKSPACE="$(ls ./*.xcworkspace | head -1)"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -archivePath "$PWD/build/${{ matrix.app }}.xcarchive" archive

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: rn-ios-${{ matrix.app }}-${{ github.sha }}
          path: apps/${{ matrix.app }}/ios/build/${{ matrix.app }}.xcarchive
          retention-days: 14

  rn-e2e:
    name: RN device E2E (Maestro)
    needs: gate
    if: needs.gate.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maestro flows (placeholder — not wired even when the secret exists)
        # Intentionally fails rather than fabricating a pass: nobody has
        # wired the real `maestro cloud` / device-farm invocation yet. Do not
        # remove this guard when adding MAESTRO_CLOUD_API_KEY — replace this
        # step with the real command in the same change.
        run: |
          echo "MAESTRO_CLOUD_API_KEY is set but no Maestro invocation is wired up in this workflow yet." >&2
          exit 1
