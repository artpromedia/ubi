# React Native native build + device E2E gate.
#
# This is the acceptance evidence the RN migration owner requires (handoff rule 30):
# real iOS + Android builds of BOTH apps and device E2E. It is SEPARATE from ci.yml
# and NOT part of the ci-success merge gate, because it cannot pass until two
# external prerequisites are met — honestly, they are not met in the environment
# that authored the RN apps:
#
#   1. The native projects (apps/*/android, apps/*/ios) do not exist yet. They are
#      generated by `npx expo prebuild` or the RN template on a machine WITH the
#      native toolchain (Android SDK / Xcode). The apps here are JS/TS-complete
#      (tsc + jest green in ci.yml's rn-mobile job) but have no android/ios dirs.
#   2. Signing: bundle id / applicationId / provisioning must equal the existing
#      Flutter app's, taken from the store consoles — never generated here.
#
# Wire this on a runner that has the toolchain + signing secrets, then move the
# migration from "incomplete" to "accepted" per FLUTTER_TO_RN_CUTOVER.md.
name: RN Native
on:
  workflow_dispatch: {}
  # push/pull_request intentionally omitted until runners + native projects exist,
  # so this never reports a false red on the merge gate.

jobs:
  rn-android:
    name: RN Android (assembleRelease)
    # Requires: Android SDK, the generated apps/*/android project, and signing.
    runs-on: ubuntu-latest
    if: ${{ false }} # enable when the android/ project + keystore secret exist
    strategy:
      matrix:
        app: [rider-mobile, driver-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pnpm install --frozen-lockfile
      - name: Generate native project if missing
        run: cd apps/${{ matrix.app }} && [ -d android ] || npx expo prebuild -p android --non-interactive
      - name: Gradle assembleRelease
        run: cd apps/${{ matrix.app }}/android && ./gradlew assembleRelease

  rn-ios:
    name: RN iOS (archive)
    # Requires: macOS runner + Xcode, the generated apps/*/ios project, and a
    # provisioning profile / signing certificate matching the Flutter app id.
    runs-on: macos-14
    if: ${{ false }} # enable on a macOS runner with signing configured
    strategy:
      matrix:
        app: [rider-mobile, driver-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate native project if missing
        run: cd apps/${{ matrix.app }} && [ -d ios ] || npx expo prebuild -p ios --non-interactive
      - name: Pods + archive
        run: |
          cd apps/${{ matrix.app }}/ios && pod install
          xcodebuild -workspace *.xcworkspace -scheme Release -configuration Release archive

  rn-e2e:
    name: RN device E2E (Maestro)
    runs-on: ubuntu-latest
    if: ${{ false }} # enable with an emulator/device farm; flows named in slices RN-01/RN-02
    steps:
      - name: Maestro flows (require an emulator/device farm)
        run: |
          echo "Flows named in slices RN-01/RN-02: auth_login_otp, lockstep_acceptance,"
          echo "process_death_restore, ask_review_confirm, travel_checkout, mandate_run."
