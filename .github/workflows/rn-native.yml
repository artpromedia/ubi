# React Native native build + device E2E gate (CC-B02).
#
# This is the acceptance evidence the RN migration owner requires (handoff
# rule 30): real iOS + Android builds of BOTH apps, plus device E2E. It is
# SEPARATE from ci.yml and NOT part of the ci-success merge gate: nothing in
# this file is (or should be made) a required branch-protection check, and no
# job here is allowed to report success as evidence of a signed store build or
# device run when it did not actually produce one.
#
# What runs unconditionally and for real on every trigger:
#   - `rn-verify`: install, build @ubi/contracts, typecheck shared mobile
#     packages + both apps, run both apps' Jest suites, lint both apps, and
#     produce real production Metro JS bundles (Android + iOS) for both apps.
#   - `rn-android`: runs `./gradlew assembleDebug` (no release signing, debug
#     applicationId `com.ubi.{rider,driver}.debug`, Google Services plugin
#     skipped unless real `google-services.json` is injected) on ubuntu-latest
#     for both apps as a real, non-gating native compilation check.
#
# What stays guarded on external store/signing/device-farm credentials:
#   - `rn-android-release` (`./gradlew assembleRelease`): requires real store
#     `ANDROID_APPLICATION_ID_{RIDER,DRIVER}`, release keystore secrets, and
#     real Firebase `GOOGLE_SERVICES_JSON_{RIDER,DRIVER}`.
#   - `rn-ios` (`xcodebuild archive` on `macos-14`): requires real store
#     `IOS_BUNDLE_ID_{RIDER,DRIVER}`, Apple distribution certificate/profile,
#     and real Firebase `GOOGLE_SERVICE_INFO_PLIST_{RIDER,DRIVER}`.
#   - `rn-e2e` (Maestro device farm): requires `MAESTRO_CLOUD_API_KEY` and real
#     Maestro Cloud invocation.
#   When credentials are absent, `gate` logs explicitly:
#     "not attempted: no signing identity / no device farm"
#   and the guarded jobs skip cleanly without allocating paid macOS/device
#   runners or fabricating release/device coverage.
name: RN Native

on:
  workflow_dispatch: {}
  pull_request:
    branches: [master, main, develop]
    paths:
      - "apps/rider-mobile/**"
      - "apps/driver-mobile/**"
      - "packages/mobile-core/**"
      - "packages/mobile-ui/**"
      - "packages/mobile-tokens/**"
      - "packages/contracts/**"
      - ".github/workflows/rn-native.yml"
  push:
    branches: [master, main, develop]
    paths:
      - "apps/rider-mobile/**"
      - "apps/driver-mobile/**"
      - "packages/mobile-core/**"
      - "packages/mobile-ui/**"
      - "packages/mobile-tokens/**"
      - "packages/contracts/**"
      - ".github/workflows/rn-native.yml"

env:
  NODE_VERSION: "22"

jobs:
  # ===========================================================================
  # GATE: evaluate external signing / store / device-farm prerequisites
  # ===========================================================================
  gate:
    name: Native prerequisites gate
    runs-on: ubuntu-latest
    outputs:
      android_debug: ${{ steps.check.outputs.android_debug }}
      android_release: ${{ steps.check.outputs.android_release }}
      ios: ${{ steps.check.outputs.ios }}
      e2e: ${{ steps.check.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Evaluate prerequisites
        id: check
        run: |
          android_debug=false; android_release=false; ios=false; e2e=false
          if [ -d apps/rider-mobile/android ] && [ -d apps/driver-mobile/android ]; then
            android_debug=true
          fi
          if [ "$android_debug" = "true" ] && [ -n "$ANDROID_KEYSTORE" ] && \
             [ -n "$ANDROID_APP_ID_RIDER" ] && [ -n "$ANDROID_APP_ID_DRIVER" ] && \
             [ -n "$GOOGLE_SERVICES_RIDER" ] && [ -n "$GOOGLE_SERVICES_DRIVER" ]; then
            android_release=true
          else
            echo "rn-android-release: not attempted: no signing identity / store applicationId / Firebase config"
          fi
          if [ -d apps/rider-mobile/ios ] && [ -d apps/driver-mobile/ios ] && \
             [ -n "$IOS_CERT" ] && [ -n "$IOS_BUNDLE_RIDER" ] && [ -n "$IOS_BUNDLE_DRIVER" ] && \
             [ -n "$GOOGLE_PLIST_RIDER" ] && [ -n "$GOOGLE_PLIST_DRIVER" ]; then
            ios=true
          else
            echo "rn-ios: not attempted: no signing identity / store bundleId / Firebase plist"
          fi
          if [ -n "$MAESTRO" ]; then
            e2e=true
          else
            echo "rn-e2e: not attempted: no device farm"
          fi
          echo "android_debug=$android_debug" >> "$GITHUB_OUTPUT"
          echo "android_release=$android_release" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "native gate → android_debug=$android_debug android_release=$android_release ios=$ios e2e=$e2e"
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_APP_ID_RIDER: ${{ vars.ANDROID_APPLICATION_ID_RIDER }}
          ANDROID_APP_ID_DRIVER: ${{ vars.ANDROID_APPLICATION_ID_DRIVER }}
          GOOGLE_SERVICES_RIDER: ${{ secrets.GOOGLE_SERVICES_JSON_RIDER }}
          GOOGLE_SERVICES_DRIVER: ${{ secrets.GOOGLE_SERVICES_JSON_DRIVER }}
          IOS_CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_BUNDLE_RIDER: ${{ vars.IOS_BUNDLE_ID_RIDER }}
          IOS_BUNDLE_DRIVER: ${{ vars.IOS_BUNDLE_ID_DRIVER }}
          GOOGLE_PLIST_RIDER: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_RIDER }}
          GOOGLE_PLIST_DRIVER: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DRIVER }}
          MAESTRO: ${{ secrets.MAESTRO_CLOUD_API_KEY }}

  # ===========================================================================
  # UNCONDITIONAL: JS/TS + Metro production bundle verification
  # ===========================================================================
  rn-verify:
    name: RN Verify (typecheck + jest + lint + Metro bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts (RN apps depend on @ubi/contracts dist)
        run: pnpm --filter @ubi/contracts build

      - name: Typecheck shared mobile packages
        run: |
          pnpm --filter @ubi/mobile-tokens exec tsc --noEmit
          pnpm --filter @ubi/mobile-ui exec tsc --noEmit
          pnpm --filter @ubi/mobile-core exec tsc --noEmit

      - name: Typecheck RN apps
        run: |
          pnpm --filter @ubi/rider-mobile exec tsc --noEmit
          pnpm --filter @ubi/driver-mobile exec tsc --noEmit

      - name: Jest (rider + driver)
        run: |
          pnpm --filter @ubi/rider-mobile exec jest
          pnpm --filter @ubi/driver-mobile exec jest

      - name: Lint (rider + driver)
        run: |
          pnpm --filter @ubi/rider-mobile exec eslint . --ext .ts,.tsx
          pnpm --filter @ubi/driver-mobile exec eslint . --ext .ts,.tsx

      - name: Metro JS bundle (Android + iOS, rider + driver)
        run: |
          mkdir -p "$RUNNER_TEMP/rn-bundles/rider-android" "$RUNNER_TEMP/rn-bundles/rider-ios" \
                   "$RUNNER_TEMP/rn-bundles/driver-android" "$RUNNER_TEMP/rn-bundles/driver-ios"
          pnpm --filter @ubi/rider-mobile exec react-native bundle \
            --platform android --dev false --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/rn-bundles/rider-android/index.android.bundle" \
            --assets-dest "$RUNNER_TEMP/rn-bundles/rider-android"
          pnpm --filter @ubi/rider-mobile exec react-native bundle \
            --platform ios --dev false --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/rn-bundles/rider-ios/main.jsbundle" \
            --assets-dest "$RUNNER_TEMP/rn-bundles/rider-ios"
          pnpm --filter @ubi/driver-mobile exec react-native bundle \
            --platform android --dev false --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/rn-bundles/driver-android/index.android.bundle" \
            --assets-dest "$RUNNER_TEMP/rn-bundles/driver-android"
          pnpm --filter @ubi/driver-mobile exec react-native bundle \
            --platform ios --dev false --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/rn-bundles/driver-ios/main.jsbundle" \
            --assets-dest "$RUNNER_TEMP/rn-bundles/driver-ios"
          test -s "$RUNNER_TEMP/rn-bundles/rider-android/index.android.bundle"
          test -s "$RUNNER_TEMP/rn-bundles/rider-ios/main.jsbundle"
          test -s "$RUNNER_TEMP/rn-bundles/driver-android/index.android.bundle"
          test -s "$RUNNER_TEMP/rn-bundles/driver-ios/main.jsbundle"

  # ===========================================================================
  # REAL NON-GATING CHECK: unsigned Android assembleDebug on ubuntu-latest
  # ===========================================================================
  rn-android:
    name: RN Android (assembleDebug, unsigned CI check)
    needs: gate
    if: needs.gate.outputs.android_debug == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rider-mobile, driver-mobile]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @ubi/contracts build

      - name: Gradle assembleDebug
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rn-android-debug-${{ matrix.app }}-${{ github.sha }}
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ===========================================================================
  # GUARDED: signed store release builds & device E2E (only when secrets exist)
  # ===========================================================================
  rn-android-release:
    name: RN Android (assembleRelease, signed)
    needs: gate
    if: needs.gate.outputs.android_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [rider-mobile, driver-mobile]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @ubi/contracts build

      - name: Materialize signing keystore and google-services.json
        working-directory: apps/${{ matrix.app }}/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          if [ "${{ matrix.app }}" = "rider-mobile" ]; then
            printf '%s' "$GOOGLE_SERVICES_RIDER" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_DRIVER" > app/google-services.json
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          GOOGLE_SERVICES_RIDER: ${{ secrets.GOOGLE_SERVICES_JSON_RIDER }}
          GOOGLE_SERVICES_DRIVER: ${{ secrets.GOOGLE_SERVICES_JSON_DRIVER }}

      - name: Gradle assembleRelease
        working-directory: apps/${{ matrix.app }}/android
        run: |
          if [ "${{ matrix.app }}" = "rider-mobile" ]; then
            export ANDROID_APPLICATION_ID="${{ vars.ANDROID_APPLICATION_ID_RIDER }}"
          else
            export ANDROID_APPLICATION_ID="${{ vars.ANDROID_APPLICATION_ID_DRIVER }}"
          fi
          ./gradlew assembleRelease --no-daemon
        env:
          REQUIRE_FIREBASE_CONFIG: "true"
          ANDROID_KEYSTORE_PATH: ../release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload signed APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: rn-android-release-${{ matrix.app }}-${{ github.sha }}
          path: apps/${{ matrix.app }}/android/app/build/outputs/**/*.apk
          retention-days: 14

  rn-ios:
    name: RN iOS (archive)
    needs: gate
    if: needs.gate.outputs.ios == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        app: [rider-mobile, driver-mobile]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @ubi/contracts build

      - name: Materialize GoogleService-Info.plist
        working-directory: apps/${{ matrix.app }}/ios
        run: |
          if [ "${{ matrix.app }}" = "rider-mobile" ]; then
            printf '%s' "$GOOGLE_PLIST_RIDER" > UbiRiderMobile/GoogleService-Info.plist
          else
            printf '%s' "$GOOGLE_PLIST_DRIVER" > UbiDriverMobile/GoogleService-Info.plist
          fi
        env:
          GOOGLE_PLIST_RIDER: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_RIDER }}
          GOOGLE_PLIST_DRIVER: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DRIVER }}

      - name: Pods
        working-directory: apps/${{ matrix.app }}/ios
        run: pod install

      - name: xcodebuild archive
        working-directory: apps/${{ matrix.app }}/ios
        run: |
          if [ "${{ matrix.app }}" = "rider-mobile" ]; then
            SCHEME="${{ vars.IOS_SCHEME_RIDER || 'UbiRiderMobile' }}"
            BUNDLE_ID="${{ vars.IOS_BUNDLE_ID_RIDER }}"
          else
            SCHEME="${{ vars.IOS_SCHEME_DRIVER || 'UbiDriverMobile' }}"
            BUNDLE_ID="${{ vars.IOS_BUNDLE_ID_DRIVER }}"
          fi
          if [ -z "$BUNDLE_ID" ]; then
            echo "IOS_BUNDLE_ID_RIDER / IOS_BUNDLE_ID_DRIVER repo variable is not set for ${{ matrix.app }}." >&2
            exit 1
          fi
          WORKSPACE="$(ls ./*.xcworkspace | head -1)"
          REQUIRE_FIREBASE_CONFIG=true IOS_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            IOS_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            -archivePath "$PWD/build/${{ matrix.app }}.xcarchive" archive

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: rn-ios-${{ matrix.app }}-${{ github.sha }}
          path: apps/${{ matrix.app }}/ios/build/${{ matrix.app }}.xcarchive
          retention-days: 14

  rn-e2e:
    name: RN device E2E (Maestro)
    needs: gate
    if: needs.gate.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maestro flows (placeholder — not wired even when the secret exists)
        run: |
          echo "MAESTRO_CLOUD_API_KEY is set but no Maestro invocation is wired up in this workflow yet." >&2
          exit 1
