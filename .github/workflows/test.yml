name: Testing Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  GO_VERSION: "1.24"

jobs:
  # Determine what changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      services: ${{ steps.filter.outputs.services }}
      apps: ${{ steps.filter.outputs.apps }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4

      # Shared inputs fan out explicitly below: a change to packages/database
      # (Prisma schema/migrations), packages/contracts (built into every Node
      # service + the RN apps) or packages/config-client (imported by several
      # services), or to the top-level contracts/ source (state-machines.json
      # / openapi — services/ride-service/internal/machine is a
      # hand-maintained Go port of contracts/state-machines.json, so it can
      # silently drift) must re-run the consumers' unit jobs on a
      # pull_request, not just on push. Without this, a schema or contract
      # change that only touches these shared paths sets services/go to
      # 'false' and the dependent unit-services/unit-go jobs are skipped on
      # the PR that introduced it (push events already run everything via the
      # `|| github.event_name == 'push'` clauses below, so this only changes
      # pull_request behaviour). packages/outbox is fanned out the same way:
      # travel, config, support and realtime-gateway (and several unit-services
      # entries) import @ubi/outbox, and realtime-gateway's suite drives its
      # consumer directly.
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
            services:
              - 'services/**'
              - '!services/ride-service/**'
              - '!services/delivery-service/**'
              - 'packages/database/**'
              - 'packages/config-client/**'
              - 'packages/contracts/**'
              - 'packages/outbox/**'
              - 'contracts/**'
            apps:
              - 'apps/**'
            go:
              - 'services/ride-service/**'
              - 'services/delivery-service/**'
              - 'packages/database/**'
              - 'contracts/**'

  # Lint all code
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        # Bounded concurrency: ten parallel eslint processes exhaust the
        # runner's memory and take the whole job down as "cancelled".
        run: pnpm exec turbo run lint --concurrency=4

      - name: Run Prettier check
        run: pnpm format:check

  # Type checking
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript
        # Bounded concurrency: parallel tsc processes are memory-hungry too.
        run: pnpm exec turbo run typecheck --concurrency=4

  # Unit tests for packages
  unit-packages:
    name: Unit Tests - Packages
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.packages == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      # @ubi/database and @ubi/testing define no test script at all, so they
      # have no place in a test matrix. @ubi/outbox is an integration suite by
      # design (FOR UPDATE SKIP LOCKED and pub/sub delivery only exist against
      # real Postgres/Redis), so this job provisions both; the other entries
      # simply ignore the idle services.
      matrix:
        package: [ui, utils, contracts, config-client, outbox]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubi
          POSTGRES_PASSWORD: ubi_dev_password
          POSTGRES_DB: ubi_outbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubi -d ubi_outbox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the package and its dependencies
        # The package itself is included (not just ^...) so generated inputs
        # like @ubi/contracts' machines.generated.ts exist before the tests.
        run: pnpm build --filter="@ubi/${{ matrix.package }}"

      - name: Run database migrations
        if: matrix.package == 'outbox'
        run: pnpm --filter @ubi/database exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ubi:ubi_dev_password@localhost:5432/ubi_outbox_test

      - name: Run unit tests
        # `test` is the script these packages actually define; test:unit never
        # existed here, and --coverage is not runnable (no coverage provider
        # installed in these workspaces).
        run: pnpm --filter="@ubi/${{ matrix.package }}" test
        env:
          CI: true
          OUTBOX_TEST_DATABASE_URL: postgresql://ubi:ubi_dev_password@localhost:5432/ubi_outbox_test
          OUTBOX_TEST_REDIS_URL: redis://localhost:6379

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/${{ matrix.package }}/coverage/lcov.info
          flags: package-${{ matrix.package }}
          fail_ci_if_error: false

  # Unit tests for Node.js services
  unit-services:
    name: Unit Tests - Services
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.services == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          [
            api-gateway,
            user-service,
            food-service,
            payment-service,
            notification-service,
          ]
    # payment-service's ledger tests assert behaviour that only exists in a
    # real database (the deferred double-entry trigger, row locks, idempotency
    # keys), so the job provisions PostGIS + Redis and applies the prisma
    # migrations. The other services' suites don't touch them; one uniform job
    # is simpler and the idle services are harmless.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubi
          POSTGRES_PASSWORD: ubi_dev_password
          POSTGRES_DB: ubi_wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubi -d ubi_wallet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build --filter="@ubi/${{ matrix.service }}^..."

      - name: Run database migrations
        run: DATABASE_URL=postgresql://ubi:ubi_dev_password@localhost:5432/ubi_wallet_test pnpm --filter @ubi/database exec prisma migrate deploy

      - name: Run unit tests
        # `test` is the script every service in this matrix actually defines
        # (test:unit only ever existed in payment-service). For
        # payment-service, `test` is the fuller suite that includes the
        # DB-backed ledger tests — the financial safety net — driven by
        # WALLET_TEST_DATABASE_URL below.
        run: pnpm --filter="@ubi/${{ matrix.service }}" test
        env:
          CI: true
          WALLET_TEST_DATABASE_URL: postgresql://ubi:ubi_dev_password@localhost:5432/ubi_wallet_test
          # notification-service's party directory reads Prisma-owned tables in
          # a migrated database; point it at this job's migrated one (its own
          # default, ubi_notify_test, is never created in CI).
          NOTIFY_TEST_DATABASE_URL: postgresql://ubi:ubi_dev_password@localhost:5432/ubi_wallet_test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/${{ matrix.service }}/coverage/lcov.info
          flags: service-${{ matrix.service }}
          fail_ci_if_error: false

  # The Node services below each read their OWN test-database variable
  # (TRAVEL_/GROWTH_/CONFIG_/SUPPORT_TEST_DATABASE_URL) rather than
  # payment-service's WALLET_TEST_DATABASE_URL, or need no infrastructure at
  # all (realtime-gateway), so each gets its own job instead of a
  # unit-services matrix entry. Every DB-backed job provisions a fresh
  # database named after the suite's own default, applies the full prisma
  # migration chain into it, and points the suite at it explicitly. No
  # continue-on-error, no skip-when-missing: each is a required input of
  # test-status below. There is no coverage upload step: these suites run
  # without a coverage provider, so there is no lcov file to upload.
  unit-travel:
    name: Unit Tests - travel-service
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.services == 'true' || github.event_name == 'push'
    # tests/payment-port.test.ts starts the REAL payment-service
    # (`tsx src/index.ts`) against this same database and Redis (its rate
    # limiter), so the job builds payment-service's workspace deps as well as
    # travel-service's, and provisions both containers.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubi
          POSTGRES_PASSWORD: ubi_dev_password
          POSTGRES_DB: ubi_travel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubi -d ubi_travel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build --filter="@ubi/travel-service^..." --filter="@ubi/payment-service^..."

      - name: Run database migrations
        run: DATABASE_URL=postgresql://ubi:ubi_dev_password@localhost:5432/ubi_travel_test pnpm --filter @ubi/database exec prisma migrate deploy

      - name: Run unit tests
        run: pnpm --filter="@ubi/travel-service" test
        env:
          CI: true
          TRAVEL_TEST_DATABASE_URL: postgresql://ubi:ubi_dev_password@localhost:5432/ubi_travel_test
          PAYMENT_TEST_REDIS_URL: redis://localhost:6379/15

  unit-ask:
    name: Unit Tests - ask-service
    runs-on: ubuntu-latest
    needs: [changes]
    # ride-service changes gate this job too: the suite builds and runs the
    # real ride-service binary (see below), so a ride-side change can break
    # the Ask -> ride contract.
    if: needs.changes.outputs.services == 'true' || needs.changes.outputs.go == 'true' || github.event_name == 'push'
    # The suite is DB-backed (grants, reviews, execution intents, ai_actions,
    # outbox) and starts REAL sibling services against this same database and
    # Redis: user-service (`tsx src/index.ts`, tests/grant-port-user-service
    # .test.ts — the /internal/grants mint contract), payment-service
    # (`tsx src/index.ts`) and a ride-service binary built from source with
    # `go build` (tests/ride-service-contract.test.ts — Ask -> ride with
    # signing enabled). So the job builds those services' workspace deps,
    # installs Go, and provisions both containers.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubi
          POSTGRES_PASSWORD: ubi_dev_password
          POSTGRES_DB: ubi_ask_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubi -d ubi_ask_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/ride-service/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build --filter="@ubi/ask-service^..." --filter="@ubi/user-service^..." --filter="@ubi/payment-service^..." --filter="@ubi/api-gateway^..."

      - name: Run database migrations
        run: DATABASE_URL=postgresql://ubi:ubi_dev_password@localhost:5432/ubi_ask_test pnpm --filter @ubi/database exec prisma migrate deploy

      - name: Run unit tests
        run: pnpm --filter="@ubi/ask-service" test
        env:
          CI: true
          ASK_TEST_DATABASE_URL: postgresql://ubi:ubi_dev_password@localhost:5432/ubi_ask_test
          ASK_TEST_REDIS_URL: redis://localhost:6379/4
          REDIS_URL: redis://localhost:6379/4

  unit-growth:
    name: Unit Tests - growth-service
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.services == 'true' || github.event_name == 'push'
    # The suite runs against real Postgres (unique idempotency keys, journal
    # rows, racing incentive postings). Redis is idle today — the service's
    # client is lazy and no test reaches it — but is provisioned so the job
    # matches the service's runtime dependencies.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubi
          POSTGRES_PASSWORD: ubi_dev_password
          POSTGRES_DB: ubi_growth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubi -d ubi_growth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build --filter="@ubi/growth-service^..."

      - name: Run database migrations
        run: DATABASE_URL=postgresql://ubi:ubi_dev_password@localhost:5432/ubi_growth_test pnpm --filter @ubi/database exec prisma migrate deploy

      - name: Run unit tests
        run: pnpm --filter="@ubi/growth-service" test
        env:
          CI: true
          GROWTH_TEST_DATABASE_URL: postgresql://ubi:ubi_dev_password@localhost:5432/ubi_growth_test
          REDIS_URL: redis://localhost:6379

  unit-config:
    name: Unit Tests - config-service
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.services == 'true' || github.event_name == 'push'
    # The integration tests truncate the config tables and read/clear the
    # ETag cache and invalidation channel in Redis. tests/global-setup.ts only
    # creates/migrates the database when it is missing, so after the explicit
    # migration step below it is a no-op here.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubi
          POSTGRES_PASSWORD: ubi_dev_password
          POSTGRES_DB: ubi_config_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubi -d ubi_config_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build --filter="@ubi/config-service^..."

      - name: Run database migrations
        run: DATABASE_URL=postgresql://ubi:ubi_dev_password@localhost:5432/ubi_config_test pnpm --filter @ubi/database exec prisma migrate deploy

      - name: Run unit tests
        run: pnpm --filter="@ubi/config-service" test
        env:
          CI: true
          CONFIG_TEST_DATABASE_URL: postgresql://ubi:ubi_dev_password@localhost:5432/ubi_config_test
          REDIS_URL: redis://localhost:6379

  unit-support:
    name: Unit Tests - support-service
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.services == 'true' || github.event_name == 'push'
    # The suite runs against real Postgres (case transitions, audit rows,
    # outbox). Redis is idle today — no test reaches it — but is provisioned
    # so the job matches the service's runtime dependencies.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubi
          POSTGRES_PASSWORD: ubi_dev_password
          POSTGRES_DB: ubi_support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubi -d ubi_support_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build --filter="@ubi/support-service^..."

      - name: Run database migrations
        run: DATABASE_URL=postgresql://ubi:ubi_dev_password@localhost:5432/ubi_support_test pnpm --filter @ubi/database exec prisma migrate deploy

      - name: Run unit tests
        run: pnpm --filter="@ubi/support-service" test
        env:
          CI: true
          SUPPORT_TEST_DATABASE_URL: postgresql://ubi:ubi_dev_password@localhost:5432/ubi_support_test
          REDIS_URL: redis://localhost:6379

  unit-realtime:
    name: Unit Tests - realtime-gateway
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.services == 'true' || github.event_name == 'push'
    # realtime-gateway's suite is hermetic by design: JWT/service-auth checks
    # and the marketplace outbox fan-out driven through an in-process fake
    # ioredis connection. It reads no database and opens no socket, so no
    # service containers or migrations are provisioned for it.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build --filter="@ubi/realtime-gateway^..."

      - name: Run unit tests
        run: pnpm --filter="@ubi/realtime-gateway" test
        env:
          CI: true

  # Unit tests for Go services
  unit-go:
    name: Unit Tests - Go Services
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service: [ride-service, delivery-service]
    # ride-service's test harness runs against live Postgres (PostGIS) + Redis
    # and expects the prisma-managed public tables, so the job provisions both
    # and applies the migrations first. delivery-service doesn't need them,
    # but one uniform job is simpler and the idle services are harmless.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ubi
          POSTGRES_PASSWORD: ubi_dev_password
          POSTGRES_DB: ubi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubi -d ubi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: DATABASE_URL=postgresql://ubi:ubi_dev_password@localhost:5432/ubi_test pnpm --filter @ubi/database exec prisma migrate deploy

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          RIDE_TEST_DATABASE_URL: postgres://ubi:ubi_dev_password@localhost:5432/ubi_test?sslmode=disable
          RIDE_TEST_REDIS_URL: redis://localhost:6379/1
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/${{ matrix.service }}/coverage.out
          flags: go-${{ matrix.service }}
          fail_ci_if_error: false

  # NOTE: this pipeline once declared integration, consumer-pact, E2E and
  # performance jobs. None of them ever ran: they invoked root scripts that
  # do not exist (db:migrate:test, test:integration), pact suites that do
  # not compile, and an E2E flow that expects a fully seeded platform on
  # localhost:3000. They were removed so this pipeline only claims what it
  # verifies; reintroduce each job together with the work that makes it real.

  # Merge coverage reports
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-packages, unit-services, unit-go]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Upload combined coverage
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false

  # Final status check
  test-status:
    name: Test Status
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        unit-packages,
        unit-services,
        unit-travel,
        unit-ask,
        unit-growth,
        unit-config,
        unit-support,
        unit-realtime,
        unit-go,
      ]
    if: always()
    steps:
      - name: Check test results
        run: |
          # lint and typecheck always run, so anything but success is a
          # failure. The unit jobs may legitimately be skipped on pull
          # requests that do not touch their paths, so for them only a
          # failed or cancelled run is a failure.
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.unit-packages.result }}" == "failure" || "${{ needs.unit-packages.result }}" == "cancelled" ]] || \
             [[ "${{ needs.unit-services.result }}" == "failure" || "${{ needs.unit-services.result }}" == "cancelled" ]] || \
             [[ "${{ needs.unit-travel.result }}" == "failure" || "${{ needs.unit-travel.result }}" == "cancelled" ]] || \
             [[ "${{ needs.unit-ask.result }}" == "failure" || "${{ needs.unit-ask.result }}" == "cancelled" ]] || \
             [[ "${{ needs.unit-growth.result }}" == "failure" || "${{ needs.unit-growth.result }}" == "cancelled" ]] || \
             [[ "${{ needs.unit-config.result }}" == "failure" || "${{ needs.unit-config.result }}" == "cancelled" ]] || \
             [[ "${{ needs.unit-support.result }}" == "failure" || "${{ needs.unit-support.result }}" == "cancelled" ]] || \
             [[ "${{ needs.unit-realtime.result }}" == "failure" || "${{ needs.unit-realtime.result }}" == "cancelled" ]] || \
             [[ "${{ needs.unit-go.result }}" == "failure" || "${{ needs.unit-go.result }}" == "cancelled" ]]; then
            echo "Some tests failed"
            exit 1
          fi
          echo "All tests passed!"
