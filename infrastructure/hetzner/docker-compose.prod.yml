# UBI Production Deployment - Hetzner Cloud
# Docker Compose for single-server or multi-server production deployment
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - Copy .env.example to .env and configure all variables
#   - Ensure SSL certificates are in place (or use Caddy auto-SSL)
#   - Run database migrations before starting services

services:
  # =============================================================================
  # REVERSE PROXY & SSL TERMINATION
  # =============================================================================

  caddy:
    image: caddy:2-alpine
    container_name: ubi-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-ubi.africa}
      - API_DOMAIN=${API_DOMAIN:-api.ubi.africa}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-admin.ubi.africa}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-gateway
      - web-app
      - admin-dashboard
    networks:
      - ubi-network
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # DATABASES
  # =============================================================================

  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: ubi-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ubi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ubi_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ubi} -d ${POSTGRES_DB:-ubi_production}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: ubi-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 512mb 
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M

  # =============================================================================
  # BACKEND SERVICES
  # =============================================================================

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    image: ubi/api-gateway:${IMAGE_TAG:-latest}
    container_name: ubi-api-gateway
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ubi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ubi_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGINS: https://${DOMAIN:-ubi.africa},https://${ADMIN_DOMAIN:-admin.ubi.africa}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Service Discovery
      USER_SERVICE_URL: http://user-service:3001
      RIDE_SERVICE_URL: http://ride-service:3002
      FOOD_SERVICE_URL: http://food-service:3003
      DELIVERY_SERVICE_URL: http://delivery-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    image: ubi/user-service:${IMAGE_TAG:-latest}
    container_name: ubi-user-service
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ubi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ubi_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M

  ride-service:
    build:
      context: ../..
      dockerfile: services/ride-service/Dockerfile
    image: ubi/ride-service:${IMAGE_TAG:-latest}
    container_name: ubi-ride-service
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      ENVIRONMENT: production
      PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ubi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ubi_production}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  food-service:
    build:
      context: ../..
      dockerfile: services/food-service/Dockerfile
    image: ubi/food-service:${IMAGE_TAG:-latest}
    container_name: ubi-food-service
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-ubi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ubi_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M

  delivery-service:
    build:
      context: ../..
      dockerfile: services/delivery-service/Dockerfile
    image: ubi/delivery-service:${IMAGE_TAG:-latest}
    container_name: ubi-delivery-service
    restart: unless-stopped
    expose:
      - "3004"
    environment:
      ENVIRONMENT: production
      PORT: "3004"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ubi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ubi_production}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    image: ubi/payment-service:${IMAGE_TAG:-latest}
    container_name: ubi-payment-service
    restart: unless-stopped
    expose:
      - "3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER:-ubi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ubi_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Payment Provider Keys (Stripe, Paystack, M-Pesa, etc.)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    image: ubi/notification-service:${IMAGE_TAG:-latest}
    container_name: ubi-notification-service
    restart: unless-stopped
    expose:
      - "3006"
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_URL: postgresql://${POSTGRES_USER:-ubi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ubi_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Notification Provider Keys
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M

  # =============================================================================
  # FRONTEND APPLICATIONS
  # =============================================================================

  web-app:
    build:
      context: ../..
      dockerfile: apps/web-app/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-api.ubi.africa}
    image: ubi/web-app:${IMAGE_TAG:-latest}
    container_name: ubi-web-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-api.ubi.africa}
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  admin-dashboard:
    build:
      context: ../..
      dockerfile: apps/admin-dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-api.ubi.africa}
    image: ubi/admin-dashboard:${IMAGE_TAG:-latest}
    container_name: ubi-admin-dashboard
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-api.ubi.africa}
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # =============================================================================
  # OBJECT STORAGE (S3-compatible)
  # =============================================================================

  minio:
    image: minio/minio:latest
    container_name: ubi-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_DOMAIN: storage.${DOMAIN:-ubi.africa}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # =============================================================================
  # MONITORING & OBSERVABILITY
  # =============================================================================

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ubi-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  grafana:
    image: grafana/grafana:10.2.2
    container_name: ubi-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:-ubi.africa}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # =============================================================================
  # LOG AGGREGATION
  # =============================================================================

  loki:
    image: grafana/loki:2.9.2
    container_name: ubi-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  promtail:
    image: grafana/promtail:2.9.2
    container_name: ubi-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - ubi-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  ubi-network:
    driver: bridge
    name: ubi-network
    ipam:
      config:
        - subnet: 172.28.0.0/16
