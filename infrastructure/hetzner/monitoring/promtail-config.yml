# Promtail Configuration for Log Collection

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[a-zA-Z0-9][a-zA-Z0-9_.-]+))
          source: tag
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          tag:
          stream:
          container_name:
      - output:
          source: output

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  # UBI Application logs
  - job_name: ubi-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only keep UBI containers
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(ubi-.*)"
        action: keep
      # Set container name label
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # Set service label from container name
      - source_labels: ["__meta_docker_container_name"]
        regex: "/ubi-(.*)"
        target_label: service
      # Set environment label
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project

    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            level: level
            msg: msg
            message: message
            error: error
            timestamp: timestamp
            service: service
            requestId: requestId
            userId: userId
      # Set log level as label
      - labels:
          level:
          service:
      # Set timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - Unix
      # Output the message
      - output:
          source: msg

  # Caddy access logs
  - job_name: caddy
    static_configs:
      - targets:
          - localhost
        labels:
          job: caddy
          __path__: /var/log/caddy/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            ts: ts
            logger: logger
            msg: msg
            request: request
            duration: duration
            status: status
      - labels:
          level:
          logger:
      - timestamp:
          source: ts
          format: Unix
